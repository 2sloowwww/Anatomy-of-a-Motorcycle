<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">SIX PARTS, ONE PHYSICS UNDERNEATH</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- six source boxes on left, stacked -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">
    <rect x="50" y="70" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="87" fill="#22252B" font-weight="700">PT. II — ENGINE</text>
    <text x="60" y="102">torque, rotation</text>

    <rect x="50" y="122" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="139" fill="#22252B" font-weight="700">PT. III — TRANSMISSION</text>
    <text x="60" y="154">rotating mass</text>

    <rect x="50" y="174" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="191" fill="#22252B" font-weight="700">PT. IV — CHASSIS</text>
    <text x="60" y="206">lean, trail</text>

    <rect x="50" y="226" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="243" fill="#22252B" font-weight="700">PT. V — SUSPENSION</text>
    <text x="60" y="258">unsprung mass</text>

    <rect x="50" y="278" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="295" fill="#22252B" font-weight="700">PT. VI — TYRES</text>
    <text x="60" y="310">friction, grip</text>

    <rect x="50" y="330" width="180" height="42" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
    <text x="60" y="347" fill="#22252B" font-weight="700">PT. VII — BRAKING</text>
    <text x="60" y="362">weight transfer</text>
  </g>

  <!-- converging lines to central node -->
  <g stroke="#33505E" stroke-width="1.6" fill="none">
    <path d="M 230 91 Q 400 91 460 250"/>
    <path d="M 230 143 Q 400 143 460 250"/>
    <path d="M 230 195 Q 400 195 460 250"/>
    <path d="M 230 247 L 460 250"/>
    <path d="M 230 299 Q 400 299 460 250"/>
    <path d="M 230 351 Q 400 351 460 250"/>
  </g>

  <!-- central node -->
  <circle cx="460" cy="250" r="8" fill="#AE3527"/>

  <!-- right side: unified physics box -->
  <rect x="500" y="150" width="240" height="200" rx="8" fill="#22252B"/>
  <text x="620" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#EEE8DA">PART VIII</text>
  <text x="620" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">FRICTION</text>
  <text x="620" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">CORNERING FORCES</text>
  <text x="620" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">LOAD TRANSFER</text>
  <text x="620" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">AERODYNAMICS</text>
  <text x="620" y="280" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">GYROSCOPIC EFFECTS</text>
  <text x="620" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#EEE8DA">INSTABILITY</text>
  <text x="620" y="325" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C876F">FULL, UNIFIED TREATMENT</text>

  <line x1="50" y1="440" x2="750" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="460" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">EVERY THREAD FROM PARTS II-VII, FOLLOWED TO ITS FULL CONCLUSION</text>
</svg>
