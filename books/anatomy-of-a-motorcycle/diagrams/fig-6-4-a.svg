<text class="tmb mid fade" data-i="2" x="330" y="498">ACCELERATING</text>
<text class="tmb fade" data-i="2" x="516" y="303">CORNERING</text>
<text class="tmb end fade" data-i="2" x="144" y="303">CORNERING</text>
<line class="fb fade" x1="434.7" y1="193.3" x2="434.7" y2="298"/>
<line class="fb fade" x1="434.7" y1="193.3" x2="330" y2="193.3"/>
<line class="g thick draw" data-i="3" x1="330" y1="298" x2="330" y2="193.3"/>
<line class="g thick draw" data-i="3" x1="330" y1="298" x2="434.7" y2="298"/>
<line class="a draw" data-i="3" x1="330" y1="298" x2="424.2" y2="203.8"/>
<polygon class="fill-a pop" data-i="4" points="434.7,193.3 415.3,199.5 428.5,212.7"/>
<circle class="fill-a pop" data-i="4" cx="434.7" cy="193.3" r="8"/>
<circle class="fill-b pop" data-i="4" cx="330" cy="150" r="8"/>
<circle class="fill-b pop" data-i="4" cx="478" cy="298" r="8"/>
<text class="tm tbl fade" data-i="4" x="346" y="138">ALL BRAKING</text>
<text class="tm tbl fade" data-i="4" x="492" y="284">ALL CORNERING</text>
<text class="tmb ta fade" data-i="5" x="448.7" y="181.3">TRAIL BRAKING</text>
<text class="tsm fade" data-i="5" x="448.7" y="201.3">shares the grip</text>
<text class="tsm end fade" data-i="6" x="318" y="250.7">braking part</text>
<text class="tsm mid fade" data-i="6" x="382.3" y="324">cornering part</text>
<text class="tmb fade" data-i="7" x="650" y="168">INSIDE THE CIRCLE</text>
<text class="ts fade" data-i="7" x="650" y="192">grip to spare</text>
<text class="tmb tg fade" data-i="8" x="650" y="242">ON THE EDGE</text>
<text class="ts fade" data-i="8" x="650" y="266">every bit of grip used</text>
<text class="tmb ta fade" data-i="9" x="650" y="316">OUTSIDE</text>
<text class="ts fade" data-i="9" x="650" y="340">the tyre slides</text>
<text class="ts mid fade" data-i="10" x="450" y="530">Braking and cornering draw from the same budget.</text>
</svg>
