<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">ONE COMPLETE, INTERCONNECTED ARGUMENT</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- motorcycle silhouette -->
  <ellipse cx="400" cy="330" rx="140" ry="16" fill="#8C876F" opacity="0.25"/>
  <circle cx="270" cy="290" r="34" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="530" cy="290" r="34" fill="none" stroke="#22252B" stroke-width="3"/>
  <path d="M 270 290 L 340 200 L 460 200 L 530 290" fill="none" stroke="#22252B" stroke-width="3"/>
  <rect x="360" y="180" width="80" height="26" rx="6" fill="#6B5A22"/>

  <!-- rider figure at center -->
  <circle cx="400" cy="120" r="16" fill="none" stroke="#AE3527" stroke-width="3"/>
  <line x1="400" y1="136" x2="400" y2="195" stroke="#AE3527" stroke-width="3.5"/>
  <text x="400" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#AE3527">RIDER</text>

  <!-- lines from rider to every system -->
  <line x1="400" y1="130" x2="270" y2="256" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="400" y1="130" x2="530" y2="256" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="400" y1="130" x2="400" y2="180" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="400" y1="130" x2="330" y2="220" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="400" y1="130" x2="470" y2="220" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>

  <text x="270" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#5A5748">SUSPENSION / SAG</text>
  <text x="530" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#5A5748">STEERING / LEAN</text>
  <text x="400" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#5A5748">THROTTLE / FUELLING</text>
  <text x="330" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#5A5748">BRAKES</text>
  <text x="470" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#5A5748">DRIVETRAIN</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">THE RIDER DOESN'T USE THE MACHINE — THE RIDER COMPLETES IT</text>
</svg>
