<text class="ts fade" data-i="8" x="40" y="128">The axis hits the ground AHEAD of the tyre.</text>
<text class="ts fade" data-i="8" x="40" y="154">That gap is trail. It drags the wheel straight,</text>
<text class="ts fade" data-i="8" x="40" y="180">the way a trolley caster follows its handle.</text>
<text class="tb fade" data-i="8" x="640" y="366">MORE TRAIL</text>
<text class="ts fade" data-i="8" x="640" y="388">steadier, slower to turn</text>
<text class="tb fade" data-i="9" x="640" y="418">LESS TRAIL</text>
<text class="ts fade" data-i="9" x="640" y="440">quicker, twitchier</text>
