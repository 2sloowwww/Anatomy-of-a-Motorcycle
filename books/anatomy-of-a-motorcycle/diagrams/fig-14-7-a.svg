<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">STYLE-LED, NOT PERFORMANCE-LED</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- cafe racer -->
  <text x="200" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">CAFE RACER</text>
  <ellipse cx="200" cy="200" rx="90" ry="14" fill="#8C876F" opacity="0.25"/>
  <circle cx="140" cy="180" r="24" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="260" cy="180" r="24" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 140 180 Q 180 130 220 150 L 260 180" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 205 150 L 220 165" stroke="#AE3527" stroke-width="3"/>
  <text x="200" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">LOW CLIP-ONS —</text>
  <text x="200" y="262" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">SAME STRAIN AS 14.2, DIFFERENT MOTIVE</text>

  <!-- scrambler -->
  <text x="600" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">SCRAMBLER</text>
  <ellipse cx="600" cy="200" rx="90" ry="14" fill="#8C876F" opacity="0.25"/>
  <circle cx="540" cy="180" r="24" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="660" cy="180" r="24" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 540 180 Q 580 140 620 150 L 660 180" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <rect x="640" y="130" width="10" height="40" fill="#8C876F"/>
  <text x="600" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">HIGH PIPE, KNOBBY LOOK —</text>
  <text x="600" y="262" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">NOT 14.6'S FULL SUSPENSION COMMITMENT</text>

  <line x1="400" y1="70" x2="400" y2="290" stroke="#33505E" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="150" y="330" width="500" height="55" rx="8" fill="none" stroke="#6B5A22" stroke-width="1.6"/>
  <text x="400" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">IDENTITY LEADS THE DESIGN BRIEF</text>
  <text x="400" y="370" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">THE PHYSICAL TRADE-OFFS ARE STILL JUST AS REAL</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">STYLE COMES FIRST — THE TRADE-OFFS FOLLOW, NOT THE OTHER WAY AROUND</text>
</svg>
