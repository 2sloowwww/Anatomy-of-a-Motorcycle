<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">THE SAME PATTERN, TRACED ACROSS THE BOOK</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <line x1="80" y1="240" x2="720" y2="240" stroke="#22252B" stroke-width="2.5"/>
  <polygon points="720,240 708,233 708,247" fill="#22252B"/>

  <!-- points along timeline -->
  <circle cx="150" cy="240" r="7" fill="#AE3527"/>
  <text x="150" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">PART II</text>
  <text x="150" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">COMPRESSION RATIO</text>
  <text x="150" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CH. 2.9</text>

  <circle cx="300" cy="240" r="7" fill="#AE3527"/>
  <text x="300" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">PART IV</text>
  <text x="300" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">FRAME FLEX</text>
  <text x="300" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CH. 4.9</text>

  <circle cx="450" cy="240" r="7" fill="#AE3527"/>
  <text x="450" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">PART V / VI</text>
  <text x="450" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">SPRING RATE / TREAD</text>
  <text x="450" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CH. 5.2 / 6.6</text>

  <circle cx="620" cy="240" r="9" fill="#22252B"/>
  <text x="620" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">PART XIV</text>
  <text x="620" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">WHOLE MOTORCYCLE</text>
  <text x="620" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CH. 14.1–14.9</text>

  <rect x="150" y="330" width="500" height="60" rx="8" fill="none" stroke="#6B5A22" stroke-width="1.6"/>
  <text x="400" y="355" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">SAME PATTERN AT EVERY SCALE:</text>
  <text x="400" y="373" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">BETTER AT ONE THING, WORSE AT EVERYTHING ELSE</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">NOT A LATE-BOOK CONCLUSION — PRESENT FROM THE START</text>
</svg>
