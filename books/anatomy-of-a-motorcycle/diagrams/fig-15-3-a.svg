  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">THREE COSTS BEYOND THE PRICE TAG, ALL SHAPED BY THE SAME ENGINEERING</text>
