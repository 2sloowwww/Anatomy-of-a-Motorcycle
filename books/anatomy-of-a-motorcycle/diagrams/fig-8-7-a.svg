<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">DRAG AND LIFT AT SPEED</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ground -->
  <line x1="80" y1="380" x2="720" y2="380" stroke="#33505E" stroke-width="2"/>

  <!-- motorcycle + rider simplified silhouette, facing right -->
  <ellipse cx="380" cy="360" rx="50" ry="20" fill="none" stroke="#22252B" stroke-width="3"/>
  <ellipse cx="560" cy="360" rx="50" ry="20" fill="none" stroke="#22252B" stroke-width="3"/>
  <path d="M 380 340 L 430 220 Q 470 190 520 210 L 560 340" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
  <!-- rider tucked -->
  <path d="M 440 220 Q 470 160 520 175 Q 500 210 470 225 Z" fill="#8C876F" stroke="#22252B" stroke-width="2"/>

  <!-- airflow lines over top -->
  <g stroke="#33505E" stroke-width="1.4" fill="none">
    <path d="M 250 200 Q 400 190 560 175 Q 620 172 680 178"/>
    <path d="M 250 240 Q 400 235 540 220 Q 610 218 680 225"/>
  </g>

  <!-- drag force arrow, pointing backward (left) at nose height -->
  <line x1="330" y1="270" x2="260" y2="270" stroke="#AE3527" stroke-width="3"/>
  <polygon points="260,270 274,263 274,277" fill="#AE3527"/>
  <text x="230" y="255" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#AE3527">DRAG (∝ v²)</text>

  <!-- lift force arrow pointing up from mid-body -->
  <line x1="470" y1="330" x2="470" y2="270" stroke="#6B5A22" stroke-width="3"/>
  <polygon points="470,270 463,284 477,284" fill="#6B5A22"/>
  <text x="480" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#6B5A22">LIFT</text>

  <!-- reduced normal load arrow at contact patches, shown thinner/lighter -->
  <line x1="380" y1="380" x2="380" y2="415" stroke="#33505E" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="380,415 374,403 386,403" fill="#33505E" fill-opacity="0.6"/>
  <line x1="560" y1="380" x2="560" y2="415" stroke="#33505E" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="560,415 554,403 566,403" fill="#33505E" fill-opacity="0.6"/>
  <text x="470" y="435" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">REDUCED NORMAL LOAD AT TYRES</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">DRAG COSTS ENGINE POWER; LIFT QUIETLY COSTS TYRE GRIP</text>
</svg>
