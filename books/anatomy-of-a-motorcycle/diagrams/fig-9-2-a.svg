<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">ABRUPT VS. SMOOTH CONTROL INPUT</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- TOP graph: abrupt -->
  <text x="150" y="90" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#AE3527">ABRUPT INPUT</text>
  <line x1="80" y1="170" x2="720" y2="170" stroke="#33505E" stroke-width="1.5"/>
  <line x1="80" y1="170" x2="80" y2="100" stroke="#33505E" stroke-width="1.5"/>
  <path d="M 80 165 L 300 165 L 320 105 L 340 165 L 720 165" fill="none" stroke="#AE3527" stroke-width="3"/>
  <text x="330" y="95" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#AE3527">SUDDEN SPIKE</text>
  <text x="720" y="188" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">TIME →</text>
  <text x="60" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748" transform="rotate(-90 60 140)">DEMAND</text>

  <!-- BOTTOM graph: smooth -->
  <text x="150" y="270" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#33505E">SMOOTH INPUT</text>
  <line x1="80" y1="350" x2="720" y2="350" stroke="#33505E" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="80" y2="280" stroke="#33505E" stroke-width="1.5"/>
  <path d="M 80 345 Q 250 345 320 300 Q 390 260 720 258" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="500" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#33505E">GRADUAL, STEADY RISE</text>
  <text x="720" y="368" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">TIME →</text>
  <text x="60" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748" transform="rotate(-90 60 320)">DEMAND</text>

  <!-- friction circle ceiling reference line on both -->
  <line x1="80" y1="110" x2="720" y2="110" stroke="#6B5A22" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="700" y="105" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#6B5A22">GRIP LIMIT</text>
  <line x1="80" y1="290" x2="720" y2="290" stroke="#6B5A22" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="700" y="285" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#6B5A22">GRIP LIMIT</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">SMOOTHNESS KEEPS DEMAND WELL CLEAR OF THE SAME GRIP LIMIT ABRUPTNESS RISKS</text>
</svg>
