<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aTravel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#5A5748"/>
    </marker>
    <marker id="aDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#33505E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="26" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="18" fill="#6B5A22" letter-spacing="0.3">SAME BUMP, TWO OUTCOMES</text>
  <line x1="160" y1="36" x2="640" y2="36" stroke="#8C876F" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- PANEL 1: NO SUSPENSION -->
  <!-- ============================================================ -->
  <text x="80" y="58" font-family="JetBrains Mono, monospace" font-size="13.5" font-weight="700" fill="#5A5748" letter-spacing="0.5">NO SUSPENSION — WHEEL RIGIDLY MOUNTED</text>

  <line x1="90" y1="76" x2="152" y2="76" stroke="#5A5748" stroke-width="2" marker-end="url(#aTravel)"/>
  <text x="158" y="80" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">TRAVEL</text>

  <!-- ground -->
  <path d="M 80 230 L 245 230 Q 290 163 330 160 Q 370 163 415 230 L 720 230" fill="none" stroke="#22252B" stroke-width="2.4"/>

  <!-- frame-height (rigid) reference -->
  <line x1="330" y1="75" x2="530" y2="75" stroke="#33505E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#33505E" font-weight="600">RIGID — FRAME HEIGHT FIXED</text>

  <!-- position A: on the bump -->
  <rect x="292" y="63" width="76" height="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <line x1="330" y1="87" x2="330" y2="112" stroke="#22252B" stroke-width="3"/>
  <circle cx="330" cy="136" r="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>

  <!-- position B: past the bump, airborne -->
  <rect x="492" y="63" width="76" height="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <line x1="530" y1="87" x2="530" y2="112" stroke="#22252B" stroke-width="3"/>
  <circle cx="530" cy="136" r="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>

  <!-- gap dimension -->
  <line x1="530" y1="162" x2="530" y2="228" stroke="#33505E" stroke-width="1.8" stroke-dasharray="5 3" marker-start="url(#aDim)" marker-end="url(#aDim)"/>
  <text x="540" y="200" font-family="JetBrains Mono, monospace" font-size="13" fill="#33505E" font-weight="600">GAP</text>

  <text x="530" y="252" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#AE3527">CONTACT LOST ON FAR SIDE</text>

  <!-- ============================================================ -->
  <!-- PANEL 2: WITH SUSPENSION -->
  <!-- ============================================================ -->
  <line x1="90" y1="470" x2="700" y2="470" stroke="#8C876F" stroke-width="1" opacity="0"/>

  <text x="80" y="278" font-family="JetBrains Mono, monospace" font-size="13.5" font-weight="700" fill="#5A5748" letter-spacing="0.5">WITH SUSPENSION — WHEEL FOLLOWS THE ROAD</text>

  <line x1="90" y1="296" x2="152" y2="296" stroke="#5A5748" stroke-width="2" marker-end="url(#aTravel)"/>
  <text x="158" y="300" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">TRAVEL</text>

  <!-- ground (identical bump, shifted down) -->
  <path d="M 80 450 L 245 450 Q 290 383 330 380 Q 370 383 415 450 L 720 450" fill="none" stroke="#22252B" stroke-width="2.4"/>

  <!-- frame-level reference (unchanged height across both positions) -->
  <line x1="330" y1="295" x2="530" y2="295" stroke="#33505E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#33505E" font-weight="600">FRAME STAYS LEVEL</text>

  <!-- position A: on the bump, spring compressed -->
  <rect x="292" y="283" width="76" height="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <polyline points="330,307 322,313 338,319 322,325 330,332" fill="none" stroke="#22252B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="330" cy="356" r="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
  <text x="330" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#6B5A22" font-weight="600"> </text>

  <!-- position B: past the bump, spring extended, wheel drops to meet ground -->
  <rect x="492" y="283" width="76" height="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <polyline points="530,307 518,317 542,327 518,337 542,347 518,357 542,367 518,377 542,387 530,402" fill="none" stroke="#22252B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="530" cy="426" r="24" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>

  <line x1="440" y1="355" x2="480" y2="345" stroke="#6B5A22" stroke-width="1.3"/>
  <text x="483" y="342" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B5A22" font-weight="600">SPRING</text>
  <text x="483" y="357" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B5A22" font-weight="600">COMPRESSES</text>

  <line x1="560" y1="360" x2="600" y2="345" stroke="#6B5A22" stroke-width="1.3"/>
  <text x="603" y="342" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B5A22" font-weight="600">SPRING</text>
  <text x="603" y="357" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B5A22" font-weight="600">EXTENDS</text>

  <text x="530" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#22252B">CONTINUOUS CONTACT THROUGH THE BUMP</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.1-A</text>
</svg>
