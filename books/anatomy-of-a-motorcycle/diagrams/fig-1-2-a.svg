<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#AE3527"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="21" fill="#6B5A22" letter-spacing="0.5">BASE OF SUPPORT — REAR VIEW AT REST</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <line x1="400" y1="80" x2="400" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="200" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">CAR</text>
  <text x="600" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">MOTORCYCLE</text>

  <!-- ground line -->
  <line x1="90" y1="360" x2="380" y2="360" stroke="#22252B" stroke-width="2"/>
  <line x1="420" y1="360" x2="710" y2="360" stroke="#22252B" stroke-width="2"/>

  <!-- ===================== LEFT: CAR (wide stance) ===================== -->
  <!-- wheels -->
  <circle cx="150" cy="345" r="18" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <circle cx="250" cy="345" r="18" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- body -->
  <rect x="120" y="220" width="160" height="100" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>

  <!-- CG -->
  <circle cx="200" cy="255" r="7" fill="#AE3527"/>
  <text x="210" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#AE3527" font-weight="600">CG</text>

  <!-- tipping envelope: dashed lines from each contact point up through CG height, forming wide triangle -->
  <line x1="150" y1="360" x2="320" y2="150" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="250" y1="360" x2="80" y2="150" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>

  <text x="200" y="395" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">WIDE BASE (150 → 250)</text>
  <text x="200" y="414" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#5A5748">MUST TILT FAR TO TIP</text>

  <!-- ===================== RIGHT: MOTORCYCLE (single line stance) ===================== -->
  <circle cx="600" cy="345" r="18" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <rect x="592" y="220" width="16" height="100" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>

  <!-- CG directly above single point -->
  <circle cx="600" cy="255" r="7" fill="#AE3527"/>
  <text x="610" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#AE3527" font-weight="600">CG</text>

  <!-- vertical dashed reference -->
  <line x1="600" y1="360" x2="600" y2="150" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- tiny lean angle showing instant instability -->
  <g transform="rotate(11 600 345)">
    <circle cx="600" cy="345" r="18" fill="none" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.7"/>
    <rect x="592" y="220" width="16" height="100" fill="none" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.7"/>
  </g>
  <path d="M 615 300 A 40 40 0 0 1 618 260" fill="none" stroke="#AE3527" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="628" y="290" font-family="JetBrains Mono, monospace" font-size="13" fill="#AE3527" font-weight="600">ANY LEAN AT</text>
  <text x="628" y="306" font-family="JetBrains Mono, monospace" font-size="13" fill="#AE3527" font-weight="600">ALL MOVES CG</text>
  <text x="628" y="322" font-family="JetBrains Mono, monospace" font-size="13" fill="#AE3527" font-weight="600">OFF THE LINE</text>

  <text x="600" y="395" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">SINGLE POINT — NO WIDTH</text>
  <text x="600" y="414" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#5A5748">ZERO LEAN TOLERANCE AT REST</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.2-A</text>
</svg>
