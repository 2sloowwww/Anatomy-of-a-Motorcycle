<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">THE FRICTION CIRCLE SHRINKS IN THE RAIN</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- concentric circles: dry, wet, first-minutes-of-rain -->
  <line x1="400" y1="250" x2="400" y2="90" stroke="#33505E" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="230" y1="250" x2="570" y2="250" stroke="#33505E" stroke-width="1.3" stroke-dasharray="5 4"/>

  <circle cx="400" cy="250" r="160" fill="none" stroke="#33505E" stroke-width="2.5"/>
  <text x="400" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#33505E">DRY CONDITIONS</text>

  <circle cx="400" cy="250" r="105" fill="none" stroke="#6B5A22" stroke-width="2.5"/>
  <text x="400" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#6B5A22">SUSTAINED RAIN</text>

  <circle cx="400" cy="250" r="60" fill="#AE3527" fill-opacity="0.15" stroke="#AE3527" stroke-width="2.5"/>
  <text x="400" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#AE3527">FIRST MINUTES</text>
  <text x="400" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">OF RAIN</text>

  <line x1="60" y1="440" x2="740" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="460" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">THE CIRCLE'S SHAPE DOESN'T CHANGE — ONLY ITS SIZE, AND SOMETIMES MOST AT THE START</text>
</svg>
