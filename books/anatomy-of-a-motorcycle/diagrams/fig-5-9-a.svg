<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowSignal59" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowFaint59" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#8C876F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="28" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.4">SPRUNG MASS VS. UNSPRUNG MASS</text>
  <text x="400" y="47" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">THE SUSPENSION IS THE BOUNDARY BETWEEN WHAT IT ISOLATES AND WHAT IT MUST ACCELERATE</text>

  <!-- ============================================================ -->
  <!-- SPRUNG MASS ZONE (upper) -->
  <!-- ============================================================ -->
  <rect x="55" y="80" width="690" height="215" fill="#6B5A22" fill-opacity="0.10" stroke="none"/>
  <text x="70" y="100" font-size="14" font-weight="700" fill="#6B5A22" letter-spacing="0.3">SPRUNG MASS — ISOLATED BY THE SUSPENSION</text>
  <text x="70" y="115" font-size="10.5" fill="#6B5A22">frame · engine · fuel · rider — protected from sudden road inputs</text>

  <!-- ============================================================ -->
  <!-- UNSPRUNG MASS ZONE (lower) -->
  <!-- ============================================================ -->
  <rect x="55" y="295" width="690" height="130" fill="#AE3527" fill-opacity="0.10" stroke="none"/>
  <text x="70" y="410" font-size="14" font-weight="700" fill="#AE3527" letter-spacing="0.3">UNSPRUNG MASS — MUST FOLLOW THE ROAD DIRECTLY</text>
  <text x="70" y="420" font-size="10.5" fill="#AE3527" opacity="0"> </text>

  <!-- boundary -->
  <line x1="55" y1="295" x2="745" y2="295" stroke="#33505E" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="750" y="291" font-size="10.5" font-weight="700" fill="#33505E">BOUNDARY</text>

  <!-- ============================================================ -->
  <!-- MOTORCYCLE SILHOUETTE (schematic side view) -->
  <!-- ============================================================ -->
  <!-- frame backbone -->
  <path d="M 300 210 L 380 165 L 470 165 L 520 205" fill="none" stroke="#22252B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tank -->
  <path d="M 330 190 Q 365 150 415 158 Q 440 162 435 190 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2.4"/>
  <!-- seat -->
  <path d="M 435 190 L 505 195 L 505 208 L 435 208 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
  <!-- rider (simplified) -->
  <circle cx="470" cy="130" r="16" fill="#E2D9C3" stroke="#22252B" stroke-width="2.4"/>
  <path d="M 470 146 L 465 195 M 465 195 L 440 210 M 465 195 L 460 220" fill="none" stroke="#22252B" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 470 155 L 500 175 M 470 155 L 445 172" fill="none" stroke="#22252B" stroke-width="3" stroke-linecap="round"/>

  <!-- engine block (sprung, but low) -->
  <rect x="345" y="210" width="90" height="60" rx="6" fill="#E2D9C3" stroke="#22252B" stroke-width="2.4"/>
  <text x="390" y="245" text-anchor="middle" font-size="10" fill="#5A5748">ENGINE</text>

  <!-- steering head / front fork -->
  <line x1="300" y1="210" x2="255" y2="330" stroke="#22252B" stroke-width="5.5" stroke-linecap="round"/>
  <rect x="243" y="270" width="24" height="46" fill="#EEE8DA" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- swingarm / rear -->
  <line x1="435" y1="255" x2="545" y2="300" stroke="#22252B" stroke-width="5.5" stroke-linecap="round"/>
  <!-- rear shock, straddling the boundary -->
  <line x1="480" y1="230" x2="500" y2="298" stroke="#22252B" stroke-width="4" stroke-linecap="round"/>
  <path d="M498,280 l-8,4 l11,4 l-11,4 l8,4" fill="none" stroke="#22252B" stroke-width="2" stroke-linejoin="round"/>

  <!-- front wheel + brake -->
  <circle cx="255" cy="352" r="52" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="255" cy="352" r="30" fill="none" stroke="#AE3527" stroke-width="2.6"/>
  <circle cx="255" cy="352" r="6" fill="#22252B"/>

  <!-- rear wheel + brake -->
  <circle cx="545" cy="352" r="52" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="545" cy="352" r="30" fill="none" stroke="#AE3527" stroke-width="2.6"/>
  <circle cx="545" cy="352" r="6" fill="#22252B"/>

  <!-- ground -->
  <line x1="60" y1="404" x2="740" y2="404" stroke="#22252B" stroke-width="2.4"/>

  <!-- bump under front wheel -->
  <path d="M 60 404 L 140 404 Q 190 340 255 336 Q 300 340 340 404 L 740 404" fill="none" stroke="#22252B" stroke-width="2.4"/>

  <!-- unsprung callouts -->
  <line x1="255" y1="404" x2="255" y2="380" stroke="#AE3527" stroke-width="1.3"/>
  <text x="180" y="440" font-size="11" font-weight="700" fill="#AE3527">WHEEL, TYRE,</text>
  <text x="180" y="453" font-size="11" font-weight="700" fill="#AE3527">BRAKE, AXLE</text>
  <line x1="255" y1="316" x2="200" y2="440" stroke="#AE3527" stroke-width="1" opacity="0"/>

  <line x1="255" y1="298" x2="255" y2="280" stroke="#AE3527" stroke-width="1.3"/>
  <text x="200" y="330" text-anchor="end" font-size="10.5" font-weight="700" fill="#AE3527">FORK SLIDER</text>
  <text x="200" y="342" text-anchor="end" font-size="10" fill="#AE3527">moves with wheel</text>

  <text x="600" y="440" font-size="11" font-weight="700" fill="#AE3527">REAR WHEEL, BRAKE, AXLE,</text>
  <text x="600" y="453" font-size="11" font-weight="700" fill="#AE3527">LOWER SWINGARM</text>

  <!-- sprung callouts -->
  <text x="530" y="140" font-size="11" font-weight="700" fill="#6B5A22">FRAME, ENGINE,</text>
  <text x="530" y="153" font-size="11" font-weight="700" fill="#6B5A22">FUEL, RIDER</text>

  <!-- bump acceleration arrows: unsprung reacts fast, sprung barely moves -->
  <line x1="255" y1="330" x2="255" y2="240" stroke="#AE3527" stroke-width="3" marker-end="url(#arrowSignal59)"/>
  <text x="262" y="270" font-size="12" font-weight="700" fill="#AE3527">ACCELERATES</text>
  <text x="262" y="284" font-size="12" font-weight="700" fill="#AE3527">RAPIDLY OVER BUMP</text>

  <line x1="390" y1="200" x2="390" y2="185" stroke="#8C876F" stroke-width="2" marker-end="url(#arrowFaint59)"/>
  <text x="398" y="182" font-size="10.5" font-weight="700" fill="#8C876F">BARELY MOVES —</text>
  <text x="398" y="195" font-size="10.5" font-weight="700" fill="#8C876F">ISOLATED BY SPRING/DAMPER</text>

  <text x="400" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#22252B">A KILOGRAM REMOVED BELOW THE LINE MATTERS FAR MORE THAN ONE REMOVED ABOVE IT</text>
  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.9-A</text>
</svg>
