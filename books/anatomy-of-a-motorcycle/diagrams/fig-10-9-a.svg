<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#22252B">THREE DISUSE-DRIVEN FAILURE MODES</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- simple stationary motorcycle silhouette -->
  <ellipse cx="230" cy="360" rx="34" ry="14" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <ellipse cx="530" cy="360" rx="34" ry="14" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 230 330 L 320 260 L 420 260 L 530 330" fill="none" stroke="#22252B" stroke-width="3"/>

  <!-- fuel tank degrading -->
  <ellipse cx="380" cy="245" rx="40" ry="20" fill="#8C876F" fill-opacity="0.4" stroke="#22252B" stroke-width="2"/>
  <line x1="360" y1="220" x2="380" y2="235" stroke="#6B5A22" stroke-width="1.5"/>
  <line x1="390" y1="215" x2="400" y2="230" stroke="#6B5A22" stroke-width="1.5"/>
  <text x="380" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#6B5A22">FUEL OXIDIZES</text>

  <!-- battery sulfating icon -->
  <rect x="255" y="290" width="30" height="25" rx="3" fill="#5A5748" stroke="#22252B" stroke-width="1.5"/>
  <line x1="230" y1="270" x2="260" y2="290" stroke="#AE3527" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="200" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#AE3527">BATTERY SULFATES</text>

  <!-- flat spot on tyre -->
  <path d="M 500 372 Q 530 385 560 372" fill="none" stroke="#AE3527" stroke-width="4"/>
  <text x="560" y="410" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#AE3527">TYRE FLAT-SPOTS</text>

  <line x1="50" y1="450" x2="750" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">SITTING STILL TRADES WEAR-THROUGH-USE FOR DEGRADATION-THROUGH-DISUSE</text>
</svg>
