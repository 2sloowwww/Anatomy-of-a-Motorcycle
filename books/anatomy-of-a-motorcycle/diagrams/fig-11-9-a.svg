<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">UNIDENTIFIED NOISE: WHAT DOES IT CORRELATE WITH?</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="310" y="65" width="180" height="38" rx="6" fill="#22252B"/>
  <text x="400" y="89" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#EEE8DA">UNKNOWN NOISE</text>

  <line x1="400" y1="103" x2="130" y2="140" stroke="#8C876F" stroke-width="1.4"/>
  <line x1="400" y1="103" x2="310" y2="140" stroke="#8C876F" stroke-width="1.4"/>
  <line x1="400" y1="103" x2="490" y2="140" stroke="#8C876F" stroke-width="1.4"/>
  <line x1="400" y1="103" x2="670" y2="140" stroke="#8C876F" stroke-width="1.4"/>

  <g font-family="JetBrains Mono, monospace" font-size="9">
    <rect x="70" y="140" width="120" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
    <text x="130" y="161" text-anchor="middle" fill="#22252B">TIED TO RPM</text>

    <rect x="250" y="140" width="120" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
    <text x="310" y="161" text-anchor="middle" fill="#22252B">TIED TO SPEED</text>

    <rect x="430" y="140" width="120" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
    <text x="490" y="161" text-anchor="middle" fill="#22252B">TIED TO A CONTROL</text>

    <rect x="610" y="140" width="120" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
    <text x="670" y="161" text-anchor="middle" fill="#22252B">TIED TO NOTHING</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#33505E">
    <line x1="130" y1="174" x2="130" y2="200" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="130" y="215" text-anchor="middle">ENGINE / CH. 2.2</text>

    <line x1="310" y1="174" x2="310" y2="200" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="310" y="215" text-anchor="middle">WHEEL / CH. 11.8</text>

    <line x1="490" y1="174" x2="490" y2="200" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="490" y="209" text-anchor="middle">CLUTCH / BRAKE</text>
    <text x="490" y="221" text-anchor="middle">CH. 11.5 / 11.7</text>

    <line x1="670" y1="174" x2="670" y2="200" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="670" y="209" text-anchor="middle">LOOSE FASTENER</text>
    <text x="670" y="221" text-anchor="middle">OR PANEL</text>
  </g>

  <!-- stethoscope localization detail -->
  <circle cx="670" cy="300" r="10" fill="none" stroke="#AE3527" stroke-width="2.2"/>
  <line x1="678" y1="308" x2="710" y2="340" stroke="#AE3527" stroke-width="2.2"/>
  <circle cx="716" cy="346" r="6" fill="none" stroke="#AE3527" stroke-width="2"/>
  <text x="670" y="330" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">TIP ON PART</text>
  <text x="716" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">EAR</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">CORRELATION NARROWS THE SYSTEM — A PROBE LOCALIZES THE PART</text>
</svg>
