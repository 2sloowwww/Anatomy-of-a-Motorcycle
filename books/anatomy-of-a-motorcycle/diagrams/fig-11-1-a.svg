<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">ONE SYMPTOM, THREE CAUSES, ONE CONFIRMED FIX</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- symptom box -->
  <rect x="330" y="75" width="140" height="45" rx="8" fill="#22252B"/>
  <text x="400" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#EEE8DA">SYMPTOM</text>

  <!-- three branches -->
  <line x1="400" y1="120" x2="180" y2="170" stroke="#8C876F" stroke-width="1.6"/>
  <line x1="400" y1="120" x2="400" y2="170" stroke="#8C876F" stroke-width="1.6"/>
  <line x1="400" y1="120" x2="620" y2="170" stroke="#8C876F" stroke-width="1.6"/>

  <!-- three cause boxes -->
  <rect x="110" y="170" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="180" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B">CAUSE A</text>

  <rect x="330" y="170" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="400" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B">CAUSE B</text>

  <rect x="550" y="170" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="620" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B">CAUSE C</text>

  <!-- tests -->
  <line x1="180" y1="210" x2="180" y2="250" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="120" y="250" width="120" height="35" rx="5" fill="#33505E" fill-opacity="0.15" stroke="#33505E" stroke-width="1.3"/>
  <text x="180" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#33505E">TEST A</text>

  <line x1="400" y1="210" x2="400" y2="250" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="340" y="250" width="120" height="35" rx="5" fill="#33505E" fill-opacity="0.15" stroke="#33505E" stroke-width="1.3"/>
  <text x="400" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#33505E">TEST B ✓</text>

  <line x1="620" y1="210" x2="620" y2="250" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="560" y="250" width="120" height="35" rx="5" fill="#33505E" fill-opacity="0.15" stroke="#33505E" stroke-width="1.3"/>
  <text x="620" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#33505E">TEST C</text>

  <!-- ruled out marks -->
  <line x1="150" y1="255" x2="210" y2="280" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="210" y1="255" x2="150" y2="280" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="590" y1="255" x2="650" y2="280" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="650" y1="255" x2="590" y2="280" stroke="#AE3527" stroke-width="2.5"/>

  <!-- converge to confirmed fix -->
  <line x1="400" y1="285" x2="400" y2="340" stroke="#AE3527" stroke-width="2.2"/>
  <polygon points="400,340 393,326 407,326" fill="#AE3527"/>
  <rect x="310" y="345" width="180" height="45" rx="8" fill="#AE3527"/>
  <text x="400" y="373" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#EEE8DA">CONFIRMED → REPAIR</text>

  <line x1="50" y1="440" x2="750" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="460" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">TESTS RULE CAUSES IN OR OUT — REPAIR FOLLOWS CONFIRMATION, NOT A GUESS</text>
</svg>
