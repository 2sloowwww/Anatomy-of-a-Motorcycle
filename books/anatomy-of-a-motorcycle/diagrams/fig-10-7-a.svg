<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">BATTERY, CHARGING SYSTEM, AND LOADS</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Battery -->
  <rect x="100" y="200" width="120" height="90" rx="8" fill="#5A5748" stroke="#22252B" stroke-width="2.5"/>
  <text x="160" y="235" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#EEE8DA">BATTERY</text>
  <text x="160" y="253" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#EEE8DA">(STORES ENERGY)</text>
  <rect x="130" y="192" width="14" height="10" fill="#AE3527"/>
  <rect x="175" y="192" width="14" height="10" fill="#22252B"/>

  <!-- Charging system -->
  <circle cx="400" cy="245" r="60" fill="none" stroke="#33505E" stroke-width="2.5"/>
  <text x="400" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#33505E">CHARGING</text>
  <text x="400" y="256" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#33505E">SYSTEM</text>
  <text x="400" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">ALTERNATOR + RECTIFIER</text>

  <!-- arrow battery <-> charging -->
  <line x1="220" y1="245" x2="335" y2="245" stroke="#6B5A22" stroke-width="2.2"/>
  <polygon points="220,245 232,239 232,251" fill="#6B5A22"/>
  <polygon points="335,245 323,239 323,251" fill="#6B5A22"/>
  <text x="277" y="230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6B5A22">REPLENISH</text>

  <!-- loads -->
  <rect x="600" y="130" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="670" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#22252B">IGNITION</text>

  <rect x="600" y="225" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="670" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#22252B">LIGHTS</text>

  <rect x="600" y="320" width="140" height="40" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="670" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#22252B">ACCESSORIES</text>

  <line x1="460" y1="245" x2="600" y2="150" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="460" y1="245" x2="600" y2="245" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="460" y1="245" x2="600" y2="340" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">A WEAK LINK ANYWHERE HERE UNDERMINES EVERY LOAD ON THE SYSTEM</text>
</svg>
