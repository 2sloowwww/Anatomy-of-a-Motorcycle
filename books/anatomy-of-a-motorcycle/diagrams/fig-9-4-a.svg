<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">NORMAL VS. EMERGENCY BRAKE RAMP</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- axes -->
  <line x1="110" y1="400" x2="110" y2="90" stroke="#33505E" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="700" y2="400" stroke="#33505E" stroke-width="1.5"/>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">TIME →</text>
  <text x="60" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748" transform="rotate(-90 60 245)">BRAKE FORCE</text>

  <!-- friction circle limit line -->
  <line x1="110" y1="130" x2="700" y2="130" stroke="#6B5A22" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="700" y="122" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#6B5A22">FRICTION CIRCLE LIMIT</text>

  <!-- normal stop: gradual ramp -->
  <path d="M 110 390 Q 400 320 690 200" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="450" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#33505E">NORMAL STOP (GRADUAL)</text>

  <!-- emergency stop: steep ramp approaching but not crossing limit -->
  <path d="M 110 390 Q 200 250 320 145" fill="none" stroke="#AE3527" stroke-width="3"/>
  <text x="330" y="140" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#AE3527">EMERGENCY (FAST, THRESHOLD)</text>

  <!-- overshoot line: crosses limit then drops (lockup/slide) -->
  <path d="M 110 390 Q 180 220 250 100 L 280 100 Q 320 180 400 350" fill="none" stroke="#8C876F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="420" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#8C876F">OVERSHOOT → LOCKUP → LESS FORCE</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">FASTEST STOP RIDES RIGHT AT THE LIMIT — NOT PAST IT</text>
</svg>
