<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">VOLTAGE TEST AT THE BATTERY, ENGINE RUNNING</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="300" y="65" width="200" height="38" rx="6" fill="#22252B"/>
  <text x="400" y="89" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#EEE8DA">MULTIMETER AT TERMINALS</text>

  <line x1="400" y1="103" x2="400" y2="128" stroke="#8C876F" stroke-width="1.4"/>

  <!-- voltage scale -->
  <line x1="120" y1="200" x2="680" y2="200" stroke="#33505E" stroke-width="2"/>
  <line x1="120" y1="192" x2="120" y2="208" stroke="#33505E" stroke-width="2"/>
  <line x1="680" y1="192" x2="680" y2="208" stroke="#33505E" stroke-width="2"/>
  <text x="120" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">~11V</text>
  <text x="680" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">~16V</text>

  <!-- three zones -->
  <rect x="120" y="215" width="160" height="34" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
  <text x="200" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">UNDERCHARGING</text>

  <rect x="280" y="215" width="240" height="34" fill="#E2D9C3" stroke="#AE3527" stroke-width="2"/>
  <text x="400" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">HEALTHY RANGE (13–14.5V)</text>

  <rect x="520" y="215" width="160" height="34" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2"/>
  <text x="600" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">OVERCHARGING</text>

  <!-- outcomes below -->
  <line x1="200" y1="249" x2="200" y2="280" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <rect x="110" y="284" width="180" height="42" rx="7" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.4"/>
  <text x="200" y="303" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">DIM HEADLIGHT AT IDLE,</text>
  <text x="200" y="317" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">BATTERY DRAINS OVER TIME</text>

  <line x1="400" y1="249" x2="400" y2="280" stroke="#AE3527" stroke-width="1.8"/>
  <circle cx="400" cy="300" r="16" fill="none" stroke="#AE3527" stroke-width="2.5"/>
  <text x="400" y="305" text-anchor="middle" fill="#AE3527" font-weight="700" font-family="JetBrains Mono, monospace" font-size="14">✓</text>
  <text x="400" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">SYSTEM HEALTHY — LOOK ELSEWHERE</text>

  <line x1="600" y1="249" x2="600" y2="280" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <rect x="510" y="284" width="180" height="42" rx="7" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.4"/>
  <text x="600" y="303" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">HOT BATTERY CASE,</text>
  <text x="600" y="317" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">SHORTENED BATTERY LIFE</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">ONE VOLTAGE TEST SEPARATES UNDERCHARGING, OVERCHARGING, AND HEALTHY</text>
</svg>
