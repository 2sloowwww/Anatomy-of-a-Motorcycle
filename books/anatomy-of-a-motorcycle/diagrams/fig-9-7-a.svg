<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">HANGING OFF REDUCES REQUIRED LEAN</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: centered rider -->
  <text x="200" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">CENTERED ON SEAT</text>

  <line x1="200" y1="400" x2="200" y2="400" stroke="#33505E" stroke-width="2"/>
  <g transform="rotate(-38 200 380)">
    <ellipse cx="200" cy="380" rx="50" ry="16" fill="none" stroke="#22252B" stroke-width="3"/>
    <rect x="185" y="220" width="30" height="160" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
    <circle cx="200" cy="210" r="16" fill="#8C876F" stroke="#22252B" stroke-width="2"/>
  </g>
  <circle cx="200" cy="200" r="6" fill="#AE3527"/>
  <text x="200" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">COMBINED CG</text>
  <line x1="200" y1="400" x2="200" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">STEEP LEAN ANGLE</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="460" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: hanging off -->
  <text x="600" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">HANGING OFF</text>

  <g transform="rotate(-22 600 400)">
    <ellipse cx="600" cy="400" rx="50" ry="16" fill="none" stroke="#22252B" stroke-width="3"/>
    <rect x="585" y="240" width="30" height="160" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
  </g>
  <!-- rider body shifted independently toward inside -->
  <circle cx="540" cy="230" r="16" fill="#8C876F" stroke="#22252B" stroke-width="2"/>
  <line x1="540" y1="246" x2="580" y2="300" stroke="#22252B" stroke-width="4"/>

  <circle cx="565" cy="270" r="6" fill="#AE3527"/>
  <text x="510" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">SAME CG POSITION</text>
  <line x1="600" y1="416" x2="600" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="600" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">SHALLOWER LEAN ANGLE</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">SAME CORNERING FORCE, SAME COMBINED CG — LESS MOTORCYCLE LEAN NEEDED</text>
</svg>
