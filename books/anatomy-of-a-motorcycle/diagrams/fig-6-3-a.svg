<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">THE CONTACT PATCH: UPRIGHT VS. LEANED</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: upright tyre, front view -->
  <text x="200" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#22252B">UPRIGHT</text>

  <!-- ground line -->
  <line x1="80" y1="330" x2="320" y2="330" stroke="#33505E" stroke-width="2"/>
  <!-- tyre cross-section (rounded profile) as circle-ish shape -->
  <circle cx="200" cy="255" r="80" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <!-- slight flattening at contact -->
  <path d="M 155 325 Q 200 335 245 325" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <!-- contact patch highlight -->
  <ellipse cx="200" cy="329" rx="26" ry="7" fill="#AE3527" fill-opacity="0.75"/>

  <!-- centerline dashed -->
  <line x1="200" y1="170" x2="200" y2="340" stroke="#33505E" stroke-width="1.3" stroke-dasharray="5 4"/>

  <text x="200" y="375" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">PATCH CENTERED, ROUGHLY ROUND</text>
  <text x="200" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">USES CENTER TREAD</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="460" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: leaned tyre -->
  <text x="600" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#22252B">LEANED INTO A CORNER</text>

  <line x1="480" y1="330" x2="720" y2="330" stroke="#33505E" stroke-width="2"/>

  <!-- lean angle reference (vertical dashed) -->
  <line x1="600" y1="170" x2="600" y2="330" stroke="#33505E" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- tyre rotated/leaned -->
  <g transform="rotate(-32 600 300)">
    <circle cx="600" cy="255" r="80" fill="none" stroke="#22252B" stroke-width="2.5"/>
    <path d="M 555 325 Q 600 335 645 325" fill="none" stroke="#22252B" stroke-width="2.5"/>
  </g>

  <!-- lean angle arc -->
  <path d="M 600 300 L 600 250" stroke="#33505E" stroke-width="1.2" fill="none"/>
  <path d="M 585 300 A 40 40 0 0 1 600 260" stroke="#33505E" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text x="562" y="288" font-family="JetBrains Mono, monospace" font-size="12" fill="#33505E">LEAN</text>

  <!-- contact patch, migrated toward shoulder, elongated + narrowed -->
  <ellipse cx="638" cy="331" rx="34" ry="5" fill="#AE3527" fill-opacity="0.75" transform="rotate(-18 638 331)"/>

  <text x="600" y="375" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">PATCH SHIFTS TOWARD SHOULDER,</text>
  <text x="600" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">NARROWS AND ELONGATES</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">THE PATCH MOVES AROUND THE TYRE'S CURVED PROFILE AS LEAN ANGLE CHANGES</text>
</svg>
