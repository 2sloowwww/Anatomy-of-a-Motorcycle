<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Two brake discs of different size with equal pad friction force, showing a longer lever arm produces more stopping torque.</title><desc id="d">A small and a large brake disc each get the same friction force F from the pad. The pad on the large disc sits twice as far from the axle, so the stopping torque F times r is twice as large.</desc>
<style>
svg.dg{--c-ink:var(--ink,#22252B);--c-soft:var(--ink-soft,#5A5748);--c-faint:var(--ink-faint,#8C876F);--c-sig:var(--signal,#AE3527);--c-blu:var(--blueprint,#33505E);--c-brs:var(--brass,#6B5A22);--c-paper:var(--paper,#EEE8DA);--c-deep:var(--paper-deep,#E2D9C3);--c-line:var(--line,rgba(34,37,43,.22))}
svg.dg .bgp{fill:var(--c-paper)}
