<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">DISC SIZE AND STOPPING TORQUE (LEVERAGE)</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: small disc -->
  <text x="200" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">SMALL DISC</text>

  <circle cx="200" cy="270" r="70" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="200" cy="270" r="6" fill="#22252B"/>
  <!-- lever arm to pad -->
  <line x1="200" y1="270" x2="200" y2="200" stroke="#33505E" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="182" y="190" width="36" height="22" rx="4" fill="#5A5748"/>
  <text x="200" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">PAD</text>

  <!-- force arrow at pad -->
  <line x1="218" y1="201" x2="250" y2="201" stroke="#AE3527" stroke-width="2.5"/>
  <polygon points="250,201 238,195 238,207" fill="#AE3527"/>
  <text x="255" y="205" font-family="JetBrains Mono, monospace" font-size="12" fill="#AE3527">F</text>

  <text x="205" y="240" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">r</text>
  <text x="200" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">SHORT LEVER ARM</text>
  <text x="200" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">LOWER TORQUE (F × r)</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="460" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: large disc -->
  <text x="600" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">LARGE DISC</text>

  <circle cx="600" cy="280" r="110" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="600" cy="280" r="6" fill="#22252B"/>
  <line x1="600" y1="280" x2="600" y2="172" stroke="#33505E" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="582" y="162" width="36" height="22" rx="4" fill="#5A5748"/>
  <text x="600" y="152" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">PAD</text>

  <!-- same-length force arrow -->
  <line x1="618" y1="173" x2="650" y2="173" stroke="#AE3527" stroke-width="2.5"/>
  <polygon points="650,173 638,167 638,179" fill="#AE3527"/>
  <text x="655" y="177" font-family="JetBrains Mono, monospace" font-size="12" fill="#AE3527">F</text>
  <text x="605" y="230" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">R (bigger)</text>

  <text x="600" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">LONGER LEVER ARM</text>
  <text x="600" y="422" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">HIGHER TORQUE (F × R)</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">SAME CLAMPING FORCE F — MORE TORQUE FROM LEVERAGE, NOT MORE FRICTION</text>
</svg>
