<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">THREE MOTIVES FOR MODIFYING A MOTORCYCLE</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Performance -->
  <rect x="90" y="90" width="190" height="260" rx="8" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.6"/>
  <text x="185" y="120" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">PERFORMANCE</text>
  <line x1="110" y1="135" x2="260" y2="135" stroke="#8C876F" stroke-width="1"/>
  <path d="M 130 260 L 160 220 L 190 235 L 240 170" fill="none" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="130" y1="260" x2="240" y2="260" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="185" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CLOSES A MEASURABLE</text>
  <text x="185" y="313" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CAPABILITY GAP</text>

  <!-- Comfort -->
  <rect x="305" y="90" width="190" height="260" rx="8" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.6"/>
  <text x="400" y="120" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">COMFORT</text>
  <line x1="325" y1="135" x2="475" y2="135" stroke="#8C876F" stroke-width="1"/>
  <circle cx="360" cy="220" r="18" fill="none" stroke="#22252B" stroke-width="2"/>
  <circle cx="440" cy="220" r="18" fill="none" stroke="#AE3527" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="378" y1="220" x2="422" y2="220" stroke="#8C876F" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="400" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">ASSUMED RIDER →</text>
  <text x="400" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">ACTUAL RIDER</text>
  <text x="400" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">CLOSES THE FIT GAP</text>
  <text x="400" y="313" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">BETWEEN RIDER AND MACHINE</text>

  <!-- Identity -->
  <rect x="520" y="90" width="190" height="260" rx="8" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.6"/>
  <text x="615" y="120" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">IDENTITY</text>
  <line x1="540" y1="135" x2="690" y2="135" stroke="#8C876F" stroke-width="1"/>
  <path d="M 590 260 L 590 200 Q 590 180 615 180 Q 640 180 640 200 L 640 260" fill="none" stroke="#6B5A22" stroke-width="3"/>
  <text x="615" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">EXPRESSES SOMETHING —</text>
  <text x="615" y="313" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">NOT A CAPABILITY CLAIM</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">EVALUATING ONE MOTIVE BY ANOTHER'S STANDARD IS WHERE BUDGETS GO BADLY</text>
</svg>
