<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aInk4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#22252B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.3">STEERING CONTROL LOOP — ONE CLOSED CIRCUIT</text>
  <line x1="140" y1="46" x2="660" y2="46" stroke="#8C876F" stroke-width="1"/>

  <!-- reference circle, faint -->
  <circle cx="380" cy="278" r="172" fill="none" stroke="#33505E" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.5"/>

  <!-- ===== loop arrows (clockwise) ===== -->
  <path d="M 440 137 Q 505 172 485 233" fill="none" stroke="#22252B" stroke-width="2.3" marker-end="url(#aInk4)"/>
  <path d="M 485 323 Q 505 383 440 419" fill="none" stroke="#22252B" stroke-width="2.3" marker-end="url(#aInk4)"/>
  <path d="M 320 419 Q 255 383 275 323" fill="none" stroke="#22252B" stroke-width="2.3" marker-end="url(#aInk4)"/>
  <path d="M 275 233 Q 255 172 320 137" fill="none" stroke="#22252B" stroke-width="2.3" marker-end="url(#aInk4)"/>

  <!-- center label -->
  <text x="380" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#6B5A22" font-weight="700">CLOSED LOOP —</text>
  <text x="380" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#6B5A22" font-weight="700">NO STEP OUTSIDE</text>

  <!-- ===== NODES ===== -->
  <!-- Top: Handlebar Input -->
  <rect x="295" y="80" width="170" height="58" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="380" y="104" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#22252B">HANDLEBAR</text>
  <text x="380" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#22252B">INPUT</text>

  <!-- Right: Chassis Geometry -->
  <rect x="465" y="233" width="170" height="58" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="550" y="257" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#22252B">CHASSIS</text>
  <text x="550" y="275" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="700" fill="#22252B">GEOMETRY</text>

  <!-- Bottom: Lean Angle -->
  <rect x="295" y="419" width="170" height="58" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="380" y="453" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#22252B">LEAN ANGLE</text>

  <!-- Left: Rider Body Position -->
  <rect x="95" y="233" width="180" height="58" rx="7" fill="#E2D9C3" stroke="#AE3527" stroke-width="2.4"/>
  <text x="185" y="257" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#AE3527">RIDER BODY</text>
  <text x="185" y="275" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#AE3527">POSITION</text>

  <!-- ===== outside: passive observer, crossed out ===== -->
  <rect x="655" y="90" width="120" height="44" rx="6" fill="none" stroke="#8C876F" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="715" y="108" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#8C876F">PASSIVE</text>
  <text x="715" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#8C876F">OBSERVER</text>

  <line x1="465" y1="100" x2="650" y2="105" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="590" y1="93" x2="610" y2="113" stroke="#AE3527" stroke-width="2.4"/>
  <line x1="610" y1="93" x2="590" y2="113" stroke="#AE3527" stroke-width="2.4"/>
  <text x="600" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527" font-weight="600">NO EXIT ARROW</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.4-A</text>
</svg>
