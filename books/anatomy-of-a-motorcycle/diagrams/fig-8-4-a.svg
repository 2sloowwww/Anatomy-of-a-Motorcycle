<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">REQUIRED LEAN ANGLE VS. SPEED AND RADIUS</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- axes -->
  <line x1="110" y1="400" x2="110" y2="90" stroke="#33505E" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="700" y2="400" stroke="#33505E" stroke-width="1.5"/>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">SPEED →</text>
  <text x="60" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748" transform="rotate(-90 60 245)">REQUIRED LEAN ANGLE</text>

  <!-- tight radius curve (steeper) -->
  <path d="M 110 385 Q 300 260 520 110" fill="none" stroke="#AE3527" stroke-width="3"/>
  <text x="480" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#AE3527">TIGHT RADIUS</text>

  <!-- wide radius curve (gentler) -->
  <path d="M 110 395 Q 400 350 680 260" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="600" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#33505E">WIDE RADIUS</text>

  <!-- countersteering input annotation -->
  <line x1="250" y1="330" x2="250" y2="400" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="250" cy="330" r="5" fill="#6B5A22"/>
  <text x="250" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B5A22">BRIEF COUNTERSTEER</text>
  <text x="250" y="313" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">REACHES THIS ANGLE</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">COUNTERSTEERING REACHES WHATEVER LEAN ANGLE THIS RELATIONSHIP FIXES</text>
</svg>
