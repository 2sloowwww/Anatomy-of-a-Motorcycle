<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<defs>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22252B"/>
  </marker>
  <marker id="arrowSignal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#AE3527"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33505E"/>
  </marker>
</defs>

<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B" letter-spacing="0.5">ONE STROKE, ONE POSITION</text>
<text x="400" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5748">The shift drum's grooves move the forks; the ratchet lets it advance only one notch at a time</text>

<!-- ============ SHIFT DRUM ============ -->
<text x="255" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#22252B">SHIFT DRUM</text>

<ellipse cx="95" cy="230" rx="16" ry="55" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<rect x="95" y="175" width="340" height="110" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<line x1="435" y1="220" x2="569" y2="220" stroke="#22252B" stroke-width="8"/>
<line x1="435" y1="240" x2="569" y2="240" stroke="#33505E" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- cam grooves (fixed reference tracks) -->
<path d="M112,205 L150,205 L170,188 L210,188 L228,205 L266,205 L286,222 L324,222 L342,205 L382,205 L400,213 L418,213"
      fill="none" stroke="#33505E" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M112,255 L156,255 L176,272 L214,272 L232,255 L270,255 L288,238 L326,238 L346,255 L386,255 L418,255"
      fill="none" stroke="#33505E" stroke-width="2" stroke-dasharray="6 4"/>

<text x="255" y="300" text-anchor="middle" font-size="11.5" fill="#33505E">CAM GROOVE &#8212; FIXED TRACK</text>

<!-- fork pins riding in grooves -->
<circle cx="228" cy="205" r="7" fill="#22252B"/>
<circle cx="288" cy="238" r="7" fill="#22252B"/>

<!-- selector fork 1: rod up to dog collar -->
<line x1="228" y1="205" x2="228" y2="140" stroke="#22252B" stroke-width="2.5"/>
<line x1="205" y1="140" x2="251" y2="140" stroke="#22252B" stroke-width="2.5"/>
<rect x="205" y="140" width="46" height="18" fill="#AE3527" stroke="#22252B" stroke-width="1.5"/>
<text x="228" y="132" text-anchor="middle" font-size="10.5" fill="#5A5748">TO DOG RING</text>

<!-- selector fork 2: rod up to dog collar -->
<line x1="288" y1="238" x2="288" y2="160" stroke="#22252B" stroke-width="2.5"/>
<line x1="265" y1="160" x2="311" y2="160" stroke="#22252B" stroke-width="2.5"/>
<rect x="265" y="160" width="46" height="18" fill="#8C876F" stroke="#22252B" stroke-width="1.5"/>

<text x="150" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">SELECTOR FORKS</text>
<line x1="228" y1="215" x2="180" y2="313" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 2"/>

<!-- ============ RATCHET & PAWL ============ -->
<text x="615" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#22252B">RATCHET &amp; PAWL</text>

<!-- star wheel, coaxial with drum end -->
<circle cx="615" cy="230" r="30" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<circle cx="615" cy="230" r="46" fill="none" stroke="#22252B" stroke-width="10" stroke-dasharray="9 8"/>
<circle cx="615" cy="230" r="6" fill="#22252B"/>

<!-- pawl engaging a tooth -->
<path d="M655,205 L700,180" stroke="#22252B" stroke-width="3"/>
<path d="M652,213 L662,196 L648,192 Z" fill="#AE3527"/>
<circle cx="700" cy="180" r="5" fill="#22252B"/>

<!-- shift lever / stroke arrow -->
<line x1="700" y1="180" x2="740" y2="270" stroke="#22252B" stroke-width="3"/>
<circle cx="740" cy="270" r="8" fill="none" stroke="#22252B" stroke-width="2.5"/>
<path d="M735,318 A45,45 0 0 1 700,275" fill="none" stroke="#AE3527" stroke-width="2.2" marker-end="url(#arrowSignal)"/>
<text x="757" y="330" text-anchor="middle" font-size="11" fill="#AE3527" font-weight="700">STROKE</text>

<!-- rotation of drum, one notch -->
<path d="M580,272 A40,40 0 0 0 615,282" fill="none" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowSignal)"/>
<text x="615" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527">ONE STROKE = ONE POSITION</text>
<text x="615" y="370" text-anchor="middle" font-size="11" fill="#5A5748">DRUM CANNOT SKIP A GEAR</text>

<line x1="615" y1="260" x2="615" y2="400" stroke="#8C876F" stroke-width="1" stroke-dasharray="2 3"/>

<text x="400" y="470" text-anchor="middle" font-size="14" font-weight="600" fill="#6B5A22">SEQUENTIAL BY MECHANISM, NOT BY CHOICE</text>
</svg>
