<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">PASSING A TRUCK: THREE AIRFLOW ZONES</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ground -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#33505E" stroke-width="2"/>

  <!-- truck (large rectangle) -->
  <rect x="500" y="230" width="200" height="140" fill="#5A5748" stroke="#22252B" stroke-width="2"/>
  <text x="600" y="305" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#EEE8DA">TRUCK</text>
  <circle cx="540" cy="378" r="14" fill="#22252B"/>
  <circle cx="660" cy="378" r="14" fill="#22252B"/>

  <!-- three motorcycle positions along the pass, small icons -->
  <!-- position 1: bow wave push (before truck, pushed away/left) -->
  <g>
    <ellipse cx="380" cy="378" rx="26" ry="10" fill="none" stroke="#22252B" stroke-width="2.2"/>
    <circle cx="380" cy="378" r="3" fill="#22252B"/>
    <line x1="380" y1="360" x2="350" y2="345" stroke="#AE3527" stroke-width="2.5"/>
    <polygon points="350,345 364,346 358,358" fill="#AE3527"/>
  </g>
  <text x="380" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#AE3527">1. BOW-WAVE PUSH</text>

  <!-- position 2: turbulent wake pull (alongside truck, pulled toward it/right) -->
  <g>
    <ellipse cx="480" cy="378" rx="26" ry="10" fill="none" stroke="#22252B" stroke-width="2.2"/>
    <circle cx="480" cy="378" r="3" fill="#22252B"/>
    <line x1="480" y1="360" x2="510" y2="345" stroke="#33505E" stroke-width="2.5"/>
    <polygon points="510,345 496,344 500,357" fill="#33505E"/>
  </g>
  <text x="480" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#33505E">2. WAKE PULL</text>

  <!-- position 3: separation disturbance (past truck, pushed away again) -->
  <g>
    <ellipse cx="720" cy="378" rx="26" ry="10" fill="none" stroke="#22252B" stroke-width="2.2"/>
    <circle cx="720" cy="378" r="3" fill="#22252B"/>
    <line x1="720" y1="360" x2="750" y2="340" stroke="#6B5A22" stroke-width="2.5"/>
    <polygon points="750,340 736,340 742,352" fill="#6B5A22"/>
  </g>
  <text x="720" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#6B5A22">3. SEPARATION</text>

  <!-- direction of travel arrow -->
  <line x1="120" y1="220" x2="220" y2="220" stroke="#8C876F" stroke-width="2"/>
  <polygon points="220,220 208,213 208,227" fill="#8C876F"/>
  <text x="170" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C876F">TRAVEL DIRECTION</text>

  <line x1="50" y1="460" x2="750" y2="460" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="478" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">THREE OPPOSING FORCES IN ONE OR TWO SECONDS, NOT ONE STEADY PUSH</text>
</svg>
