<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">A MAINTENANCE LOG REVEALS TRENDS</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- log page mock-up -->
  <rect x="70" y="80" width="300" height="340" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#22252B">MAINTENANCE LOG</text>
  <line x1="90" y1="115" x2="350" y2="115" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">
    <text x="90" y="140">DATE — MILEAGE — CONDITIONS</text>
    <text x="90" y="160">03/14 — 8,200km — dry, mixed</text>
    <text x="90" y="175">TREAD: 5.2mm</text>

    <text x="90" y="205">04/28 — 9,850km — off-road x3</text>
    <text x="90" y="220">TREAD: 4.1mm</text>

    <text x="90" y="250">06/02 — 10,900km — off-road x5</text>
    <text x="90" y="265">TREAD: 2.9mm</text>

    <text x="90" y="295">07/15 — 11,600km — off-road x6</text>
    <text x="90" y="310">TREAD: 1.8mm ⚠</text>
  </g>

  <line x1="90" y1="335" x2="350" y2="335" stroke="#8C876F" stroke-width="1"/>
  <text x="220" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#AE3527" font-weight="700">TREND: FASTER WEAR</text>
  <text x="220" y="376" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#AE3527">TIED TO OFF-ROAD USE</text>

  <!-- right side: trend graph -->
  <line x1="450" y1="400" x2="450" y2="120" stroke="#33505E" stroke-width="1.5"/>
  <line x1="450" y1="400" x2="720" y2="400" stroke="#33505E" stroke-width="1.5"/>
  <text x="450" y="418" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">TIME →</text>
  <text x="430" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748" transform="rotate(-90 430 260)">TREAD DEPTH</text>

  <circle cx="490" cy="160" r="5" fill="#22252B"/>
  <circle cx="560" cy="210" r="5" fill="#22252B"/>
  <circle cx="630" cy="290" r="5" fill="#22252B"/>
  <circle cx="700" cy="345" r="5" fill="#AE3527"/>
  <path d="M 490 160 L 560 210 L 630 290 L 700 345" fill="none" stroke="#AE3527" stroke-width="2.5"/>

  <line x1="700" y1="355" x2="700" y2="400" stroke="#6B5A22" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="700" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#6B5A22">WEAR LIMIT</text>

  <line x1="50" y1="450" x2="750" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">CONTEXT + MEASUREMENT, LOGGED OVER TIME, SHOWS WHAT MEMORY ALONE MISSES</text>
</svg>
