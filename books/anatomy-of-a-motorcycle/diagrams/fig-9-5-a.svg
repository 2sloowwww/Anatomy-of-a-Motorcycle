<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">LINE CHOICE SETS THE EFFECTIVE RADIUS</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Road as a curved band, right-hand corner -->
  <path d="M 100 420 Q 250 420 350 300 Q 450 180 650 180" fill="none" stroke="#8C876F" stroke-width="130" stroke-linecap="round"/>
  <path d="M 100 420 Q 250 420 350 300 Q 450 180 650 180" fill="none" stroke="#EEE8DA" stroke-width="124" stroke-linecap="round"/>
  <!-- lane edges -->
  <path d="M 100 365 Q 240 365 320 260 Q 400 155 650 125" fill="none" stroke="#33505E" stroke-width="2"/>
  <path d="M 100 475 Q 260 475 380 340 Q 500 205 650 235" fill="none" stroke="#33505E" stroke-width="2"/>

  <!-- tight line -->
  <path d="M 130 420 Q 260 420 340 320 Q 420 220 650 200" fill="none" stroke="#AE3527" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="230" y="450" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#AE3527">TIGHT LINE</text>
  <text x="230" y="466" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">SMALL RADIUS, STEEPER LEAN</text>

  <!-- wide entry-apex-exit line -->
  <path d="M 130 370 Q 300 370 360 290 Q 420 210 460 190 Q 550 155 650 160" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="500" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#33505E">WIDE LINE</text>
  <text x="500" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">LARGER RADIUS, REDUCED LEAN</text>

  <!-- apex marker -->
  <circle cx="420" cy="205" r="6" fill="#6B5A22"/>
  <text x="420" y="228" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B5A22">APEX</text>

  <line x1="50" y1="460" x2="750" y2="460" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="480" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">A WIDER LINE REDUCES THE SAME LEAN-ANGLE MATH FROM CHAPTER 8.3</text>
</svg>
