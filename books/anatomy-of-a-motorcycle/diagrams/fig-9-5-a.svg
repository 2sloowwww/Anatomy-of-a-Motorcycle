<text class="th" x="40" y="58">Line choice sets your radius</text>
<text class="tm tbl" x="40" y="84">Same corner, two lines, two different arcs</text>
<text class="tm end" x="868" y="534" style="stroke-width:0">FIG. 9.5-A</text>
<path class="k draw" data-i="0" d="M70 190 H500 A210 210 0 0 1 710 400 V535"/>
<path class="k draw" data-i="0" d="M70 330 H500 A70 70 0 0 1 570 400 V535"/>
<path class="tint-k fade" data-i="1" d="M70 190 H500 A210 210 0 0 1 710 400 V535 H570 V400 A70 70 0 0 0 500 330 H70 Z"/>
<path class="f fade" d="M70 260 H500 A140 140 0 0 1 640 400 V535"/>
