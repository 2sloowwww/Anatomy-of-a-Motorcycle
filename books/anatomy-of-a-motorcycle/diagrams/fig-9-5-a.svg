<path class="a draw" data-i="3" d="M70 208 H300 C440 208 560 246 592 352 S682 470 694 535"/>
<line class="s draw" data-i="4" x1="160" y1="308" x2="208.5" y2="308"/>
<polygon class="fill-s pop" data-i="5" points="220,308 206,300.7 206,315.3"/>
<line class="a draw" data-i="4" x1="160" y1="208" x2="208.5" y2="208"/>
<polygon class="fill-a pop" data-i="5" points="220,208 206,200.7 206,215.3"/>
<circle class="fill-a pop" data-i="5" cx="592" cy="352" r="7"/>
<text class="tmb ta fade" data-i="5" x="612" y="340">LATE APEX</text>
<text class="tm fade" data-i="1" x="70" y="172">ENTRY</text>
<text class="tm fade" data-i="1" x="718" y="520">EXIT</text>
<line class="s thick draw" data-i="6" x1="80" y1="408" x2="120" y2="408"/>
<text class="t fade" data-i="6" x="134" y="414">HUG THE INSIDE</text>
<text class="tsm fade" data-i="6" x="134" y="436">tight arc: more lean at the same speed</text>
<line class="a draw" data-i="7" x1="80" y1="478" x2="120" y2="478"/>
<text class="t ta fade" data-i="7" x="134" y="484">WIDE IN · LATE APEX · WIDE OUT</text>
<text class="tsm fade" data-i="7" x="134" y="506">bigger arc: less lean, or more speed</text>
</svg>
