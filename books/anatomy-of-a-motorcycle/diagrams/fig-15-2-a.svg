<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">THREE FIT POINTS TO CHECK IN PERSON</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- rider silhouette on bike -->
  <ellipse cx="400" cy="360" rx="130" ry="16" fill="#8C876F" opacity="0.25"/>
  <circle cx="290" cy="330" r="30" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="510" cy="330" r="30" fill="none" stroke="#22252B" stroke-width="3"/>
  <path d="M 290 330 L 350 250 L 450 250 L 510 330" fill="none" stroke="#22252B" stroke-width="3"/>
  <rect x="370" y="215" width="60" height="24" rx="6" fill="#6B5A22"/>

  <!-- rider figure -->
  <circle cx="400" cy="160" r="14" fill="none" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="400" y1="174" x2="400" y2="225" stroke="#AE3527" stroke-width="3"/>
  <line x1="400" y1="190" x2="370" y2="220" stroke="#AE3527" stroke-width="3"/>
  <line x1="400" y1="225" x2="360" y2="290" stroke="#AE3527" stroke-width="3"/>
  <line x1="360" y1="290" x2="380" y2="345" stroke="#AE3527" stroke-width="3"/>

  <!-- callout 1: feet to ground -->
  <line x1="380" y1="345" x2="290" y2="380" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="220" y="400" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">1. FEET REACH</text>
  <text x="220" y="413" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">GROUND AT A STOP</text>

  <!-- callout 2: bar reach -->
  <line x1="370" y1="220" x2="290" y2="180" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="220" y="150" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">2. REACH TO</text>
  <text x="220" y="163" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">HANDLEBARS</text>

  <!-- callout 3: knee bend -->
  <line x1="360" y1="290" x2="580" y2="270" stroke="#33505E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="640" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">3. KNEE BEND</text>
  <text x="640" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">AT FOOTPEGS</text>

  <line x1="50" y1="440" x2="750" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="460" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">NO SPEC SHEET FULLY CONFIRMS ANY OF THE THREE</text>
</svg>
