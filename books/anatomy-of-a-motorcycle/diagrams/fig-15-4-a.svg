<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">TWO DIFFERENT KINDS OF RISK</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="200" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">NEW</text>
  <text x="600" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">USED</text>

  <!-- new: depreciation curve -->
  <line x1="100" y1="250" x2="330" y2="250" stroke="#22252B" stroke-width="1.5"/>
  <line x1="100" y1="150" x2="100" y2="250" stroke="#22252B" stroke-width="1.5"/>
  <path d="M 100 160 Q 140 220 200 235 Q 260 245 330 248" fill="none" stroke="#AE3527" stroke-width="2.5"/>
  <text x="215" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#AE3527" font-weight="700">STEEP FIRST-YEAR DROP</text>
  <text x="215" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">FINANCIAL RISK</text>
  <text x="215" y="303" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">— PAID UPFRONT</text>

  <!-- used: unknown history -->
  <rect x="480" y="150" width="240" height="120" rx="6" fill="none" stroke="#AE3527" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="600" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">? SULFATION</text>
  <text x="600" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">? DEGRADED FUEL</text>
  <text x="600" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">? SEAL WEAR</text>
  <text x="600" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">? MAINTENANCE GAPS</text>
  <text x="600" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">INFORMATIONAL RISK</text>
  <text x="600" y="303" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">— UNVERIFIED UNTIL INSPECTED</text>

  <line x1="400" y1="70" x2="400" y2="330" stroke="#33505E" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">NEITHER RISK IS SIMPLY SMALLER THAN THE OTHER</text>
</svg>
