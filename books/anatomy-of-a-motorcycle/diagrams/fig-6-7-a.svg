<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">READING TREAD-DEPTH WEAR PATTERNS</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- three tread depth profiles as line charts, cross-section from shoulder to shoulder -->

  <!-- EVEN WEAR -->
  <text x="160" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#22252B">EVEN WEAR</text>
  <line x1="70" y1="180" x2="250" y2="180" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 70 160 L 250 160" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="160" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">CORRECT PRESSURE,</text>
  <text x="160" y="221" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">MIXED RIDING</text>

  <!-- CENTER WEAR -->
  <text x="400" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#AE3527">CENTER WEAR</text>
  <line x1="310" y1="180" x2="490" y2="180" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 310 160 Q 400 195 490 160" fill="none" stroke="#AE3527" stroke-width="3"/>
  <text x="400" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">OVERINFLATION —</text>
  <text x="400" y="221" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">CROWNED CONTACT</text>

  <!-- SHOULDER WEAR -->
  <text x="640" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#6B5A22">SHOULDER WEAR</text>
  <line x1="550" y1="180" x2="730" y2="180" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 550 195 Q 640 155 730 195" fill="none" stroke="#6B5A22" stroke-width="3"/>
  <text x="640" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">UNDERINFLATION OR</text>
  <text x="640" y="221" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">HARD CORNERING</text>

  <!-- section labels: shoulder / center / shoulder markers for all three -->
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#8C876F">
    <text x="80" y="195">SH</text><text x="155" y="195">CTR</text><text x="235" y="195">SH</text>
    <text x="320" y="195">SH</text><text x="395" y="195">CTR</text><text x="475" y="195">SH</text>
    <text x="560" y="195">SH</text><text x="635" y="195">CTR</text><text x="715" y="195">SH</text>
  </g>

  <!-- lower half: full tyre cross-sections illustrating each -->
  <line x1="60" y1="255" x2="740" y2="255" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- even -->
  <path d="M 90 400 Q 90 280 160 265 Q 230 280 230 400" fill="none" stroke="#33505E" stroke-width="3"/>
  <!-- center -->
  <path d="M 330 400 Q 330 280 400 265 Q 470 280 470 400" fill="none" stroke="#22252B" stroke-width="2"/>
  <path d="M 355 395 Q 400 415 445 395" fill="none" stroke="#AE3527" stroke-width="4"/>
  <!-- shoulder -->
  <path d="M 570 400 Q 570 280 640 265 Q 710 280 710 400" fill="none" stroke="#22252B" stroke-width="2"/>
  <path d="M 578 380 Q 590 400 605 398" fill="none" stroke="#6B5A22" stroke-width="4"/>
  <path d="M 675 398 Q 690 400 702 380" fill="none" stroke="#6B5A22" stroke-width="4"/>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">TREAD WEAR SHAPE RECORDS PRESSURE HISTORY AND RIDING STYLE</text>
</svg>
