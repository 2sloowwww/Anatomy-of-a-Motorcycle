<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="axisArrow58" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#33505E"/>
    </marker>
    <marker id="brassArrow58" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#6B5A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="32" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.4">DAMPING FORCE VS. SHAFT SPEED</text>
  <text x="400" y="53" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">LOW-SPEED AND HIGH-SPEED ARE SEPARATE, INDEPENDENTLY ADJUSTABLE REGIONS</text>

  <!-- Region name headers -->
  <text x="245" y="76" text-anchor="middle" font-size="15.5" font-weight="700" fill="#6B5A22">LOW-SPEED REGION</text>
  <text x="245" y="92" text-anchor="middle" font-size="11" font-style="italic" fill="#8C876F">gradual shaft motion — brake dive, cornering load</text>

  <text x="555" y="76" text-anchor="middle" font-size="15.5" font-weight="700" fill="#AE3527">HIGH-SPEED REGION</text>
  <text x="555" y="92" text-anchor="middle" font-size="11" font-style="italic" fill="#8C876F">sudden shaft motion — potholes, sharp-edged hits</text>

  <!-- Gridlines -->
  <g stroke="#8C876F" stroke-width="1" stroke-dasharray="2 5" opacity="0.5">
    <line x1="230" y1="430" x2="230" y2="105"/>
    <line x1="380" y1="430" x2="380" y2="105"/>
    <line x1="530" y1="430" x2="530" y2="105"/>
    <line x1="680" y1="430" x2="680" y2="105"/>
    <line x1="110" y1="350" x2="730" y2="350"/>
    <line x1="110" y1="270" x2="730" y2="270"/>
    <line x1="110" y1="190" x2="730" y2="190"/>
  </g>

  <!-- Axes -->
  <line x1="110" y1="430" x2="750" y2="430" stroke="#33505E" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#axisArrow58)"/>
  <line x1="110" y1="430" x2="110" y2="100" stroke="#33505E" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#axisArrow58)"/>

  <text x="430" y="453" text-anchor="middle" font-size="14.5" font-weight="600" fill="#33505E">SHAFT SPEED (SUSPENSION VELOCITY) &#8594;</text>
  <text x="430" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527" font-style="italic">— NOT ROAD SPEED —</text>
  <text x="83" y="270" text-anchor="middle" font-size="14.5" font-weight="600" fill="#33505E" transform="rotate(-90 83 270)">DAMPING FORCE &#8594;</text>

  <!-- Adjustable range bands: low-speed (faint alt lines) -->
  <line x1="110" y1="430" x2="380" y2="270" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85"/>
  <line x1="110" y1="430" x2="380" y2="160" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85"/>

  <!-- Adjustable range bands: high-speed (faint alt lines) -->
  <line x1="380" y1="215" x2="680" y2="175" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85"/>
  <line x1="380" y1="215" x2="680" y2="95" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85"/>

  <!-- Main curve: low-speed steeper, knee, high-speed shallower -->
  <path d="M110,430 L380,215 L680,140" fill="none" stroke="#22252B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knee marker -->
  <circle cx="380" cy="215" r="5.5" fill="#EEE8DA" stroke="#22252B" stroke-width="2.2"/>
  <line x1="380" y1="430" x2="380" y2="215" stroke="#33505E" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33505E">KNEE POINT</text>

  <!-- Adjustable range double-arrows -->
  <line x1="250" y1="347" x2="250" y2="290" stroke="#6B5A22" stroke-width="2" marker-start="url(#brassArrow58)" marker-end="url(#brassArrow58)"/>
  <text x="260" y="323" font-size="12" font-weight="700" fill="#6B5A22">ADJUSTABLE</text>
  <text x="260" y="337" font-size="12" font-weight="700" fill="#6B5A22">RANGE</text>

  <line x1="560" y1="191" x2="560" y2="143" stroke="#6B5A22" stroke-width="2" marker-start="url(#brassArrow58)" marker-end="url(#brassArrow58)"/>
  <text x="570" y="172" font-size="12" font-weight="700" fill="#6B5A22">ADJUSTABLE</text>
  <text x="570" y="186" font-size="12" font-weight="700" fill="#6B5A22">RANGE</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.8-A</text>
</svg>
