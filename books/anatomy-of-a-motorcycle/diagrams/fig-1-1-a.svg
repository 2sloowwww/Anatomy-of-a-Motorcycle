<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#AE3527"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="21" fill="#6B5A22" letter-spacing="0.5">CONTACT PATCH — FOUR WHEELS VS. TWO</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <!-- divider -->
  <line x1="400" y1="80" x2="400" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- panel labels -->
  <text x="200" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">TOP VIEW — CAR</text>
  <text x="600" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">TOP VIEW — MOTORCYCLE</text>

  <!-- ===================== LEFT: CAR ===================== -->
  <!-- car body outline -->
  <rect x="122" y="118" width="156" height="234" rx="22" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>

  <!-- base of support rectangle (dashed) -->
  <rect x="140" y="140" width="120" height="190" fill="none" stroke="#33505E" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- contact patches -->
  <rect x="131" y="129" width="18" height="26" fill="#22252B"/>
  <rect x="251" y="129" width="18" height="26" fill="#22252B"/>
  <rect x="131" y="315" width="18" height="26" fill="#22252B"/>
  <rect x="251" y="315" width="18" height="26" fill="#22252B"/>

  <!-- CG -->
  <circle cx="200" cy="235" r="7" fill="#AE3527"/>
  <line x1="200" y1="235" x2="200" y2="200" stroke="#AE3527" stroke-width="1.5"/>
  <text x="206" y="197" font-family="JetBrains Mono, monospace" font-size="14" fill="#AE3527" font-weight="600">CG</text>

  <!-- label: base of support -->
  <line x1="260" y1="150" x2="305" y2="130" stroke="#33505E" stroke-width="1.3"/>
  <text x="308" y="127" font-family="JetBrains Mono, monospace" font-size="14" fill="#33505E" font-weight="600">BASE OF</text>
  <text x="308" y="144" font-family="JetBrains Mono, monospace" font-size="14" fill="#33505E" font-weight="600">SUPPORT</text>

  <text x="200" y="390" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#22252B" font-weight="600">FOUR PATCHES → A RECTANGLE</text>
  <text x="200" y="412" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#5A5748">CG STAYS INSIDE. STABLE AT REST.</text>

  <!-- ===================== RIGHT: MOTORCYCLE ===================== -->
  <!-- frame outline (narrow) -->
  <rect x="590" y="140" width="20" height="190" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>

  <!-- zero-width line (dashed) -->
  <line x1="600" y1="150" x2="600" y2="320" stroke="#33505E" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- contact patches -->
  <rect x="587" y="141" width="26" height="16" fill="#22252B"/>
  <rect x="587" y="313" width="26" height="16" fill="#22252B"/>

  <!-- CG on the line -->
  <circle cx="600" cy="235" r="7" fill="#AE3527"/>

  <!-- label: zero width line -->
  <line x1="613" y1="235" x2="650" y2="200" stroke="#33505E" stroke-width="1.3"/>
  <text x="653" y="180" font-family="JetBrains Mono, monospace" font-size="14" fill="#33505E" font-weight="600">SINGLE LINE —</text>
  <text x="653" y="197" font-family="JetBrains Mono, monospace" font-size="14" fill="#33505E" font-weight="600">ZERO WIDTH</text>

  <!-- side force pushing CG off the line -->
  <line x1="612" y1="235" x2="655" y2="235" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowRed)"/>
  <text x="618" y="255" font-family="JetBrains Mono, monospace" font-size="13" fill="#AE3527" font-weight="600">ANY SIDE FORCE</text>

  <!-- displaced / falling indicator -->
  <circle cx="663" cy="235" r="5" fill="#AE3527" opacity="0.35"/>
  <line x1="600" y1="235" x2="663" y2="235" stroke="#AE3527" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>

  <text x="600" y="390" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#22252B" font-weight="600">TWO PATCHES → A LINE</text>
  <text x="600" y="412" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#5A5748">NO WIDTH TO LEAN AGAINST. FALLS.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.1-A</text>
</svg>
