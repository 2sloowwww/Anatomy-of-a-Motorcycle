<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Top view comparing a car's four contact patches, which form a rectangle, with a motorcycle's two, which form a line.</title><desc id="d">A car's centre of gravity sits inside the rectangle its four tyres define. A motorcycle's two tyres define only a line, so any sideways push moves the centre of gravity off it and the bike falls.</desc>
<style>
svg.dg{--c-ink:var(--ink,#22252B);--c-soft:var(--ink-soft,#5A5748);--c-faint:var(--ink-faint,#8C876F);--c-sig:var(--signal,#AE3527);--c-blu:var(--blueprint,#33505E);--c-brs:var(--brass,#6B5A22);--c-paper:var(--paper,#EEE8DA);--c-deep:var(--paper-deep,#E2D9C3);--c-line:var(--line,rgba(34,37,43,.22))}
svg.dg .bgp{fill:var(--c-paper)}
svg.dg .frm{fill:none;stroke:var(--c-ink);stroke-width:1.4}
svg.dg .k,svg.dg .s,svg.dg .a,svg.dg .b,svg.dg .g,svg.dg .f,svg.dg .fk{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.dg .k{stroke:var(--c-ink);stroke-width:2.8}
svg.dg .s{stroke:var(--c-soft);stroke-width:1.8}
svg.dg .a{stroke:var(--c-sig);stroke-width:3.4}
svg.dg .b{stroke:var(--c-blu);stroke-width:2.6}
svg.dg .g{stroke:var(--c-brs);stroke-width:3}
svg.dg .f{stroke:var(--c-faint);stroke-width:1.5;stroke-dasharray:6 5}
svg.dg .fb{stroke:var(--c-blu);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
svg.dg .thick{stroke-width:7}
svg.dg .fill-d{fill:var(--c-deep)}
svg.dg .fill-k{fill:var(--c-ink)}
svg.dg .fill-a{fill:var(--c-sig)}
svg.dg .fill-b{fill:var(--c-blu)}
svg.dg .fill-g{fill:var(--c-brs)}
svg.dg .fill-s{fill:var(--c-soft)}
svg.dg .tint-a{fill:var(--c-sig);fill-opacity:.16}
svg.dg .tint-a2{fill:var(--c-sig);fill-opacity:.34}
svg.dg .tint-b{fill:var(--c-blu);fill-opacity:.16}
svg.dg .tint-b2{fill:var(--c-blu);fill-opacity:.3}
svg.dg .tint-g{fill:var(--c-brs);fill-opacity:.14}
svg.dg .tint-k{fill:var(--c-ink);fill-opacity:.08}
svg.dg text{paint-order:stroke;stroke:var(--c-paper);stroke-width:5px;stroke-linejoin:round}
svg.dg .th{font:800 34px 'Big Shoulders Display','Arial Narrow',sans-serif;fill:var(--c-ink);text-transform:uppercase;letter-spacing:.01em}
svg.dg .tm{font:500 14px 'JetBrains Mono',Consolas,monospace;fill:var(--c-soft);text-transform:uppercase;letter-spacing:.09em}
svg.dg .tmb{font:700 14px 'JetBrains Mono',Consolas,monospace;fill:var(--c-ink);text-transform:uppercase;letter-spacing:.09em}
svg.dg .t{font:600 21px 'Big Shoulders Text','Arial Narrow',sans-serif;fill:var(--c-ink)}
svg.dg .tb{font:800 25px 'Big Shoulders Text','Arial Narrow',sans-serif;fill:var(--c-ink);text-transform:uppercase;letter-spacing:.02em}
svg.dg .ts{font:italic 400 18px 'Source Serif 4',Georgia,serif;fill:var(--c-soft)}
svg.dg .tsm{font:italic 400 16px 'Source Serif 4',Georgia,serif;fill:var(--c-soft)}
svg.dg .ta{fill:var(--c-sig)}
svg.dg .tbl{fill:var(--c-blu)}
svg.dg .tg{fill:var(--c-brs)}
svg.dg .mid{text-anchor:middle}
svg.dg .end{text-anchor:end}
svg.dg .fx{font:italic 600 30px 'Source Serif 4',Georgia,serif;fill:var(--c-ink)}
</style>
<rect class="bgp" width="900" height="560"/>
<rect class="frm" x="10" y="10" width="880" height="540"/>
<g class="frm"><path d="M10,30V10H30M870,10H890 V30M890,530V550H870 M30,550H10V530"/></g>
<text class="th" x="40" y="58">Four wheels vs. two</text>
<text class="tm tbl" x="40" y="84">Why a motorcycle cannot stand on its own</text>
<text class="tm end" x="868" y="534" style="stroke-width:0">FIG. 1.1-A</text>
<line class="f fade" x1="450" y1="118" x2="450" y2="500"/>
<rect class="k draw" data-i="0" x="147" y="172" width="156" height="252" rx="32"/>
<rect class="fill-k fade" data-i="1" x="135" y="186" width="24" height="38" rx="5"/>
<rect class="fill-k fade" data-i="1" x="291" y="186" width="24" height="38" rx="5"/>
<rect class="fill-k fade" data-i="1" x="135" y="368" width="24" height="38" rx="5"/>
<rect class="fill-k fade" data-i="1" x="291" y="368" width="24" height="38" rx="5"/>
<rect class="tint-b fade" data-i="2" x="147" y="205" width="156" height="186" rx="0"/>
<rect class="fb fade" data-i="2" x="147" y="205" width="156" height="186" rx="0"/>
<circle class="fill-a pop" data-i="3" cx="225" cy="298" r="9"/>
<text class="tmb ta fade" data-i="3" x="241" y="303">CG</text>
<text class="tb mid fade" data-i="4" x="225" y="458">FOUR PATCHES</text>
<text class="ts mid fade" data-i="4" x="225" y="482">make a rectangle.</text>
<text class="tsm mid fade" data-i="4" x="225" y="504">The CG sits inside it: stable at rest.</text>
<rect class="k draw" data-i="0" x="660" y="196" width="30" height="200" rx="15"/>
<rect class="fill-k fade" data-i="1" x="660" y="186" width="30" height="36" rx="5"/>
<rect class="fill-k fade" data-i="1" x="660" y="370" width="30" height="36" rx="5"/>
<line class="f fade" x1="675" y1="222" x2="675" y2="370"/>
<circle class="fill-a pop" data-i="3" cx="675" cy="298" r="9"/>
<text class="tmb ta mid fade" data-i="3" x="675" y="278">CG</text>
<line class="a draw" data-i="4" x1="560" y1="298" x2="638.9" y2="298"/>
<polygon class="fill-a pop" data-i="5" points="652,298 636,289.7 636,306.3"/>
<text class="tm ta fade" data-i="5" x="560" y="276">ANY SIDE PUSH</text>
<circle class="fill-a fade" data-i="6" cx="721" cy="298" r="9" fill-opacity=".28"/>
<line class="a fade" data-i="6" x1="687" y1="298" x2="711" y2="298" stroke-dasharray="5 5"/>
<text class="tsm mid fade" data-i="6" x="721" y="334">off the line</text>
<text class="tb mid fade" data-i="4" x="675" y="458">TWO PATCHES</text>
<text class="ts mid fade" data-i="4" x="675" y="482">make a line. No width</text>
<text class="ts mid fade" data-i="4" x="675" y="504">to lean on: it falls.</text>
</svg>
