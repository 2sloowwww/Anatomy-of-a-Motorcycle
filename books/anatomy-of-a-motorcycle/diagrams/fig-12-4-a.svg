<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">A SAFE HOME WORKSHOP SETUP</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- garage outline -->
  <rect x="90" y="80" width="620" height="300" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <!-- open door -->
  <rect x="90" y="80" width="140" height="300" fill="none" stroke="#33505E" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 100 90 L 100 370" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="160" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#33505E">OPEN DOOR</text>
  <g stroke="#33505E" stroke-width="1.5">
    <line x1="115" y1="140" x2="145" y2="160"/>
    <line x1="145" y1="140" x2="115" y2="160"/>
  </g>
  <text x="160" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">VENTILATION</text>

  <!-- extinguisher -->
  <rect x="640" y="110" width="26" height="55" rx="6" fill="#AE3527"/>
  <rect x="648" y="98" width="10" height="14" fill="#22252B"/>
  <text x="653" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">FUEL-RATED</text>
  <text x="653" y="197" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">EXTINGUISHER</text>

  <!-- motorcycle on paddock stand -->
  <ellipse cx="420" cy="330" rx="80" ry="14" fill="#8C876F" opacity="0.3"/>
  <circle cx="360" cy="300" r="30" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="470" cy="300" r="30" fill="none" stroke="#22252B" stroke-width="3"/>
  <line x1="360" y1="300" x2="470" y2="300" stroke="#22252B" stroke-width="4"/>
  <rect x="380" y="255" width="60" height="20" rx="6" fill="#6B5A22"/>
  <!-- paddock stand -->
  <path d="M 470 330 L 500 300 L 500 275" stroke="#AE3527" stroke-width="4" fill="none"/>
  <path d="M 470 330 L 500 330" stroke="#AE3527" stroke-width="4"/>
  <circle cx="470" cy="300" r="7" fill="none" stroke="#AE3527" stroke-width="2"/>
  <text x="500" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#AE3527">PADDOCK STAND</text>
  <text x="500" y="362" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">— NOT KICKSTAND</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">THE ENVIRONMENT CARRIES ITS OWN RISKS, SEPARATE FROM TOOL SKILL</text>
</svg>
