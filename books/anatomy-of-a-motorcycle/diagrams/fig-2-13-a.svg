<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

<!-- Title -->
<text x="400" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">TWO WAYS TO METER FUEL</text>
<text x="400" y="61" text-anchor="middle" font-size="13" fill="#5A5748">SAME INTAKE TRACT, SAME MOMENT IN THE CYCLE</text>

<!-- ============ TOP ROW: CARBURETOR ============ -->
<text x="70" y="120" font-size="15" font-weight="700" fill="#22252B">CARBURETOR</text>

<!-- air flow arrow into venturi -->
<line x1="60" y1="160" x2="150" y2="160" stroke="#22252B" stroke-width="2"/>
<polygon points="140,153 140,167 152,160" fill="#22252B"/>
<text x="65" y="145" font-size="11" fill="#5A5748">AIR</text>

<!-- venturi throat (pinched tube) -->
<path d="M 150 135 L 210 150 L 240 158 L 270 150 L 330 135
         L 330 185 L 270 170 L 240 162 L 210 170 L 150 185 Z"
      fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<text x="240" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">VENTURI</text>

<!-- jet -->
<rect x="234" y="196" width="12" height="26" fill="#22252B"/>
<text x="290" y="215" font-size="12" font-weight="700" fill="#6B5A22">JET</text>
<line x1="278" y1="212" x2="248" y2="205" stroke="#6B5A22" stroke-width="1.3"/>

<!-- float bowl -->
<rect x="205" y="222" width="70" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<text x="240" y="278" text-anchor="middle" font-size="11" fill="#5A5748">FLOAT BOWL</text>

<!-- fuel pulled up into airstream -->
<line x1="240" y1="222" x2="240" y2="204" stroke="#AE3527" stroke-width="2"/>
<polygon points="234,210 246,210 240,200" fill="#AE3527"/>

<!-- carb outflow into shared intake tract -->
<line x1="330" y1="160" x2="560" y2="160" stroke="#22252B" stroke-width="2"/>
<polygon points="550,153 550,167 562,160" fill="#22252B"/>

<!-- ============ BOTTOM ROW: FUEL INJECTION ============ -->
<text x="70" y="330" font-size="15" font-weight="700" fill="#22252B">FUEL INJECTION</text>

<!-- sensors -->
<rect x="55" y="345" width="70" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
<text x="90" y="364" text-anchor="middle" font-size="10.5" fill="#5A5748">THROTTLE</text>
<rect x="55" y="382" width="70" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
<text x="90" y="401" text-anchor="middle" font-size="10.5" fill="#5A5748">RPM</text>
<rect x="55" y="419" width="70" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
<text x="90" y="438" text-anchor="middle" font-size="10.5" fill="#5A5748">TEMP / ΔP</text>

<line x1="125" y1="360" x2="175" y2="395" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="125" y1="397" x2="175" y2="397" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="125" y1="434" x2="175" y2="399" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="169,392 169,402 180,397" fill="#33505E"/>

<!-- ECU -->
<rect x="180" y="372" width="90" height="50" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<text x="225" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5A22">ECU</text>

<!-- ECU to injector -->
<line x1="270" y1="397" x2="330" y2="397" stroke="#22252B" stroke-width="2"/>
<polygon points="320,390 320,404 332,397" fill="#22252B"/>

<!-- injector -->
<polygon points="332,385 375,397 332,409" fill="#22252B"/>
<text x="352" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">INJECTOR</text>

<!-- spray -->
<line x1="375" y1="397" x2="410" y2="390" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="375" y1="397" x2="410" y2="397" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="375" y1="397" x2="410" y2="404" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="3 3"/>

<!-- EFI outflow into shared intake tract -->
<line x1="410" y1="397" x2="560" y2="397" stroke="#22252B" stroke-width="2"/>
<polygon points="550,390 550,404 562,397" fill="#22252B"/>

<!-- ============ SHARED INTAKE TRACT / CYLINDER ============ -->
<rect x="562" y="130" width="90" height="290" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<text x="607" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#22252B">SAME INTAKE TRACT</text>

<!-- intake valve icon -->
<rect x="580" y="255" width="56" height="14" rx="3" fill="#22252B"/>
<text x="607" y="248" text-anchor="middle" font-size="11" fill="#5A5748">INTAKE VALVE</text>

<!-- cylinder -->
<rect x="662" y="180" width="90" height="190" fill="none" stroke="#22252B" stroke-width="2"/>
<rect x="670" y="300" width="74" height="60" fill="#8C876F" opacity="0.35" stroke="#22252B" stroke-width="1.5"/>
<text x="707" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CYLINDER</text>

<!-- bracket tying both arrows to same point -->
<path d="M 555 160 C 545 220, 545 340, 555 397" fill="none" stroke="#33505E" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="500" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22" transform="rotate(-90 500 280)">SAME POINT IN CYCLE</text>
</svg>
