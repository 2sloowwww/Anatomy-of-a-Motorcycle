<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

<!-- Title -->
<text x="400" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">THE EXHAUST PULSE IS A TIMED WAVE</text>
<text x="400" y="61" text-anchor="middle" font-size="13" fill="#5A5748">HEADER LENGTH SETS WHEN THE REFLECTION GETS HOME</text>

<!-- ============ TOP: SHORT HEADER (HIGH RPM) ============ -->
<text x="70" y="130" font-size="15" font-weight="700" fill="#22252B">SHORT HEADER</text>
<text x="70" y="148" font-size="12" fill="#5A5748">FAVOURS HIGH RPM</text>

<!-- exhaust valve / cylinder -->
<rect x="60" y="165" width="50" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<rect x="106" y="188" width="10" height="14" fill="#22252B"/>
<text x="85" y="245" text-anchor="middle" font-size="10.5" fill="#5A5748">CYLINDER</text>

<!-- short header pipe -->
<line x1="116" y1="195" x2="420" y2="195" stroke="#22252B" stroke-width="6" stroke-linecap="round"/>
<text x="270" y="182" text-anchor="middle" font-size="11" fill="#5A5748">HEADER PIPE (SHORT)</text>

<!-- outgoing pulse -->
<line x1="140" y1="195" x2="380" y2="195" stroke="#22252B" stroke-width="2"/>
<polygon points="370,188 370,202 384,195" fill="#22252B"/>
<text x="260" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#22252B">EXHAUST PULSE →</text>

<!-- reflected wave -->
<line x1="380" y1="230" x2="150" y2="230" stroke="#AE3527" stroke-width="2" stroke-dasharray="7 4"/>
<polygon points="160,223 160,237 146,230" fill="#AE3527"/>
<text x="260" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#AE3527">← REFLECTED NEGATIVE WAVE</text>

<text x="260" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B5A22">VALVE: WAVE ARRIVES JUST BEFORE IT CLOSES</text>

<!-- ============ BOTTOM: LONG HEADER (LOW RPM) ============ -->
<text x="70" y="330" font-size="15" font-weight="700" fill="#22252B">LONG HEADER</text>
<text x="70" y="348" font-size="12" fill="#5A5748">FAVOURS LOW RPM</text>

<rect x="60" y="365" width="50" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<rect x="106" y="388" width="10" height="14" fill="#22252B"/>
<text x="85" y="445" text-anchor="middle" font-size="10.5" fill="#5A5748">CYLINDER</text>

<!-- long header pipe -->
<line x1="116" y1="395" x2="720" y2="395" stroke="#22252B" stroke-width="6" stroke-linecap="round"/>
<text x="420" y="382" text-anchor="middle" font-size="11" fill="#5A5748">HEADER PIPE (LONG)</text>

<!-- outgoing pulse -->
<line x1="140" y1="395" x2="670" y2="395" stroke="#22252B" stroke-width="2"/>
<polygon points="660,388 660,402 674,395" fill="#22252B"/>
<text x="400" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#22252B">EXHAUST PULSE — LONGER TRAVEL TIME →</text>

<!-- reflected wave -->
<line x1="670" y1="430" x2="150" y2="430" stroke="#AE3527" stroke-width="2" stroke-dasharray="7 4"/>
<polygon points="160,423 160,437 146,430" fill="#AE3527"/>
<text x="400" y="453" text-anchor="middle" font-size="11" font-weight="700" fill="#AE3527">← REFLECTED NEGATIVE WAVE, ARRIVES LATER</text>

<text x="400" y="470" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B5A22">SAME TIMING PRINCIPLE, TUNED FOR A SLOWER-TURNING ENGINE</text>

<!-- divider -->
<line x1="40" y1="290" x2="760" y2="290" stroke="#8C876F" stroke-width="1"/>
</svg>
