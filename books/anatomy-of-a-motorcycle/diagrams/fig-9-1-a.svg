<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">BODY POSITION MOVES THE COMBINED CENTER OF MASS</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: upright rider -->
  <text x="200" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">UPRIGHT, CENTERED</text>

  <line x1="80" y1="380" x2="320" y2="380" stroke="#33505E" stroke-width="2"/>
  <circle cx="150" cy="380" r="30" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="270" cy="380" r="30" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 150 350 L 210 260 L 260 258 L 270 350" fill="none" stroke="#22252B" stroke-width="3"/>
  <!-- rider upright -->
  <circle cx="225" cy="180" r="18" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <line x1="225" y1="198" x2="225" y2="258" stroke="#22252B" stroke-width="3"/>

  <!-- combined CG marker -->
  <circle cx="220" cy="255" r="7" fill="#AE3527"/>
  <text x="220" y="235" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">COMBINED CG</text>

  <text x="200" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">NEUTRAL LEAN REQUIREMENT</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="460" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: shifted rider -->
  <text x="600" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">SHIFTED FORWARD + SIDE</text>

  <line x1="480" y1="380" x2="720" y2="380" stroke="#33505E" stroke-width="2"/>
  <circle cx="550" cy="380" r="30" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="670" cy="380" r="30" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <path d="M 550 350 L 610 260 L 660 258 L 670 350" fill="none" stroke="#22252B" stroke-width="3"/>
  <!-- rider shifted forward/side -->
  <circle cx="590" cy="185" r="18" fill="#8C876F" stroke="#22252B" stroke-width="2"/>
  <line x1="590" y1="203" x2="605" y2="258" stroke="#22252B" stroke-width="3"/>

  <!-- combined CG marker shifted -->
  <circle cx="595" cy="255" r="7" fill="#AE3527"/>
  <line x1="220" y1="255" x2="595" y2="255" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3" transform="translate(0,0)"/>
  <text x="600" y="235" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">CG SHIFTED</text>

  <text x="600" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">REDUCED LEAN REQUIREMENT</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">THE RIDER IS MASS THE LEAN-ANGLE MATH IN PART VIII ALREADY INCLUDES</text>
</svg>
