<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aAxis6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#22252B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.3">TWO POWER CURVES, ONE PEAK NUMBER</text>
  <line x1="130" y1="48" x2="670" y2="48" stroke="#8C876F" stroke-width="1"/>

  <!-- axes -->
  <line x1="100" y1="400" x2="670" y2="400" stroke="#22252B" stroke-width="2.2" marker-end="url(#aAxis6)"/>
  <line x1="100" y1="400" x2="100" y2="85" stroke="#22252B" stroke-width="2.2" marker-end="url(#aAxis6)"/>
  <text x="670" y="422" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="14" fill="#5A5748">ENGINE RPM →</text>
  <text x="70" y="90" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="14" fill="#5A5748">POWER</text>
  <text x="108" y="415" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F">IDLE</text>
  <text x="640" y="415" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F">REDLINE</text>

  <!-- shared peak reference line -->
  <line x1="100" y1="120" x2="650" y2="120" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="450" y="105" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#33505E" font-weight="600">IDENTICAL PEAK — SAME NUMBER ON PAPER</text>

  <!-- Engine A: broad and early -->
  <path d="M 100 392 C 160 368 195 175 255 138 C 300 115 375 113 460 133 C 520 147 585 178 648 232" fill="none" stroke="#AE3527" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="378" cy="121" r="15" fill="none" stroke="#33505E" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="378" cy="121" r="4" fill="#AE3527"/>
  <text x="255" y="200" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#AE3527">ENGINE A</text>
  <text x="255" y="219" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#AE3527">broad &amp; early</text>

  <!-- Engine B: narrow and late -->
  <path d="M 100 396 C 230 392 350 388 445 374 C 505 360 565 295 605 190 C 617 158 623 138 630 122" fill="none" stroke="#6B5A22" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="629" cy="121" r="15" fill="none" stroke="#33505E" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="629" cy="121" r="4" fill="#6B5A22"/>
  <text x="470" y="345" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#6B5A22">ENGINE B</text>
  <text x="470" y="364" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#6B5A22">narrow &amp; late</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.6-A</text>
</svg>
