<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">ASPIRATIONAL USE VS. ACTUAL USE</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- aspirational column -->
  <text x="200" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">IMAGINED RIDING</text>
  <rect x="90" y="100" width="220" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
  <text x="200" y="121" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">CANYON CARVING</text>
  <rect x="90" y="144" width="220" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
  <text x="200" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">CROSS-COUNTRY TOURING</text>
  <rect x="90" y="188" width="220" height="34" rx="5" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3"/>
  <text x="200" y="209" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#22252B">REMOTE OFF-ROAD TRAILS</text>

  <!-- actual column -->
  <text x="600" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#22252B">ACTUAL RIDING</text>
  <rect x="490" y="100" width="220" height="34" rx="5" fill="#AE3527"/>
  <text x="600" y="121" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#EEE8DA">DAILY TRAFFIC COMMUTE</text>
  <rect x="490" y="144" width="220" height="34" rx="5" fill="#AE3527"/>
  <text x="600" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#EEE8DA">SHORT LOCAL ERRANDS</text>
  <rect x="490" y="188" width="220" height="34" rx="5" fill="#AE3527"/>
  <text x="600" y="209" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#EEE8DA">OCCASIONAL WEEKEND RIDE</text>

  <line x1="400" y1="70" x2="400" y2="240" stroke="#33505E" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="200" y1="230" x2="200" y2="270" stroke="#8C876F" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="600" y1="230" x2="600" y2="270" stroke="#AE3527" stroke-width="2.2"/>
  <polygon points="600,270 592,258 608,258" fill="#AE3527"/>

  <rect x="150" y="290" width="500" height="80" rx="8" fill="none" stroke="#6B5A22" stroke-width="1.6"/>
  <text x="400" y="315" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">PART XIV'S CATEGORY TRADE-OFFS ARE WEIGHED</text>
  <text x="400" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22252B">AGAINST THE ACTUAL RIDE, NOT THE IMAGINED ONE</text>
  <text x="400" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">A LIGHT, MANAGEABLE STANDARD OFTEN SERVES</text>
  <text x="400" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5A5748">THE ACTUAL RIDE BETTER THAN THE IMAGINED CATEGORY</text>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">MOST MISMATCHED PURCHASES START RIGHT HERE</text>
</svg>
