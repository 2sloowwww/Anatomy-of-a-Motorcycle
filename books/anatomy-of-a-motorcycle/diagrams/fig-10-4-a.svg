<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#22252B">CHAIN LUBRICATION EXPOSURE AND SWINGARM-ARC SLACK</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: chain lubrication exposure -->
  <text x="200" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">EXPOSED LUBRICATION</text>
  <circle cx="200" cy="220" r="80" fill="none" stroke="#8C876F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 130 220 A 70 70 0 1 1 270 220" fill="none" stroke="#22252B" stroke-width="6" stroke-dasharray="10 6"/>
  <!-- flung droplets -->
  <circle cx="290" cy="150" r="4" fill="#6B5A22"/>
  <circle cx="310" cy="190" r="3" fill="#6B5A22"/>
  <circle cx="120" cy="140" r="4" fill="#6B5A22"/>
  <text x="200" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">FLUNG OFF BY ROTATION,</text>
  <text x="200" y="336" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">WASHED AWAY BY RAIN</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: swingarm arc and slack -->
  <text x="600" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">SWINGARM ARC CHANGES SLACK</text>

  <!-- pivot point -->
  <circle cx="520" cy="200" r="6" fill="#22252B"/>
  <text x="500" y="185" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">PIVOT</text>

  <!-- swingarm at two positions -->
  <line x1="520" y1="200" x2="660" y2="230" stroke="#22252B" stroke-width="3.5"/>
  <circle cx="660" cy="230" r="10" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <text x="670" y="255" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">EXTENDED</text>

  <line x1="520" y1="200" x2="640" y2="310" stroke="#8C876F" stroke-width="3.5" stroke-dasharray="6 4"/>
  <circle cx="640" cy="310" r="10" fill="none" stroke="#8C876F" stroke-width="2.5"/>
  <text x="650" y="335" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A5748">COMPRESSED</text>

  <!-- front sprocket reference -->
  <circle cx="500" cy="230" r="7" fill="#AE3527"/>
  <text x="480" y="240" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#AE3527">SPROCKET</text>

  <line x1="500" y1="230" x2="660" y2="230" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="500" y1="230" x2="640" y2="310" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="3 3"/>

  <line x1="50" y1="440" x2="750" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="460" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">DISTANCE TO THE SPROCKET SHIFTS AS THE ARM SWEEPS ITS ARC</text>
</svg>
