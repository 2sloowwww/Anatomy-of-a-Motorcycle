<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

<!-- Title -->
<text x="400" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">TWO WAYS TO MOVE THE SAME HEAT</text>
<text x="400" y="61" text-anchor="middle" font-size="13" fill="#5A5748">AIR COOLING VS. LIQUID COOLING</text>

<!-- divider -->
<line x1="400" y1="90" x2="400" y2="450" stroke="#8C876F" stroke-width="1"/>

<!-- ============ LEFT: AIR-COOLED ============ -->
<text x="200" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#22252B">AIR-COOLED</text>

<!-- cylinder body -->
<rect x="150" y="140" width="100" height="200" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<!-- combustion heat source -->
<circle cx="200" cy="170" r="12" fill="#AE3527"/>
<text x="200" y="128" text-anchor="middle" font-size="10.5" fill="#5A5748">COMBUSTION HEAT</text>

<!-- fins -->
<line x1="120" y1="200" x2="280" y2="200" stroke="#22252B" stroke-width="4"/>
<line x1="120" y1="220" x2="280" y2="220" stroke="#22252B" stroke-width="4"/>
<line x1="120" y1="240" x2="280" y2="240" stroke="#22252B" stroke-width="4"/>
<line x1="120" y1="260" x2="280" y2="260" stroke="#22252B" stroke-width="4"/>
<line x1="120" y1="280" x2="280" y2="280" stroke="#22252B" stroke-width="4"/>
<line x1="120" y1="300" x2="280" y2="300" stroke="#22252B" stroke-width="4"/>
<text x="200" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">COOLING FINS</text>

<!-- heat leaving via air -->
<line x1="285" y1="220" x2="330" y2="210" stroke="#AE3527" stroke-width="1.8" stroke-dasharray="4 3"/>
<polygon points="322,203 322,217 334,209" fill="#AE3527"/>
<line x1="285" y1="260" x2="330" y2="270" stroke="#AE3527" stroke-width="1.8" stroke-dasharray="4 3"/>
<polygon points="322,263 322,277 334,271" fill="#AE3527"/>
<text x="360" y="240" font-size="11" font-weight="700" fill="#AE3527" transform="rotate(0)">HEAT →</text>
<text x="200" y="390" text-anchor="middle" font-size="11" fill="#5A5748">DEPENDS ON PASSING AIRFLOW</text>

<!-- ============ RIGHT: LIQUID-COOLED ============ -->
<text x="600" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#22252B">LIQUID-COOLED</text>

<!-- cylinder body -->
<rect x="550" y="140" width="100" height="200" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<circle cx="600" cy="170" r="12" fill="#AE3527"/>
<text x="600" y="128" text-anchor="middle" font-size="10.5" fill="#5A5748">COMBUSTION HEAT</text>

<!-- water jacket -->
<rect x="535" y="195" width="130" height="115" fill="none" stroke="#33505E" stroke-width="2.5"/>
<text x="600" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">WATER JACKET</text>

<!-- hoses to radiator -->
<path d="M 665 210 C 710 210, 720 190, 720 165" fill="none" stroke="#33505E" stroke-width="2.5"/>
<polygon points="713,172 727,172 720,160" fill="#33505E"/>
<path d="M 720 260 C 720 285, 710 295, 665 295" fill="none" stroke="#33505E" stroke-width="2.5"/>
<polygon points="672,289 672,301 660,296" fill="#33505E"/>

<!-- radiator -->
<rect x="700" y="165" width="45" height="95" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<line x1="708" y1="175" x2="737" y2="175" stroke="#22252B" stroke-width="1.5"/>
<line x1="708" y1="190" x2="737" y2="190" stroke="#22252B" stroke-width="1.5"/>
<line x1="708" y1="205" x2="737" y2="205" stroke="#22252B" stroke-width="1.5"/>
<line x1="708" y1="220" x2="737" y2="220" stroke="#22252B" stroke-width="1.5"/>
<line x1="708" y1="235" x2="737" y2="235" stroke="#22252B" stroke-width="1.5"/>
<line x1="708" y1="250" x2="737" y2="250" stroke="#22252B" stroke-width="1.5"/>
<text x="722" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22252B">RADIATOR</text>

<!-- heat leaving radiator -->
<line x1="748" y1="200" x2="770" y2="192" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>
<polygon points="762,187 762,199 774,190" fill="#AE3527"/>
<text x="722" y="278" text-anchor="middle" font-size="10" fill="#5A5748">AIRFLOW / FAN</text>

<!-- thermostat -->
<circle cx="600" cy="360" r="16" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<line x1="592" y1="360" x2="608" y2="360" stroke="#22252B" stroke-width="2"/>
<line x1="600" y1="352" x2="600" y2="368" stroke="#22252B" stroke-width="2"/>
<text x="600" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">THERMOSTAT</text>
<line x1="600" y1="310" x2="600" y2="344" stroke="#33505E" stroke-width="2" stroke-dasharray="5 3"/>
<text x="600" y="412" text-anchor="middle" font-size="11" fill="#5A5748">HOLDS A CONSTANT TARGET TEMPERATURE</text>

<!-- Bottom shared caption -->
<text x="400" y="465" text-anchor="middle" font-size="13" font-weight="600" fill="#22252B">SAME COMBUSTION HEAT — TWO DIFFERENT PHYSICAL MECHANISMS</text>
</svg>
