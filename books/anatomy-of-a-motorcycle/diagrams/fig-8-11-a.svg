<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">WOBBLE VS. WEAVE</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- WOBBLE: fast, high-frequency, front-end only -->
  <text x="220" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#AE3527">WOBBLE — FAST, FRONT-END</text>
  <line x1="70" y1="180" x2="370" y2="180" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 70 180 Q 85 130 100 180 Q 115 230 130 180 Q 145 130 160 180 Q 175 230 190 180 Q 205 130 220 180 Q 235 230 250 180 Q 265 130 280 180 Q 295 230 310 180 Q 325 130 340 180 Q 355 230 370 180" fill="none" stroke="#AE3527" stroke-width="2.5"/>
  <text x="220" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">HIGH FREQUENCY, FRONT WHEEL</text>
  <text x="220" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">AND HANDLEBARS ONLY</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- WEAVE: slower, low-frequency, whole bike -->
  <text x="600" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#6B5A22">WEAVE — SLOW, WHOLE-BIKE</text>
  <line x1="450" y1="180" x2="750" y2="180" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 450 180 Q 490 130 530 180 Q 570 230 610 180 Q 650 130 690 180 Q 715 205 750 180" fill="none" stroke="#6B5A22" stroke-width="2.5"/>
  <text x="600" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">LOW FREQUENCY, WHOLE CHASSIS</text>
  <text x="600" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">ROCKING ABOUT STEERING AXIS</text>

  <!-- lower section: simple motorcycle silhouettes showing extent of oscillation -->
  <g>
    <!-- wobble: only front wheel/bars swinging -->
    <ellipse cx="150" cy="340" rx="22" ry="10" fill="none" stroke="#22252B" stroke-width="2"/>
    <ellipse cx="290" cy="340" rx="22" ry="10" fill="none" stroke="#8C876F" stroke-width="1.5"/>
    <line x1="150" y1="340" x2="290" y2="340" stroke="#22252B" stroke-width="2.5"/>
    <line x1="290" y1="340" x2="310" y2="300" stroke="#AE3527" stroke-width="2.5"/>
    <line x1="290" y1="340" x2="270" y2="300" stroke="#AE3527" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="300" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">FRONT SWINGS FAST</text>
  </g>

  <g>
    <ellipse cx="530" cy="340" rx="22" ry="10" fill="none" stroke="#22252B" stroke-width="2"/>
    <ellipse cx="670" cy="340" rx="22" ry="10" fill="none" stroke="#22252B" stroke-width="2"/>
    <line x1="530" y1="340" x2="670" y2="340" stroke="#22252B" stroke-width="2.5"/>
    <line x1="600" y1="340" x2="615" y2="300" stroke="#6B5A22" stroke-width="2.5"/>
    <line x1="600" y1="340" x2="585" y2="300" stroke="#6B5A22" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="600" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B5A22">WHOLE BIKE ROCKS SLOWLY</text>
  </g>

  <line x1="50" y1="460" x2="750" y2="460" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="478" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">TWO DIFFERENT OSCILLATIONS — TWO DIFFERENT DIAGNOSES AND FIXES</text>
</svg>
