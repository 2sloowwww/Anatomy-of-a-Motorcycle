<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<defs>
  <marker id="arrBp19" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33505E"/>
  </marker>
</defs>
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

<!-- Title -->
<text x="400" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">WHERE A TANK OF FUEL'S ENERGY GOES</text>
<text x="400" y="61" text-anchor="middle" font-size="13" fill="#5A5748">ONLY ABOUT A QUARTER EVER REACHES THE CRANKSHAFT AS USEFUL WORK</text>

<!-- measurement line -->
<line x1="60" y1="160" x2="740" y2="160" stroke="#33505E" stroke-width="1.3" stroke-dasharray="5 4" marker-start="url(#arrBp19)" marker-end="url(#arrBp19)"/>
<text x="60" y="150" font-size="12" fill="#5A5748">0%</text>
<text x="740" y="150" text-anchor="end" font-size="12" fill="#5A5748">100%</text>

<!-- Bar segments: cooling 28, exhaust 30, friction 8, pumping 6, useful 28 -->
<!-- x=60 to 740, width 680 -->
<rect x="60"    y="210" width="190.4" height="100" fill="#8C876F" stroke="#22252B" stroke-width="2"/>
<rect x="250.4" y="210" width="204"   height="100" fill="#5A5748" stroke="#22252B" stroke-width="2"/>
<rect x="454.4" y="210" width="54.4"  height="100" fill="#6B5A22" stroke="#22252B" stroke-width="2"/>
<rect x="508.8" y="210" width="40.8"  height="100" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
<rect x="549.6" y="210" width="190.4" height="100" fill="#AE3527" stroke="#22252B" stroke-width="2"/>

<!-- Above the bar: cooling, friction (category name, then %, then short tick down to the bar) -->
<text x="155" y="172" text-anchor="middle" font-size="12" fill="#5A5748">COOLING LOSS</text>
<text x="155" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#22252B">28%</text>
<text x="481" y="178" text-anchor="middle" font-size="11" fill="#5A5748">FRICTION</text>
<text x="481" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">8%</text>

<!-- Below the bar: exhaust, pumping, useful work (short tick, then %, then category name) -->
<text x="352" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#22252B">30%</text>
<text x="352" y="360" text-anchor="middle" font-size="12" fill="#5A5748">EXHAUST HEAT</text>
<text x="529" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">6%</text>
<text x="529" y="358" text-anchor="middle" font-size="11" fill="#5A5748">PUMPING</text>
<text x="645" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#AE3527">28%</text>
<text x="645" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527">USEFUL WORK</text>
<text x="645" y="377" text-anchor="middle" font-size="11" fill="#5A5748">(AT CRANKSHAFT)</text>

<!-- leader ticks -->
<line x1="155" y1="203" x2="155" y2="210" stroke="#5A5748" stroke-width="1"/>
<line x1="481" y1="203" x2="481" y2="210" stroke="#5A5748" stroke-width="1"/>
<line x1="352" y1="310" x2="352" y2="318" stroke="#5A5748" stroke-width="1"/>
<line x1="529" y1="310" x2="529" y2="318" stroke="#5A5748" stroke-width="1"/>
<line x1="645" y1="310" x2="645" y2="318" stroke="#AE3527" stroke-width="1"/>

<!-- Bottom callout -->
<rect x="270" y="420" width="260" height="46" fill="#EEE8DA" stroke="#AE3527" stroke-width="1.8"/>
<text x="400" y="449" text-anchor="middle" font-size="13.5" font-weight="700" fill="#AE3527">&#8776; 3/4 OF THE ENERGY NEVER TURNS THE WHEEL</text>
</svg>
