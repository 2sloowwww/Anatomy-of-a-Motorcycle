<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">T-CLOCS: SIX LETTERS, SIX VERIFIED ASSUMPTIONS</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- six columns -->
  <g font-family="JetBrains Mono, monospace">
    <!-- T -->
    <text x="90" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#AE3527">T</text>
    <text x="90" y="130" text-anchor="middle" font-size="11" fill="#22252B">TYRES &amp;</text>
    <text x="90" y="145" text-anchor="middle" font-size="11" fill="#22252B">WHEELS</text>
    <line x1="90" y1="160" x2="90" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="90" y="240" text-anchor="middle" font-size="10" fill="#5A5748">Ch. 6.4</text>
    <text x="90" y="254" text-anchor="middle" font-size="10" fill="#5A5748">friction circle</text>

    <!-- C -->
    <text x="220" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#33505E">C</text>
    <text x="220" y="130" text-anchor="middle" font-size="11" fill="#22252B">CONTROLS</text>
    <line x1="220" y1="160" x2="220" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="220" y="240" text-anchor="middle" font-size="10" fill="#5A5748">Ch. 9.2 / 9.3</text>
    <text x="220" y="254" text-anchor="middle" font-size="10" fill="#5A5748">lever feel</text>

    <!-- L -->
    <text x="350" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#6B5A22">L</text>
    <text x="350" y="130" text-anchor="middle" font-size="11" fill="#22252B">LIGHTS &amp;</text>
    <text x="350" y="145" text-anchor="middle" font-size="11" fill="#22252B">ELECTRICS</text>
    <line x1="350" y1="160" x2="350" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="350" y="240" text-anchor="middle" font-size="10" fill="#5A5748">Ch. 9.9</text>
    <text x="350" y="254" text-anchor="middle" font-size="10" fill="#5A5748">visibility</text>

    <!-- O -->
    <text x="470" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#AE3527">O</text>
    <text x="470" y="130" text-anchor="middle" font-size="11" fill="#22252B">OIL &amp;</text>
    <text x="470" y="145" text-anchor="middle" font-size="11" fill="#22252B">FLUIDS</text>
    <line x1="470" y1="160" x2="470" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="470" y="240" text-anchor="middle" font-size="10" fill="#5A5748">Ch. 7.3</text>
    <text x="470" y="254" text-anchor="middle" font-size="10" fill="#5A5748">hydraulic force</text>

    <!-- C -->
    <text x="600" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#33505E">C</text>
    <text x="600" y="130" text-anchor="middle" font-size="11" fill="#22252B">CHASSIS</text>
    <line x1="600" y1="160" x2="600" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="600" y="240" text-anchor="middle" font-size="10" fill="#5A5748">Pt. IV / V</text>
    <text x="600" y="254" text-anchor="middle" font-size="10" fill="#5A5748">structure</text>

    <!-- S -->
    <text x="720" y="100" text-anchor="middle" font-size="32" font-weight="900" fill="#6B5A22">S</text>
    <text x="720" y="130" text-anchor="middle" font-size="11" fill="#22252B">STANDS</text>
    <line x1="720" y1="160" x2="720" y2="220" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="720" y="240" text-anchor="middle" font-size="10" fill="#5A5748">stability</text>
    <text x="720" y="254" text-anchor="middle" font-size="10" fill="#5A5748">at rest</text>
  </g>

  <line x1="50" y1="290" x2="750" y2="290" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">EACH LETTER VERIFIES A CONDITION SOME EARLIER CHAPTER ALREADY SHOWED MATTERS</text>

  <line x1="50" y1="450" x2="750" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">TWO MINUTES, SIX SPECIFIC VERIFICATIONS — NOT A GENERIC RITUAL</text>
</svg>
