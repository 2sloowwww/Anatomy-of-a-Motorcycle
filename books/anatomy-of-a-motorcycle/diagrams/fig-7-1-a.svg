<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">ROLLING GRIP VS. A LOCKED, SLIDING WHEEL</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: rolling wheel with brake -->
  <text x="200" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">ROLLING + GRIPPING</text>

  <circle cx="200" cy="255" r="95" fill="none" stroke="#22252B" stroke-width="3"/>
  <!-- disc -->
  <circle cx="200" cy="255" r="55" fill="none" stroke="#8C876F" stroke-width="2"/>
  <!-- caliper -->
  <rect x="180" y="150" width="40" height="35" rx="5" fill="#5A5748"/>
  <text x="200" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">CALIPER</text>

  <!-- heat squiggles at caliper -->
  <g stroke="#AE3527" stroke-width="1.6" fill="none">
    <path d="M 225 165 q 5 -8 10 0 q 5 8 10 0"/>
    <path d="M 225 178 q 5 -8 10 0 q 5 8 10 0"/>
  </g>
  <text x="255" y="172" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">HEAT</text>

  <!-- rotation arrow, still rolling -->
  <path d="M 250 300 A 95 95 0 0 1 200 350" stroke="#33505E" stroke-width="2" fill="none"/>
  <polygon points="200,350 210,340 214,352" fill="#33505E"/>

  <!-- ground contact -->
  <line x1="80" y1="350" x2="320" y2="350" stroke="#33505E" stroke-width="2"/>
  <ellipse cx="200" cy="350" rx="24" ry="6" fill="#33505E"/>
  <line x1="200" y1="350" x2="200" y2="400" stroke="#33505E" stroke-width="2.2"/>
  <polygon points="200,400 193,385 207,385" fill="#33505E"/>
  <text x="200" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#33505E">FULL DECELERATION</text>
  <text x="200" y="434" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">FORCE TRANSMITTED</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="460" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: locked wheel -->
  <text x="600" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#AE3527">LOCKED + SLIDING</text>

  <circle cx="600" cy="255" r="95" fill="none" stroke="#22252B" stroke-width="3"/>
  <circle cx="600" cy="255" r="55" fill="none" stroke="#8C876F" stroke-width="2"/>
  <rect x="580" y="150" width="40" height="35" rx="5" fill="#5A5748"/>
  <text x="600" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">CALIPER</text>

  <!-- X mark showing no rotation -->
  <line x1="565" y1="220" x2="635" y2="290" stroke="#AE3527" stroke-width="2.5"/>
  <line x1="635" y1="220" x2="565" y2="290" stroke="#AE3527" stroke-width="2.5"/>

  <line x1="480" y1="350" x2="720" y2="350" stroke="#33505E" stroke-width="2"/>
  <!-- skid marks -->
  <line x1="560" y1="350" x2="640" y2="350" stroke="#AE3527" stroke-width="5" stroke-dasharray="10 6"/>
  <line x1="600" y1="350" x2="600" y2="395" stroke="#AE3527" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="600,398 593,384 607,384" fill="#AE3527" fill-opacity="0.6"/>
  <text x="600" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#AE3527">REDUCED, UNCONTROLLED</text>
  <text x="600" y="434" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">STOPPING FORCE</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">THE TYRE'S CONTACT PATCH, NOT THE BRAKE ITSELF, DOES THE ACTUAL STOPPING</text>
</svg>
