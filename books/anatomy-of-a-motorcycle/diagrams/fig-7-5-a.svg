<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Side view of a braking motorcycle showing load shifting from the rear tyre to the front tyre, with centre of mass height h and wheelbase L.</title><desc id="d">Under braking the inertia at the centre of mass tends to carry the bike forward, pressing the front tyre harder and unloading the rear. The load moved equals mass times deceleration times h divided by L.</desc>
<style>
svg.dg{--c-ink:var(--ink,#22252B);--c-soft:var(--ink-soft,#5A5748);--c-faint:var(--ink-faint,#8C876F);--c-sig:var(--signal,#AE3527);--c-blu:var(--blueprint,#33505E);--c-brs:var(--brass,#6B5A22);--c-paper:var(--paper,#EEE8DA);--c-deep:var(--paper-deep,#E2D9C3);--c-line:var(--line,rgba(34,37,43,.22))}
