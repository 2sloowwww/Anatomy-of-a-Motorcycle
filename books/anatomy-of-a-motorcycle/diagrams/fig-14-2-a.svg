<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#22252B">EVERYTHING CONVERGES ON CORNERING PERFORMANCE</text>
  <line x1="50" y1="50" x2="750" y2="50" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="310" y="330" width="180" height="42" rx="8" fill="#AE3527"/>
  <text x="400" y="356" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#EEE8DA">MAX CORNERING</text>

  <!-- three converging elements -->
  <rect x="90" y="90" width="170" height="60" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.4"/>
  <text x="175" y="112" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">SHORT TRAIL</text>
  <text x="175" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">Quick steering /</text>
  <text x="175" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">costs stability</text>

  <rect x="315" y="90" width="170" height="60" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.4"/>
  <text x="400" y="112" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">TUCKED COMPONENTS</text>
  <text x="400" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">Max lean angle /</text>
  <text x="400" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">costs practicality</text>

  <rect x="540" y="90" width="170" height="60" rx="6" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.4"/>
  <text x="625" y="112" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#22252B">FORWARD LEAN</text>
  <text x="625" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#5A5748">Front grip feedback /</text>
  <text x="625" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#AE3527">costs comfort</text>

  <line x1="175" y1="150" x2="380" y2="330" stroke="#8C876F" stroke-width="1.4"/>
  <line x1="400" y1="150" x2="400" y2="330" stroke="#8C876F" stroke-width="1.4"/>
  <line x1="625" y1="150" x2="420" y2="330" stroke="#8C876F" stroke-width="1.4"/>

  <line x1="50" y1="420" x2="750" y2="420" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">EVERY DESIGN CHOICE HAS A CORRESPONDING, HONEST COST</text>
