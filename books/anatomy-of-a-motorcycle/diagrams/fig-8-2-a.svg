<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">STATIC VS. KINETIC FRICTION</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- axes -->
  <line x1="110" y1="400" x2="110" y2="90" stroke="#33505E" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="700" y2="400" stroke="#33505E" stroke-width="1.5"/>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">DEMANDED FORCE →</text>
  <text x="60" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748" transform="rotate(-90 60 245)">AVAILABLE FRICTION FORCE</text>

  <!-- static friction rising line -->
  <line x1="110" y1="395" x2="330" y2="130" stroke="#33505E" stroke-width="3"/>
  <text x="170" y="220" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#33505E" transform="rotate(-58 170 220)">STATIC FRICTION</text>

  <!-- peak marker -->
  <circle cx="330" cy="130" r="6" fill="#AE3527"/>
  <line x1="330" y1="130" x2="330" y2="400" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="330" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">PEAK (SLIP BEGINS)</text>

  <!-- drop to kinetic level -->
  <line x1="330" y1="130" x2="345" y2="190" stroke="#AE3527" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- kinetic friction flat/lower line -->
  <line x1="345" y1="190" x2="690" y2="200" stroke="#AE3527" stroke-width="3"/>
  <text x="500" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#AE3527">KINETIC FRICTION (LOWER, FLATTER)</text>

  <!-- annotation -->
  <text x="500" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">SLIDING (BEYOND FRICTION CIRCLE)</text>
  <text x="200" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">GRIPPING (WITHIN CIRCLE)</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">ONCE SLIDING STARTS, THE CEILING ON FORCE DROPS — IT DOESN'T JUST TAPER</text>
</svg>
