<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#22252B">STAGGERED FORMATION AND COMPOUNDING REACTION TIME</text>
  <line x1="50" y1="52" x2="750" y2="52" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- lane -->
  <rect x="300" y="80" width="200" height="380" fill="#8C876F" fill-opacity="0.2"/>
  <line x1="300" y1="80" x2="300" y2="460" stroke="#33505E" stroke-width="2"/>
  <line x1="500" y1="80" x2="500" y2="460" stroke="#33505E" stroke-width="2"/>

  <!-- staggered riders -->
  <circle cx="340" cy="130" r="14" fill="#AE3527" stroke="#22252B" stroke-width="2"/>
  <text x="340" y="112" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">RIDER 1</text>

  <circle cx="460" cy="210" r="14" fill="#33505E" stroke="#22252B" stroke-width="2"/>
  <text x="460" y="192" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">RIDER 2</text>

  <circle cx="340" cy="290" r="14" fill="#6B5A22" stroke="#22252B" stroke-width="2"/>
  <text x="340" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">RIDER 3</text>

  <circle cx="460" cy="370" r="14" fill="#22252B" stroke="#22252B" stroke-width="2"/>
  <text x="460" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">RIDER 4</text>

  <!-- following distance measurement, rider3 to rider1 (two positions ahead) -->
  <line x1="340" y1="276" x2="340" y2="144" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="340,144 334,156 346,156" fill="#AE3527"/>
  <text x="250" y="210" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#AE3527" transform="rotate(-90 250 210)">FOLLOWING DIST. (2 AHEAD)</text>

  <!-- reaction time propagation arrows down the line -->
  <line x1="560" y1="130" x2="560" y2="370" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="560,370 553,358 567,358" fill="#33505E"/>
  <text x="600" y="250" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">REACTION DELAY</text>
  <text x="600" y="266" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">COMPOUNDS BACKWARD</text>

  <line x1="50" y1="450" x2="750" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="470" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">STAGGERING PRESERVES REAL STOPPING-DISTANCE MARGIN, NOT JUST VISUAL SPACING</text>
</svg>
