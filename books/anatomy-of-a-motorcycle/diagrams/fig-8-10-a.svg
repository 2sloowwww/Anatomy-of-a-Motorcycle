<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22252B">GYROSCOPIC STABILITY VS. WOBBLE TENDENCY</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- axes -->
  <line x1="110" y1="400" x2="110" y2="90" stroke="#33505E" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="700" y2="400" stroke="#33505E" stroke-width="1.5"/>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#5A5748">ROAD SPEED →</text>
  <text x="130" y="418" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C876F">WALKING PACE</text>
  <text x="660" y="418" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C876F">HIGHWAY</text>

  <!-- gyroscopic stability curve, rising -->
  <path d="M 110 380 Q 300 320 700 130" fill="none" stroke="#33505E" stroke-width="3"/>
  <text x="520" y="180" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#33505E">GYROSCOPIC STABILIZING EFFECT</text>

  <!-- wobble tendency curve, falling -->
  <path d="M 110 150 Q 300 220 700 370" fill="none" stroke="#AE3527" stroke-width="3"/>
  <text x="250" y="140" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#AE3527">WOBBLE TENDENCY</text>

  <!-- crossover marker and "stable zone" -->
  <line x1="350" y1="90" x2="350" y2="400" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="350" y="90" width="350" height="310" fill="#6B5A22" fill-opacity="0.08"/>
  <text x="525" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#6B5A22">STABLE, "PLANTED" ZONE</text>

  <line x1="60" y1="452" x2="740" y2="452" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5A5748">SLOW-SPEED WOBBLE IS A REAL PHYSICAL EFFECT, NOT JUST RIDER SKILL</text>
</svg>
