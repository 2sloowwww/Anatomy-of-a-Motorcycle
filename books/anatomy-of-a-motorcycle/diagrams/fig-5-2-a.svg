<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="axisArrow52" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#33505E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="34" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.4">SPRING RATE: FORCE VS. COMPRESSION</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5748">LINEAR SPRING VS. PROGRESSIVE SPRING</text>

  <!-- Gridlines (faint) -->
  <g stroke="#8C876F" stroke-width="1" stroke-dasharray="2 5" opacity="0.55">
    <line x1="230" y1="430" x2="230" y2="80"/>
    <line x1="350" y1="430" x2="350" y2="80"/>
    <line x1="470" y1="430" x2="470" y2="80"/>
    <line x1="590" y1="430" x2="590" y2="80"/>
    <line x1="710" y1="430" x2="710" y2="80"/>
    <line x1="110" y1="350" x2="710" y2="350"/>
    <line x1="110" y1="270" x2="710" y2="270"/>
    <line x1="110" y1="190" x2="710" y2="190"/>
    <line x1="110" y1="110" x2="710" y2="110"/>
  </g>

  <!-- Axes -->
  <line x1="110" y1="430" x2="730" y2="430" stroke="#33505E" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#axisArrow52)"/>
  <line x1="110" y1="430" x2="110" y2="65" stroke="#33505E" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#axisArrow52)"/>

  <text x="420" y="463" text-anchor="middle" font-size="14.5" font-weight="600" fill="#33505E" letter-spacing="0.3">COMPRESSION (TRAVEL) &#8594;</text>
  <text x="83" y="250" text-anchor="middle" font-size="14.5" font-weight="600" fill="#33505E" letter-spacing="0.3" transform="rotate(-90 83 250)">FORCE &#8594;</text>

  <!-- Linear spring: constant slope -->
  <line x1="110" y1="430" x2="655" y2="148" stroke="#22252B" stroke-width="2.75" stroke-linecap="round"/>
  <text x="662" y="145" font-size="15" font-weight="700" fill="#22252B">LINEAR SPRING</text>
  <text x="662" y="163" font-size="11.5" fill="#5A5748">constant rate</text>

  <!-- Progressive spring: shallow start, steepens deep in stroke -->
  <path d="M110,430 C300,414 470,320 620,105" fill="none" stroke="#AE3527" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#AE3527">PROGRESSIVE SPRING</text>
  <text x="500" y="108" text-anchor="middle" font-size="11.5" fill="#AE3527">rate increases with compression</text>

  <!-- Callout: early travel, progressive is softer -->
  <circle cx="230" cy="399" r="4.5" fill="#AE3527"/>
  <line x1="230" y1="399" x2="230" y2="500" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
  <line x1="238" y1="399" x2="290" y2="368" stroke="#6B5A22" stroke-width="1.3"/>
  <text x="296" y="365" font-size="13" font-weight="600" fill="#6B5A22">SOFTER EARLY —</text>
  <text x="296" y="381" font-size="13" font-weight="600" fill="#6B5A22">SMALL-BUMP COMPLIANCE</text>

  <!-- Callout: late travel, progressive steepens past linear -->
  <circle cx="560" cy="151" r="4.5" fill="#AE3527"/>
  <line x1="552" y1="155" x2="480" y2="195" stroke="#6B5A22" stroke-width="1.3"/>
  <text x="185" y="205" font-size="13" font-weight="600" fill="#6B5A22">STEEPENS DEEPER IN STROKE —</text>
  <text x="185" y="221" font-size="13" font-weight="600" fill="#6B5A22">RESISTS BOTTOMING OUT</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.2-A</text>
</svg>
