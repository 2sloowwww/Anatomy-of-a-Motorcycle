<text class="th" x="40" y="58">The four-stroke cycle</text>
<text class="tm tbl" x="40" y="84">720 degrees of crank rotation, one power stroke</text>
<text class="tm end" x="868" y="534" style="stroke-width:0">FIG. 2.2-A</text>
<rect class="tint-a fade" data-i="2" x="448" y="100" width="204" height="424" rx="8"/>
<text class="tm end fade" data-i="1" x="860" y="84">= 2 crank turns</text>
