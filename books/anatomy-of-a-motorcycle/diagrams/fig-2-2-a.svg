<text class="tm mid fade" data-i="2" x="130" y="398">STROKE 1</text>
<text class="tb mid fade" data-i="2" x="130" y="424">Intake</text>
<text class="tm mid fade" data-i="2" x="130" y="446">0° → 180°</text>
<text class="tsm mid fade" data-i="3" x="130" y="474">Piston falls, intake</text>
<text class="tsm mid fade" data-i="3" x="130" y="494">valve opens, mixture</text>
<text class="tsm mid fade" data-i="3" x="130" y="514">is drawn in.</text>
