<line class="s draw" data-i="4" x1="410" y1="267" x2="410" y2="222.5"/>
<polygon class="fill-s pop" data-i="5" points="410,211 402.7,225 417.3,225"/>
<circle class="s draw" data-i="4" cx="340" cy="346" r="24"/>
<path class="b draw" data-i="4" d="M340 370A24 24 0 0 1 340 322"/>
<line class="b draw" data-i="4" x1="334" y1="322" x2="335" y2="322"/>
<polygon class="fill-b pop" data-i="5" points="344,322 333,316.3 333,327.7"/>
<text class="tm mid fade" data-i="4" x="340" y="398">STROKE 2</text>
<text class="tb mid fade" data-i="4" x="340" y="424">Compression</text>
<text class="tm mid fade" data-i="4" x="340" y="446">180° → 360°</text>
<text class="tsm mid fade" data-i="5" x="340" y="474">Both valves shut.</text>
<text class="tsm mid fade" data-i="5" x="340" y="494">The rising piston</text>
<text class="tsm mid fade" data-i="5" x="340" y="514">squeezes the mixture.</text>
