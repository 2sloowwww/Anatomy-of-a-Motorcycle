<rect class="fill-d k draw" data-i="3" x="296" y="226" width="88" height="30" rx="3"/>
<line class="s draw" data-i="3" x1="296" y1="235" x2="384" y2="235"/>
<line class="s draw" data-i="3" x1="296" y1="243" x2="384" y2="243"/>
<line class="k draw" data-i="3" x1="316" y1="112" x2="316" y2="148"/>
