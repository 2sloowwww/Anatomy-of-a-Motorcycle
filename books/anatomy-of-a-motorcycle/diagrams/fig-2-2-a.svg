<polyline class="a draw" data-i="5" points="542,112 554,126 546,130 558,146"/>
<text class="tm ta fade" data-i="7" x="596" y="126">SPARK</text>
<line class="g draw" data-i="6" x1="620" y1="169" x2="620" y2="213.5"/>
<polygon class="fill-g pop" data-i="7" points="620,225 627.3,211 612.7,211"/>
<circle class="s draw" data-i="6" cx="550" cy="346" r="24"/>
<path class="g draw" data-i="6" d="M550 322A24 24 0 0 1 550 370"/>
<line class="g draw" data-i="6" x1="556" y1="370" x2="555" y2="370"/>
<polygon class="fill-g pop" data-i="7" points="546,370 557,375.7 557,364.3"/>
<text class="tm mid fade" data-i="6" x="550" y="398">STROKE 3</text>
<text class="tb mid ta fade" data-i="6" x="550" y="424">Power</text>
<text class="tm mid fade" data-i="6" x="550" y="446">360° → 540°</text>
<text class="tsm mid fade" data-i="7" x="550" y="474">Spark! The burn</text>
<text class="tsm mid fade" data-i="7" x="550" y="494">shoves the piston down.</text>
<text class="tsm mid fade" data-i="7" x="550" y="514">The only work done.</text>
