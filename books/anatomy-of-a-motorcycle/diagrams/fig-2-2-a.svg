<rect class="fill-d k draw" data-i="7" x="716" y="226" width="88" height="30" rx="3"/>
<line class="s draw" data-i="7" x1="716" y1="235" x2="804" y2="235"/>
<line class="s draw" data-i="7" x1="716" y1="243" x2="804" y2="243"/>
<line class="k draw" data-i="7" x1="736" y1="112" x2="736" y2="148"/>
<rect class="fill-k fade" data-i="7" x="722" y="148" width="28" height="6" rx="2"/>
<line class="a draw" data-i="7" x1="784" y1="112" x2="784" y2="162"/>
<rect class="fill-a fade" data-i="7" x="770" y="162" width="28" height="6" rx="2"/>
<line class="a draw" data-i="8" x1="794" y1="142" x2="823.9" y2="125.5"/>
<polygon class="fill-a pop" data-i="9" points="834,120 818.2,120.4 825.2,133.1"/>
<line class="s draw" data-i="8" x1="830" y1="267" x2="830" y2="222.5"/>
<polygon class="fill-s pop" data-i="9" points="830,211 822.7,225 837.3,225"/>
<circle class="s draw" data-i="8" cx="760" cy="346" r="24"/>
<path class="b draw" data-i="8" d="M760 370A24 24 0 0 1 760 322"/>
<line class="b draw" data-i="8" x1="754" y1="322" x2="755" y2="322"/>
<polygon class="fill-b pop" data-i="9" points="764,322 753,316.3 753,327.7"/>
<text class="tm mid fade" data-i="8" x="760" y="398">STROKE 4</text>
<text class="tb mid fade" data-i="8" x="760" y="424">Exhaust</text>
<text class="tm mid fade" data-i="8" x="760" y="446">540° → 720°</text>
<text class="tsm mid fade" data-i="9" x="760" y="474">Exhaust valve opens,</text>
