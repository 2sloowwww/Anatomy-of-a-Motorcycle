<svg viewBox="0 0 1410 2250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Espresso Field Manual — book cover, showing a portafilter, pressure gauge, and extraction diagram in blueprint line art.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <pattern id="grid" width="47" height="47" patternUnits="userSpaceOnUse">
      <path d="M47 0H0V47" fill="none" stroke="#C08552" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1410" height="2250" fill="url(#bg)"/>
  <rect width="1410" height="2250" fill="url(#grid)"/>

  <rect x="56" y="56" width="1298" height="2138" fill="none" stroke="#C08552" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#D2AC3E" stroke-width="2" opacity="0.9">
    <path d="M56 110 H110 M56 56 V110" fill="none"/>
    <path d="M1354 110 H1300 M1354 56 V110" fill="none"/>
    <path d="M56 2140 H110 M56 2194 V2140" fill="none"/>
    <path d="M1354 2140 H1300 M1354 2194 V2140" fill="none"/>
  </g>

  <text x="705" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="6" fill="#C08552">A FIELD MANUAL FOR UNDERSTANDING EXTRACTION</text>

  <text x="705" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="104" fill="#F0E4D4">THE ESPRESSO</text>
  <text x="705" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="104" fill="#F0E4D4">FIELD MANUAL</text>

  <line x1="330" y1="510" x2="1080" y2="510" stroke="#D2AC3E" stroke-width="2" opacity="0.7"/>

  <!-- Portafilter and puck -->
  <g transform="translate(230,730)">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C08552" letter-spacing="3">PORTAFILTER — THE PUCK BENEATH THE PRESSURE</text>
    <path d="M180 0 L180 90 L120 150 A120 120 0 1 0 360 150 L300 90 L300 0 Z" fill="none" stroke="#7FA6B8" stroke-width="2.5"/>
    <rect x="120" y="150" width="240" height="30" fill="none" stroke="#D2AC3E" stroke-width="2.2"/>
    <line x1="140" y1="0" x2="140" y2="-60" stroke="#EDE4D8" stroke-width="2.5"/>
    <path d="M110 -60 H170" stroke="#EDE4D8" stroke-width="2.5"/>
    <g stroke="#E2574A" stroke-width="1.6" opacity="0.85">
      <line x1="220" y1="180" x2="215" y2="230"/>
      <line x1="240" y1="180" x2="240" y2="235"/>
      <line x1="260" y1="180" x2="265" y2="230"/>
    </g>
    <text x="220" y="230" text-anchor="middle" font-size="15" fill="#8C876F" font-family="'JetBrains Mono', monospace">EXTRACTION</text>
  </g>

  <!-- Pressure gauge -->
  <g transform="translate(230,1060)">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C08552" letter-spacing="3">9 BAR — WHY THIS BECAME THE STANDARD</text>
    <circle cx="90" cy="90" r="90" fill="none" stroke="#EDE4D8" stroke-width="2.2"/>
    <circle cx="90" cy="90" r="70" fill="none" stroke="#7FA6B8" stroke-opacity="0.4" stroke-width="1.6"/>
    <line x1="90" y1="90" x2="140" y2="45" stroke="#E2574A" stroke-width="3"/>
    <circle cx="90" cy="90" r="6" fill="#E2574A"/>
    <text x="240" y="70" font-size="16" fill="#8C876F" font-family="'JetBrains Mono', monospace">PRE-INFUSION</text>
    <text x="240" y="100" font-size="16" fill="#8C876F" font-family="'JetBrains Mono', monospace">RAMP · HOLD · DECLINE</text>
  </g>

  <!-- Ratio triangle -->
  <g transform="translate(230,1350)" stroke="#EDE4D8" stroke-width="2" fill="none">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#C08552" letter-spacing="3">DOSE · YIELD · TIME</text>
    <path d="M85 20 L170 170 L0 170 Z"/>
    <circle cx="85" cy="20" r="5" fill="#E2574A" stroke="none"/>
    <circle cx="170" cy="170" r="5" fill="#D2AC3E" stroke="none"/>
    <circle cx="0" cy="170" r="5" fill="#7FA6B8" stroke="none"/>
  </g>

  <line x1="330" y1="1720" x2="1080" y2="1720" stroke="#D2AC3E" stroke-width="2" opacity="0.7"/>

  <text x="705" y="1790" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="5" fill="#BDAE9C">GRIND · PUCK · PRESSURE · EXTRACTION</text>
  <text x="705" y="1826" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="5" fill="#BDAE9C">MILK · BEANS · MACHINE · PALATE</text>

  <text x="705" y="2110" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#F0E4D4">Jitendra Kulkarni</text>
</svg>
