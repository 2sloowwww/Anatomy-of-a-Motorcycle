<svg viewBox="0 0 1410 2250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a Camera — book cover, showing a lens cross-section with light rays converging on a sensor, in blueprint line art.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#100E0C"/>
    </linearGradient>
    <pattern id="grid" width="47" height="47" patternUnits="userSpaceOnUse">
      <path d="M47 0H0V47" fill="none" stroke="#B8946A" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1410" height="2250" fill="url(#bg)"/>
  <rect width="1410" height="2250" fill="url(#grid)"/>

  <rect x="56" y="56" width="1298" height="2138" fill="none" stroke="#B8946A" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#D2AC3E" stroke-width="2" opacity="0.9">
    <path d="M56 110 H110 M56 56 V110" fill="none"/>
    <path d="M1354 110 H1300 M1354 56 V110" fill="none"/>
    <path d="M56 2140 H110 M56 2194 V2140" fill="none"/>
    <path d="M1354 2140 H1300 M1354 2194 V2140" fill="none"/>
  </g>

  <text x="705" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" letter-spacing="7" fill="#B8946A">A FIELD MANUAL FOR UNDERSTANDING LIGHT</text>

  <text x="705" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="118" fill="#EDE4D8">ANATOMY</text>
  <text x="705" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="118" fill="#EDE4D8">OF A CAMERA</text>

  <line x1="330" y1="510" x2="1080" y2="510" stroke="#D2AC3E" stroke-width="2" opacity="0.7"/>

  <!-- Lens cross-section with converging rays -->
  <g transform="translate(180,720)">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#B8946A" letter-spacing="3">OPTICAL PATH — LENS TO SENSOR</text>
    <ellipse cx="140" cy="90" rx="46" ry="95" fill="none" stroke="#7FA6B8" stroke-width="2.5"/>
    <ellipse cx="220" cy="90" rx="38" ry="82" fill="none" stroke="#7FA6B8" stroke-width="2.5"/>
    <line x1="0" y1="30" x2="140" y2="70" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="0" y1="60" x2="140" y2="85" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="0" y1="150" x2="140" y2="110" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="0" y1="120" x2="140" y2="95" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="140" y1="70" x2="700" y2="90" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="140" y1="85" x2="700" y2="90" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="140" y1="110" x2="700" y2="90" stroke="#E2574A" stroke-width="1.6"/>
    <line x1="140" y1="95" x2="700" y2="90" stroke="#E2574A" stroke-width="1.6"/>
    <rect x="700" y="10" width="18" height="160" fill="none" stroke="#D2AC3E" stroke-width="2.5"/>
    <text x="695" y="200" text-anchor="middle" font-size="15" fill="#8C876F" font-family="'JetBrains Mono', monospace">SENSOR</text>
  </g>

  <!-- Aperture iris -->
  <g transform="translate(180,1010)">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#B8946A" letter-spacing="3">APERTURE — THE IRIS OF THE LENS</text>
    <g transform="translate(150,90)">
      <circle r="90" fill="none" stroke="#7FA6B8" stroke-opacity="0.4" stroke-width="2"/>
      <path d="M0 -55 L45 -30 L45 30 L0 55 L-45 30 L-45 -30 Z" fill="none" stroke="#EDE4D8" stroke-width="2.2"/>
      <circle r="26" fill="none" stroke="#E2574A" stroke-width="2.2"/>
    </g>
    <text x="330" y="70" font-size="16" fill="#8C876F" font-family="'JetBrains Mono', monospace">f/2.8 — WIDE APERTURE</text>
    <text x="330" y="100" font-size="16" fill="#8C876F" font-family="'JetBrains Mono', monospace">SHALLOW DEPTH OF FIELD</text>
  </g>

  <!-- Exposure triangle -->
  <g transform="translate(180,1290)" stroke="#EDE4D8" stroke-width="2" fill="none">
    <text x="0" y="-24" font-family="'JetBrains Mono', monospace" font-size="20" fill="#B8946A" letter-spacing="3">APERTURE · SHUTTER · ISO</text>
    <path d="M85 20 L170 170 L0 170 Z"/>
    <circle cx="85" cy="20" r="5" fill="#E2574A" stroke="none"/>
    <circle cx="170" cy="170" r="5" fill="#D2AC3E" stroke="none"/>
    <circle cx="0" cy="170" r="5" fill="#7FA6B8" stroke="none"/>
  </g>

  <line x1="330" y1="1720" x2="1080" y2="1720" stroke="#D2AC3E" stroke-width="2" opacity="0.7"/>

  <text x="705" y="1790" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="5" fill="#B8AFA0">LIGHT · LENS · SENSOR · EXPOSURE</text>
  <text x="705" y="1826" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="5" fill="#B8AFA0">FOCUS · COMPOSITION · POST</text>

  <text x="705" y="2110" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#EDE4D8">Jitendra Kulkarni</text>
</svg>
