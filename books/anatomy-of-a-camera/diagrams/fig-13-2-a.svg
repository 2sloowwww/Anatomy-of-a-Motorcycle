<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.5">SENSOR TO CARD — WHERE THE BURST STALLS</text>
  <line x1="120" y1="54" x2="680" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <rect x="50" y="80" width="130" height="50" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="115" y="102" text-anchor="middle" font-size="11" fill="#22252B">SENSOR</text>
    <text x="115" y="118" text-anchor="middle" font-size="9.5" fill="#5A5748">readout</text>

    <line x1="180" y1="105" x2="230" y2="105" stroke="#33505E" stroke-width="1.8"/>
    <path d="M230,105 L222,100 L222,110 Z" fill="#33505E"/>

    <rect x="235" y="80" width="130" height="50" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <text x="300" y="102" text-anchor="middle" font-size="11" fill="#33505E">BUFFER</text>
    <text x="300" y="118" text-anchor="middle" font-size="9.5" fill="#5A5748">fast, finite</text>

    <line x1="365" y1="105" x2="415" y2="105" stroke="#AE3527" stroke-width="1.8"/>
    <path d="M415,105 L407,100 L407,110 Z" fill="#AE3527"/>

    <rect x="420" y="80" width="150" height="50" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.6"/>
    <text x="495" y="102" text-anchor="middle" font-size="11" fill="#AE3527">MEMORY CARD</text>
    <text x="495" y="118" text-anchor="middle" font-size="9.5" fill="#5A5748">sustained write speed</text>

    <text x="640" y="108" font-size="10.5" fill="#8C876F">← bottleneck lives here</text>
  </g>

  <line x1="130" y1="160" x2="670" y2="160" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="400" y="188" text-anchor="middle" font-size="12.5" fill="#8C876F" letter-spacing="1">TWO-SLOT WORKFLOW — CHOOSE THE BEHAVIOR</text>

    <rect x="120" y="210" width="260" height="120" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <text x="250" y="234" text-anchor="middle" font-size="12" fill="#33505E" font-weight="700">OVERFLOW</text>
    <rect x="140" y="250" width="90" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="185" y="271" text-anchor="middle" font-size="10" fill="#22252B">SLOT A — fills</text>
    <rect x="240" y="250" width="90" height="34" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="285" y="271" text-anchor="middle" font-size="10" fill="#5A5748">SLOT B — waits</text>
    <text x="250" y="308" text-anchor="middle" font-size="10" fill="#5A5748">max capacity, single point of failure</text>

    <rect x="420" y="210" width="260" height="120" fill="none" stroke="#AE3527" stroke-width="1.8"/>
    <text x="550" y="234" text-anchor="middle" font-size="12" fill="#AE3527" font-weight="700">MIRRORED</text>
    <rect x="440" y="250" width="90" height="34" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.4"/>
    <text x="485" y="271" text-anchor="middle" font-size="10" fill="#22252B">SLOT A — copy</text>
    <rect x="540" y="250" width="90" height="34" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.4"/>
    <text x="585" y="271" text-anchor="middle" font-size="10" fill="#22252B">SLOT B — copy</text>
    <text x="550" y="308" text-anchor="middle" font-size="10" fill="#5A5748">halved capacity, no single point of failure</text>
  </g>

  <text x="400" y="358" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">FOR IRREPLACEABLE MATERIAL, MIRRORED IS THE ONLY DEFENSIBLE DEFAULT</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 13.2-A</text>
</svg>
