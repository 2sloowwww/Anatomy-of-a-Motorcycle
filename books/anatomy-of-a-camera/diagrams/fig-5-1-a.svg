<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.5">FOCUS IS WHERE THE CONE CLOSES TO A POINT</text>
  <line x1="130" y1="54" x2="670" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="65" y="80" font-size="11.5" fill="#8C876F" letter-spacing="1">CASE A — SENSOR AT THE POINT OF CONVERGENCE</text>

    <line x1="90" y1="100" x2="90" y2="150" stroke="#22252B" stroke-width="1.4"/>
    <text x="60" y="128" font-size="9" fill="#5A5748">SUBJECT</text>

    <path d="M90,105 L330,120 M90,145 L330,120" fill="none" stroke="#33505E" stroke-width="1.5"/>
    <path d="M330,120 L470,105 M330,120 L470,145" fill="none" stroke="#33505E" stroke-width="1.5"/>

    <rect x="465" y="90" width="10" height="70" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <line x1="470" y1="90" x2="470" y2="160" stroke="#AE3527" stroke-width="2"/>
    <circle cx="470" cy="120" r="2" fill="#AE3527"/>
    <text x="480" y="100" font-size="9" fill="#5A5748">SENSOR</text>
    <text x="330" y="105" text-anchor="middle" font-size="9" fill="#6B5A22">POINT OF CONVERGENCE</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="65" y="200" font-size="11.5" fill="#8C876F" letter-spacing="1">CASE B — SENSOR SHORT OF CONVERGENCE (FRONT-FOCUSED)</text>

    <line x1="90" y1="220" x2="90" y2="270" stroke="#22252B" stroke-width="1.4"/>

    <path d="M90,225 L330,240 M90,265 L330,240" fill="none" stroke="#33505E" stroke-width="1.5"/>
    <path d="M330,240 L470,225 M330,240 L470,265" fill="none" stroke="#33505E" stroke-width="1.5"/>

    <rect x="395" y="210" width="10" height="60" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <line x1="400" y1="210" x2="400" y2="270" stroke="#AE3527" stroke-width="2" stroke-dasharray="3 2"/>
    <ellipse cx="400" cy="240" rx="7" ry="14" fill="none" stroke="#AE3527" stroke-width="2"/>
    <text x="410" y="215" font-size="9" fill="#5A5748">SENSOR</text>
    <text x="330" y="225" text-anchor="middle" font-size="9" fill="#6B5A22">CONVERGES LATER</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <rect x="65" y="300" width="670" height="150" fill="none" stroke="#22252B" stroke-width="1.2"/>
    <text x="80" y="325" font-size="12" fill="#6B5A22" font-weight="700">RESULT ON THE SENSOR PLANE</text>

    <circle cx="220" cy="380" r="4" fill="#22252B"/>
    <text x="220" y="410" text-anchor="middle" font-size="10" fill="#22252B">A POINT — TRUE FOCUS</text>

    <circle cx="440" cy="380" r="18" fill="none" stroke="#AE3527" stroke-width="2"/>
    <text x="440" y="410" text-anchor="middle" font-size="10" fill="#AE3527">A DISC — CIRCLE OF CONFUSION</text>

    <text x="630" y="380" text-anchor="middle" font-size="9.5" fill="#5A5748">Same subject.</text>
    <text x="630" y="395" text-anchor="middle" font-size="9.5" fill="#5A5748">Only the sensor's</text>
    <text x="630" y="410" text-anchor="middle" font-size="9.5" fill="#5A5748">position changed.</text>
  </g>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.1-A</text>
</svg>
