  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">WHAT A LENS DOES TO LIGHT</text>
  <line x1="180" y1="54" x2="620" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <circle cx="90" cy="240" r="5" fill="#AE3527"/>
    <text x="60" y="270" font-size="10" fill="#5A5748">POINT ON</text>
    <text x="60" y="283" font-size="10" fill="#5A5748">SUBJECT</text>

    <line x1="90" y1="240" x2="330" y2="140" stroke="#AE3527" stroke-width="1.3"/>
    <line x1="90" y1="240" x2="330" y2="190" stroke="#AE3527" stroke-width="1.3"/>
    <line x1="90" y1="240" x2="330" y2="240" stroke="#AE3527" stroke-width="1.3"/>
