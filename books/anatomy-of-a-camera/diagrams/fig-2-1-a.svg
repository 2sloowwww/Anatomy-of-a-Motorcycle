  <line x1="70" y1="410" x2="730" y2="410" stroke="#8C876F" stroke-width="1"/>
  <text x="400" y="440" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">A LENS TAKES DIVERGING LIGHT FROM ONE POINT AND BENDS IT BACK TO ONE POINT</text>
  <text x="400" y="463" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Every other property in this part is a variation on how precisely — and where — it does that.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 2.1-A</text>
