    <line x1="90" y1="240" x2="330" y2="340" stroke="#AE3527" stroke-width="1.3"/>
    <text x="140" y="150" font-size="10" fill="#8C876F">DIVERGING RAYS</text>

    <ellipse cx="345" cy="240" rx="26" ry="120" fill="none" stroke="#33505E" stroke-width="2.4"/>
    <ellipse cx="385" cy="240" rx="26" ry="120" fill="none" stroke="#33505E" stroke-width="2.4"/>
    <text x="365" y="378" text-anchor="middle" font-size="11" fill="#5A5748">LENS ELEMENTS</text>

    <line x1="330" y1="140" x2="560" y2="240" stroke="#22252B" stroke-width="1.4"/>
    <line x1="330" y1="190" x2="560" y2="240" stroke="#22252B" stroke-width="1.4"/>
    <line x1="330" y1="240" x2="560" y2="240" stroke="#22252B" stroke-width="1.4"/>
    <line x1="330" y1="290" x2="560" y2="240" stroke="#22252B" stroke-width="1.4"/>
    <line x1="330" y1="340" x2="560" y2="240" stroke="#22252B" stroke-width="1.4"/>
    <text x="440" y="150" font-size="10" fill="#8C876F">CONVERGING RAYS</text>

    <circle cx="560" cy="240" r="4.5" fill="#D2AC3E" stroke="#6B5A22"/>
