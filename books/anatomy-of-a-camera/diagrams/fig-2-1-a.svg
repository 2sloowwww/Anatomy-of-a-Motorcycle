    <line x1="658" y1="130" x2="658" y2="350" stroke="#8C876F" stroke-width="0.8" stroke-dasharray="2 4"/>
    <text x="658" y="378" text-anchor="middle" font-size="11" fill="#5A5748">SENSOR PLANE</text>
