<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">SPEED VS. CONTROL — FOUR TRADE-OFFS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace" font-weight="700" letter-spacing="0.5">
    <text x="145" y="76" text-anchor="middle" font-size="11" fill="#33505E">FASTER · SIMPLER</text>
    <text x="655" y="76" text-anchor="middle" font-size="11" fill="#AE3527">SLOWER · MORE CONTROL</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <!-- Row 1: Trimming -->
    <text x="400" y="98" text-anchor="middle" font-size="10.5" fill="#8C876F" letter-spacing="0.5">TRIMMING — CHAPTER 5.3</text>
    <rect x="50" y="104" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="145" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">RIPPLE TRIM</text>
    <rect x="560" y="104" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="655" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">ROLL TRIM</text>
    <line x1="245" y1="121" x2="555" y2="121" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4,3"/>
    <circle cx="245" cy="121" r="4" fill="#AE3527"/>
    <circle cx="555" cy="121" r="4" fill="#33505E"/>

    <!-- Row 2: Multicam vs Group -->
    <text x="400" y="196" text-anchor="middle" font-size="10.5" fill="#8C876F" letter-spacing="0.5">MULTI-SOURCE CUTTING — CHAPTERS 6.1 / 6.5</text>
    <rect x="50" y="202" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="145" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">LIVE MULTICAM CUT</text>
    <rect x="560" y="202" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="655" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">GROUP CLIP SWITCH</text>
    <line x1="245" y1="219" x2="555" y2="219" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4,3"/>
    <circle cx="245" cy="219" r="4" fill="#AE3527"/>
    <circle cx="555" cy="219" r="4" fill="#33505E"/>

    <!-- Row 3: Titles -->
    <text x="400" y="294" text-anchor="middle" font-size="10.5" fill="#8C876F" letter-spacing="0.5">TITLES — CHAPTER 7.3</text>
    <rect x="50" y="300" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="145" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">TEXT+ / TEMPLATE</text>
    <rect x="560" y="300" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="655" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">FUSION TITLE</text>
    <line x1="245" y1="317" x2="555" y2="317" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4,3"/>
    <circle cx="245" cy="317" r="4" fill="#AE3527"/>
    <circle cx="555" cy="317" r="4" fill="#33505E"/>

    <!-- Row 4: Media -->
    <text x="400" y="392" text-anchor="middle" font-size="10.5" fill="#8C876F" letter-spacing="0.5">SOURCE MEDIA — CHAPTER 2.5</text>
    <rect x="50" y="398" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="145" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">PROXY MEDIA</text>
    <rect x="560" y="398" width="190" height="34" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <text x="655" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#22252B">NATIVE MEDIA</text>
    <line x1="245" y1="415" x2="555" y2="415" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4,3"/>
    <circle cx="245" cy="415" r="4" fill="#AE3527"/>
    <circle cx="555" cy="415" r="4" fill="#33505E"/>
  </g>

  <line x1="150" y1="448" x2="650" y2="448" stroke="#8C876F" stroke-width="1"/>
  <text x="400" y="468" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#22252B" font-weight="600">No position on this line is correct by default — the moment decides which end to choose.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 16.1-A</text>
</svg>
