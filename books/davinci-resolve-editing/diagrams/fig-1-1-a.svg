<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBrass1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#6B5A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">TIMELINE AS POINTERS, NOT COPIES</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <!-- source files on disk -->
  <text x="70" y="96" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#8C876F" letter-spacing="1">SOURCE MEDIA — UNTOUCHED ON DISK</text>

  <g font-family="JetBrains Mono, monospace">
    <rect x="70" y="110" width="200" height="46" fill="none" stroke="#22252B" stroke-width="1.6"/>
    <text x="80" y="130" font-size="12" fill="#22252B">A004_C012.mov</text>
    <text x="80" y="146" font-size="10.5" fill="#5A5748">frames 0 – 1400</text>

    <rect x="300" y="110" width="200" height="46" fill="none" stroke="#22252B" stroke-width="1.6"/>
    <text x="310" y="130" font-size="12" fill="#22252B">A004_C013.mov</text>
    <text x="310" y="146" font-size="10.5" fill="#5A5748">frames 0 – 900</text>

    <rect x="530" y="110" width="200" height="46" fill="none" stroke="#22252B" stroke-width="1.6"/>
    <text x="540" y="130" font-size="12" fill="#22252B">A005_C002.mov</text>
    <text x="540" y="146" font-size="10.5" fill="#5A5748">frames 0 – 2100</text>
  </g>

  <!-- highlighted ranges referenced -->
  <rect x="140" y="110" width="70" height="46" fill="#AE3527" fill-opacity="0.16" stroke="#AE3527" stroke-width="1.4"/>
  <rect x="360" y="110" width="55" height="46" fill="#33505E" fill-opacity="0.16" stroke="#33505E" stroke-width="1.4"/>
  <rect x="600" y="110" width="60" height="46" fill="#6B5A22" fill-opacity="0.16" stroke="#6B5A22" stroke-width="1.4"/>

  <!-- pointer lines down to timeline -->
  <line x1="175" y1="156" x2="175" y2="230" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowBrass1)"/>
  <line x1="388" y1="156" x2="330" y2="230" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowBrass1)"/>
  <line x1="630" y1="156" x2="540" y2="230" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowBrass1)"/>

  <!-- timeline -->
  <text x="70" y="220" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#8C876F" letter-spacing="1">TIMELINE — INSTRUCTIONS ONLY</text>
  <rect x="70" y="234" width="660" height="60" fill="none" stroke="#22252B" stroke-width="1.6"/>
  <rect x="70" y="234" width="260" height="60" fill="#AE3527" fill-opacity="0.14" stroke="#AE3527" stroke-width="1.4"/>
  <rect x="330" y="234" width="200" height="60" fill="#33505E" fill-opacity="0.14" stroke="#33505E" stroke-width="1.4"/>
  <rect x="530" y="234" width="200" height="60" fill="#6B5A22" fill-opacity="0.14" stroke="#6B5A22" stroke-width="1.4"/>

  <text x="200" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#AE3527">C012 · 210–1050</text>
  <text x="430" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#33505E">C013 · 140–430</text>
  <text x="630" y="268" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B5A22">C002 · 900–1500</text>

  <text x="400" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">REORDER, TRIM, OR DELETE ON THE TIMELINE —</text>
  <text x="400" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">THE SOURCE FILES ABOVE NEVER CHANGE</text>

  <text x="400" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">Every clip on the timeline is a reference: source file + in point + out point.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.1-A</text>
</svg>
