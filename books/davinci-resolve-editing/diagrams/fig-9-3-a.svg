<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">A FIVE-NODE GRADE, SERIAL THEN PARALLEL</text>
  <line x1="120" y1="54" x2="680" y2="54" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#8C876F" letter-spacing="1">SOURCE → EXPOSURE → CONTRAST → SPLIT → COMBINE</text>

  <g font-family="JetBrains Mono, monospace" text-anchor="middle">
    <rect x="30" y="210" width="95" height="44" rx="4" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="77" y="228" font-size="10.5" fill="#22252B" font-weight="700">SOURCE</text>
    <text x="77" y="242" font-size="8.5" fill="#5A5748">ungraded</text>

    <rect x="160" y="210" width="115" height="44" rx="4" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="217" y="226" font-size="10.5" fill="#22252B" font-weight="700">NODE 1</text>
    <text x="217" y="240" font-size="8.5" fill="#6B5A22">exposure</text>

    <rect x="310" y="210" width="115" height="44" rx="4" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="367" y="226" font-size="10.5" fill="#22252B" font-weight="700">NODE 2</text>
    <text x="367" y="240" font-size="8.5" fill="#6B5A22">contrast</text>

    <rect x="555" y="105" width="155" height="46" rx="4" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="632" y="123" font-size="10.5" fill="#22252B" font-weight="700">NODE 3</text>
    <text x="632" y="137" font-size="8.5" fill="#6B5A22">skin qualifier</text>

    <rect x="600" y="210" width="120" height="44" rx="4" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="660" y="226" font-size="10.5" fill="#22252B" font-weight="700">NODE 4</text>
    <text x="660" y="240" font-size="8.5" fill="#6B5A22">combine</text>
  </g>

  <line x1="125" y1="232" x2="160" y2="232" stroke="#33505E" stroke-width="2"/>
  <line x1="275" y1="232" x2="310" y2="232" stroke="#33505E" stroke-width="2"/>
  <line x1="425" y1="232" x2="455" y2="232" stroke="#33505E" stroke-width="2"/>
  <circle cx="455" cy="232" r="3.5" fill="#22252B"/>

  <line x1="455" y1="232" x2="555" y2="128" stroke="#33505E" stroke-width="2"/>
  <text x="460" y="185" font-size="8.5" font-family="JetBrains Mono, monospace" fill="#6B5A22">parallel branch</text>

  <line x1="455" y1="232" x2="600" y2="232" stroke="#8C876F" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="465" y="248" font-size="8.5" font-family="JetBrains Mono, monospace" fill="#5A5748">unchanged pass-through</text>

  <line x1="632" y1="151" x2="655" y2="210" stroke="#33505E" stroke-width="2"/>

  <text x="725" y="228" font-size="10.5" font-family="JetBrains Mono, monospace" fill="#22252B">→ out</text>
  <line x1="720" y1="232" x2="732" y2="232" stroke="#33505E" stroke-width="2"/>

  <line x1="70" y1="300" x2="730" y2="300" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="330" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">SAME SOURCE, TWO INDEPENDENT ADJUSTMENTS</text>
  <text x="400" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Node 3 never sees Node 2's contrast change — Node 4 combines both explicitly.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 9.3-A</text>
</svg>
