<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBrass32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#6B5A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">SOURCE TAPE — MANY CLIPS, ONE SCRUB</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="400" y="88" text-anchor="middle" font-size="11.5" fill="#8C876F" letter-spacing="0.5">BIN — FIVE SEPARATE CLIPS, OPENED ONE AT A TIME NORMALLY</text>

    <rect x="60" y="98" width="126" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="123" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CLIP 1</text>
    <text x="123" y="140" text-anchor="middle" font-size="8.5" fill="#5A5748">09:00–09:14</text>

    <rect x="196" y="98" width="126" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="259" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CLIP 2</text>
    <text x="259" y="140" text-anchor="middle" font-size="8.5" fill="#5A5748">09:14–09:29</text>

    <rect x="332" y="98" width="126" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="395" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CLIP 3</text>
    <text x="395" y="140" text-anchor="middle" font-size="8.5" fill="#5A5748">09:29–09:41</text>

    <rect x="468" y="98" width="126" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="531" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CLIP 4</text>
    <text x="531" y="140" text-anchor="middle" font-size="8.5" fill="#5A5748">09:41–09:58</text>

    <rect x="604" y="98" width="126" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="667" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">CLIP 5</text>
    <text x="667" y="140" text-anchor="middle" font-size="8.5" fill="#5A5748">09:58–10:12</text>

    <line x1="400" y1="167" x2="400" y2="190" stroke="#6B5A22" stroke-width="2" marker-end="url(#arrowBrass32)"/>
    <text x="400" y="206" text-anchor="middle" font-size="11.5" fill="#6B5A22" font-weight="700">CONCATENATED IN BIN ORDER</text>

    <text x="400" y="222" text-anchor="middle" font-size="11.5" fill="#8C876F" letter-spacing="0.5">SOURCE TAPE — ONE CONTINUOUS VIRTUAL REEL</text>

    <rect x="60" y="230" width="670" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <line x1="196" y1="230" x2="196" y2="290" stroke="#22252B" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
    <line x1="332" y1="230" x2="332" y2="290" stroke="#22252B" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
    <line x1="468" y1="230" x2="468" y2="290" stroke="#22252B" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
    <line x1="604" y1="230" x2="604" y2="290" stroke="#22252B" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
    <text x="128" y="244" text-anchor="middle" font-size="8" fill="#8C876F">(clip 1)</text>
    <text x="264" y="244" text-anchor="middle" font-size="8" fill="#8C876F">(clip 2)</text>
    <text x="400" y="244" text-anchor="middle" font-size="8" fill="#8C876F">(clip 3)</text>
    <text x="536" y="244" text-anchor="middle" font-size="8" fill="#8C876F">(clip 4)</text>
    <text x="667" y="244" text-anchor="middle" font-size="8" fill="#8C876F">(clip 5)</text>
    <text x="395" y="260" text-anchor="middle" font-size="10.5" fill="#5A5748">no gaps, no boundaries to click through</text>

    <line x1="230" y1="230" x2="230" y2="298" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="222" y="283" text-anchor="end" font-size="9.5" font-weight="700" fill="#AE3527">IN</text>
    <line x1="500" y1="230" x2="500" y2="298" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="508" y="283" text-anchor="start" font-size="9.5" font-weight="700" fill="#AE3527">OUT</text>

    <path d="M230,300 V306 H500 V300" fill="none" stroke="#AE3527" stroke-width="1.3"/>
    <text x="365" y="320" text-anchor="middle" font-size="10" fill="#AE3527">MARKED ACROSS THREE CLIP BOUNDARIES, LIKE ONE LONG CLIP</text>
  </g>

  <text x="400" y="404" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">ONE SCRUB, NOT FIVE SEPARATE OPENS</text>
  <text x="400" y="424" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Source Tape trades opening and closing each clip for one continuous pass across the whole bin.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 3.2-A</text>
</svg>
