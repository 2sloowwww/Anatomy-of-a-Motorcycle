<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBrass4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#6B5A22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">ANATOMY OF THE EDIT PAGE TIMELINE</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <!-- ruler -->
    <rect x="90" y="80" width="620" height="20" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="100" y="94" font-size="9.5" fill="#5A5748">00:00:10:00</text>
    <text x="500" y="94" font-size="9.5" fill="#5A5748">00:01:24:12</text>

    <!-- playhead -->
    <line x1="330" y1="80" x2="330" y2="330" stroke="#AE3527" stroke-width="2"/>
    <path d="M322,74 L338,74 L330,84 Z" fill="#AE3527"/>
    <text x="330" y="66" text-anchor="middle" font-size="9.5" fill="#AE3527">PLAYHEAD</text>

    <!-- V2 -->
    <rect x="60" y="104" width="26" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.2"/>
    <text x="73" y="125" text-anchor="middle" font-size="10" fill="#22252B">V2</text>
    <rect x="90" y="104" width="180" height="34" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <rect x="290" y="104" width="150" height="34" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>

    <!-- V1 -->
    <rect x="60" y="142" width="26" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.2"/>
    <text x="73" y="163" text-anchor="middle" font-size="10" fill="#22252B">V1</text>
    <rect x="90" y="142" width="620" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <line x1="270" y1="142" x2="270" y2="176" stroke="#22252B" stroke-width="1.2"/>
    <line x1="440" y1="142" x2="440" y2="176" stroke="#22252B" stroke-width="1.2"/>
    <text x="490" y="163" font-size="9" fill="#5A5748">CLIP — trimmed both ends</text>

    <!-- gap -->
    <rect x="440" y="142" width="0" height="34" fill="none"/>
    <text x="180" y="163" text-anchor="middle" font-size="9" fill="#5A5748">CLIP A</text>
    <text x="355" y="163" text-anchor="middle" font-size="9" fill="#5A5748">CLIP B</text>

    <!-- edit point marker -->
    <line x1="270" y1="100" x2="270" y2="180" stroke="#6B5A22" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="270" y="192" text-anchor="middle" font-size="9" fill="#6B5A22">EDIT POINT</text>

    <!-- A1 -->
    <rect x="60" y="180" width="26" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.2"/>
    <text x="73" y="201" text-anchor="middle" font-size="10" fill="#22252B">A1</text>
    <rect x="90" y="180" width="270" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <path d="M100,197 L110,188 L120,204 L130,192 L140,200 L150,186 L160,205 L170,197 L180,190 L190,202 L200,197 L210,193 L220,201 L230,197 L240,189 L250,203 L260,197 L270,195 L280,199 L290,197 L300,191 L310,203 L320,197 L330,194 L340,200 L350,197" fill="none" stroke="#33505E" stroke-width="1"/>
  </g>

  <!-- callout: gap -->
  <rect x="440" y="142" width="150" height="34" fill="none" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="515" y="163" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#AE3527">GAP — no clip here</text>

  <text x="400" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">TRACKS STACK VERTICALLY — TIME RUNS LEFT TO RIGHT</text>
  <text x="400" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Every block is a reference into source media, not a copy of it — see Ch. 1.1.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 4.1-A</text>
</svg>
