<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">QUALIFIERS VS. POWER WINDOWS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">QUALIFIER — SELECTS BY COLOR</text>
    <rect x="70" y="104" width="300" height="150" fill="#22252B" fill-opacity="0.12" stroke="#22252B" stroke-width="1.4"/>
    <ellipse cx="220" cy="179" rx="70" ry="52" fill="#EEE8DA" stroke="#33505E" stroke-width="1.6"/>
    <text x="220" y="175" text-anchor="middle" font-size="9.5" fill="#22252B" font-weight="700">SELECTED</text>
    <text x="220" y="189" text-anchor="middle" font-size="8" fill="#5A5748">(matte: white)</text>
    <text x="90" y="240" font-size="8.5" fill="#8C876F">rest of frame = matte: black</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="430" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">POWER WINDOW — SELECTS BY SHAPE</text>
    <rect x="430" y="104" width="300" height="150" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <rect x="555" y="149" width="50" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="580" y="182" text-anchor="middle" font-size="8" fill="#5A5748">subject</text>
    <ellipse cx="580" cy="179" rx="62" ry="46" fill="none" stroke="#6B5A22" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="640" y="140" font-size="8.5" fill="#6B5A22">window</text>
    <circle cx="460" cy="220" r="4" fill="#33505E" opacity="0.35"/>
    <circle cx="480" cy="212" r="4" fill="#33505E" opacity="0.6"/>
    <circle cx="500" cy="205" r="4" fill="#33505E"/>
    <text x="450" y="236" font-size="8" fill="#33505E">tracked across frames</text>
  </g>

  <line x1="70" y1="280" x2="730" y2="280" stroke="#8C876F" stroke-width="1"/>

  <text x="220" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B" font-weight="600">Selects by what a pixel is</text>
  <text x="580" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B" font-weight="600">Selects by where a pixel is</text>

  <line x1="70" y1="340" x2="730" y2="340" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="375" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">TWO WAYS TO ISOLATE PART OF THE FRAME</text>
  <text x="400" y="397" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Most real secondary work combines both — a shape that also checks color.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 9.5-A</text>
</svg>
