<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">A WHOLE TIMELINE, COLLAPSED INTO A SINGLE CLIP</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="88" font-size="12.5" fill="#8C876F" letter-spacing="1">CHILD TIMELINE — FULL, INDEPENDENT SEQUENCE</text>

    <rect x="88" y="98" width="624" height="60" fill="none" stroke="#6B5A22" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="100" y="108" width="120" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="160" y="132" text-anchor="middle" font-size="9.5" fill="#22252B">clip A</text>
    <rect x="226" y="108" width="90" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="271" y="132" text-anchor="middle" font-size="9.5" fill="#22252B">clip B</text>
    <rect x="322" y="108" width="150" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="397" y="132" text-anchor="middle" font-size="9.5" fill="#22252B">clip C</text>
    <rect x="478" y="108" width="100" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="528" y="132" text-anchor="middle" font-size="9.5" fill="#22252B">clip D</text>
    <rect x="584" y="108" width="120" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="644" y="132" text-anchor="middle" font-size="9.5" fill="#22252B">clip E</text>

    <text x="712" y="90" text-anchor="end" font-size="9.5" fill="#6B5A22">"Timeline B"</text>
  </g>

  <path d="M400,164 V196" stroke="#6B5A22" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M392,190 l8,10 l8,-10 Z" fill="#6B5A22"/>
  <text x="400" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B5A22" font-weight="600">NESTED AS A SINGLE CLIP — DRAGGED IN LIKE ANY OTHER</text>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="252" font-size="12.5" fill="#8C876F" letter-spacing="1">PARENT TIMELINE</text>

    <rect x="88" y="262" width="624" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <rect x="100" y="272" width="90" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.2"/>
    <text x="145" y="296" text-anchor="middle" font-size="9" fill="#22252B">clip X</text>

    <rect x="200" y="272" width="300" height="40" fill="#EEE8DA" stroke="#AE3527" stroke-width="1.8" stroke-dasharray="5 3"/>
    <line x1="235" y1="272" x2="235" y2="312" stroke="#AE3527" stroke-width="0.9" opacity="0.5"/>
    <line x1="290" y1="272" x2="290" y2="312" stroke="#AE3527" stroke-width="0.9" opacity="0.5"/>
    <line x1="370" y1="272" x2="370" y2="312" stroke="#AE3527" stroke-width="0.9" opacity="0.5"/>
    <line x1="440" y1="272" x2="440" y2="312" stroke="#AE3527" stroke-width="0.9" opacity="0.5"/>
    <text x="350" y="296" text-anchor="middle" font-size="10" fill="#AE3527" font-weight="700">TIMELINE B — NESTED</text>

    <rect x="510" y="272" width="180" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.2"/>
    <text x="600" y="296" text-anchor="middle" font-size="9" fill="#22252B">clip Y</text>
  </g>

  <text x="400" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5A5748">one block to select, move, and trim on the parent —</text>
  <text x="400" y="378" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5A5748">the dashed inner lines are its own clips, still there, just hidden from view</text>

  <text x="400" y="425" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">STILL A COMPLETE, EDITABLE TIMELINE OF ITS OWN — NOT A NEW OBJECT</text>
  <text x="400" y="447" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">unlike a compound clip, it exists independently and can be reused elsewhere unchanged</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 4.7-A</text>
</svg>
