<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">WAVEFORM VS. VECTORSCOPE</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">WAVEFORM — READS LUMINANCE</text>
    <rect x="70" y="104" width="300" height="150" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <line x1="90" y1="124" x2="350" y2="124" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="78" y="120" font-size="9" fill="#5A5748">100</text>
    <line x1="90" y1="234" x2="350" y2="234" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="82" y="248" font-size="9" fill="#5A5748">0</text>
    <polyline points="90,190 130,150 170,124 210,160 250,200 290,234 330,190" fill="none" stroke="#33505E" stroke-width="2.2"/>
    <circle cx="170" cy="124" r="4" fill="#AE3527"/>
    <text x="128" y="112" font-size="8.5" fill="#AE3527">CLIPPED HIGHLIGHT</text>
    <circle cx="290" cy="234" r="4" fill="#AE3527"/>
    <text x="238" y="248" font-size="8.5" fill="#AE3527">CRUSHED SHADOW</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="430" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">VECTORSCOPE — READS COLOR</text>
    <rect x="430" y="104" width="300" height="150" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <circle cx="580" cy="179" r="72" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <line x1="508" y1="179" x2="652" y2="179" stroke="#8C876F" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="580" y1="112" x2="580" y2="246" stroke="#8C876F" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="580" y1="179" x2="628" y2="134" stroke="#6B5A22" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="595" y="126" font-size="8.5" fill="#6B5A22">SKIN TONE LINE</text>
    <circle cx="614" cy="141" r="5" fill="#33505E"/>
    <text x="600" y="160" font-size="8.5" fill="#22252B">TRACE</text>
  </g>

  <line x1="70" y1="280" x2="730" y2="280" stroke="#8C876F" stroke-width="1"/>

  <text x="220" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B" font-weight="600">Clip and crush appear as flat guide lines</text>
  <text x="580" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#22252B" font-weight="600">Distance is saturation; angle is hue</text>

  <line x1="70" y1="340" x2="730" y2="340" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="375" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">TWO INSTRUMENTS, TWO DIFFERENT ERRORS</text>
  <text x="400" y="397" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Waveform reads brightness. Vectorscope reads color and saturation.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 9.2-A</text>
</svg>
