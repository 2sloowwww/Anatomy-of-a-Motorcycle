<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">TRACK, BUS, AND MASTER SIGNAL FLOW</text>
  <line x1="130" y1="54" x2="670" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="60" y="82" font-size="11" fill="#8C876F" letter-spacing="1">TRACKS</text>
    <rect x="60" y="92" width="170" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="70" y="112" font-size="11.5" fill="#22252B">DIALOGUE TRACKS</text>
    <text x="70" y="128" font-size="9.5" fill="#5A5748">A1 – A4</text>

    <rect x="60" y="182" width="170" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="70" y="202" font-size="11.5" fill="#22252B">MUSIC TRACKS</text>
    <text x="70" y="218" font-size="9.5" fill="#5A5748">A5 – A6</text>

    <rect x="60" y="272" width="170" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="70" y="292" font-size="11.5" fill="#22252B">FX / AMBIENCE</text>
    <text x="70" y="308" font-size="9.5" fill="#5A5748">A7 – A9</text>

    <text x="310" y="82" font-size="11" fill="#8C876F" letter-spacing="1">SUB BUSSES</text>
    <rect x="310" y="92" width="170" height="46" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <text x="320" y="118" font-size="11.5" fill="#33505E">DX SUB BUS</text>

    <rect x="310" y="182" width="170" height="46" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <text x="320" y="208" font-size="11.5" fill="#33505E">MX SUB BUS</text>

    <rect x="310" y="272" width="170" height="46" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <text x="320" y="298" font-size="11.5" fill="#33505E">FX SUB BUS</text>

    <text x="580" y="82" font-size="11" fill="#8C876F" letter-spacing="1">MASTER</text>
    <rect x="580" y="150" width="170" height="120" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.8"/>
    <text x="595" y="205" font-size="12.5" fill="#AE3527" font-weight="700">MASTER BUS</text>
    <text x="595" y="222" font-size="9.5" fill="#5A5748">Sum of all sub busses</text>

    <rect x="480" y="330" width="270" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="495" y="352" font-size="11" fill="#22252B">MAIN OUT — MONITOR &amp; PRINT MASTER</text>
  </g>

  <line x1="230" y1="115" x2="305" y2="115" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M298,110 L308,115 L298,120 Z" fill="#6B5A22"/>
  <line x1="230" y1="205" x2="305" y2="205" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M298,200 L308,205 L298,210 Z" fill="#6B5A22"/>
  <line x1="230" y1="295" x2="305" y2="295" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M298,290 L308,295 L298,300 Z" fill="#6B5A22"/>

  <line x1="480" y1="115" x2="580" y2="175" stroke="#33505E" stroke-width="1.6"/>
  <path d="M572,169 L582,175 L572,181 Z" fill="#33505E"/>
  <line x1="480" y1="205" x2="580" y2="210" stroke="#33505E" stroke-width="1.6"/>
  <path d="M572,205 L582,210 L572,215 Z" fill="#33505E"/>
  <line x1="480" y1="295" x2="580" y2="245" stroke="#33505E" stroke-width="1.6"/>
  <path d="M572,239 L582,245 L572,251 Z" fill="#33505E"/>

  <line x1="665" y1="270" x2="665" y2="325" stroke="#AE3527" stroke-width="1.6"/>
  <path d="M660,318 L665,328 L670,318 Z" fill="#AE3527"/>

  <line x1="60" y1="405" x2="750" y2="405" stroke="#8C876F" stroke-width="1"/>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">EACH TRACK ROUTES TO A BUS BEFORE THE MASTER — NEVER DIRECTLY TO OUTPUT</text>
  <text x="400" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">A bus fader adjusts every track feeding it at once — dialogue, music, or FX as a group.</text>

  <text x="770" y="478" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 8.3-A</text>
</svg>
