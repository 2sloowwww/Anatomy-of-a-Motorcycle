<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">RELINKING: MATCHING OFFLINE TO ONLINE</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="88" font-size="12.5" fill="#8C876F" letter-spacing="1">TIMELINE — OFFLINE / PROXY MEDIA</text>

    <rect x="70" y="102" width="200" height="50" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="80" y="122" font-size="10.5" fill="#22252B">A004_C012</text>
    <text x="80" y="138" font-size="9" fill="#5A5748">TC 01:04:12:08</text>

    <rect x="70" y="160" width="200" height="50" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="80" y="180" font-size="10.5" fill="#22252B">A004_C013</text>
    <text x="80" y="196" font-size="9" fill="#5A5748">TC 01:06:40:02</text>

    <rect x="70" y="218" width="200" height="50" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="80" y="238" font-size="10.5" fill="#22252B">A004_C014</text>
    <text x="80" y="254" font-size="9" fill="#5A5748">TC 01:09:55:19</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="530" y="88" font-size="12.5" fill="#8C876F" letter-spacing="1">STORAGE — ONLINE / CAMERA ORIGINALS</text>

    <rect x="530" y="102" width="200" height="50" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <text x="540" y="122" font-size="10.5" fill="#33505E">A004_C012</text>
    <text x="540" y="138" font-size="9" fill="#5A5748">TC 01:04:12:08</text>

    <rect x="530" y="160" width="200" height="50" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <text x="540" y="180" font-size="10.5" fill="#33505E">A004_C013</text>
    <text x="540" y="196" font-size="9" fill="#5A5748">TC 01:06:40:02</text>

    <rect x="530" y="218" width="200" height="50" fill="none" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="540" y="238" font-size="10.5" fill="#AE3527">A004_C014</text>
