  <line x1="70" y1="292" x2="730" y2="292" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="322" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">MATCHED ON REEL NAME, TIMECODE, AND DURATION</text>
  <text x="400" y="344" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">A renamed or moved file breaks the match — the clip, not the metadata, is what relinking actually restores.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 15.3-A</text>
