<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#33505E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">STACKED LAYERS VS. CONNECTED NODES</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <line x1="400" y1="80" x2="400" y2="440" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="200" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">LAYER STACK</text>
  <text x="600" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8C876F" letter-spacing="1">NODE GRAPH</text>

  <!-- ===== LEFT: layer stack ===== -->
  <g font-family="JetBrains Mono, monospace">
    <rect x="120" y="112" width="160" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="200" y="137" text-anchor="middle" font-size="12.5" fill="#22252B">3 · CONTRAST</text>

    <rect x="120" y="160" width="160" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="200" y="185" text-anchor="middle" font-size="12.5" fill="#22252B">2 · SKIN QUALIFIER</text>

    <rect x="120" y="208" width="160" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="200" y="233" text-anchor="middle" font-size="12.5" fill="#22252B">1 · EXPOSURE</text>

    <line x1="200" y1="248" x2="200" y2="270" stroke="#8C876F" stroke-width="1.4"/>
    <rect x="120" y="270" width="160" height="40" fill="none" stroke="#8C876F" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="200" y="295" text-anchor="middle" font-size="12.5" fill="#8C876F">BASE IMAGE</text>
  </g>

  <text x="200" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">ONE PATH, TOP TO BOTTOM</text>
  <text x="200" y="366" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">each step sees only what's</text>
  <text x="200" y="384" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">already below it</text>

  <!-- ===== RIGHT: node graph ===== -->
  <g font-family="JetBrains Mono, monospace">
    <circle cx="480" cy="230" r="26" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="480" y="234" text-anchor="middle" font-size="11" fill="#22252B">SRC</text>

    <line x1="506" y1="230" x2="548" y2="230" stroke="#33505E" stroke-width="1.8" marker-end="url(#arrowBlue2)"/>

    <circle cx="574" cy="230" r="26" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="574" y="234" text-anchor="middle" font-size="10.3" fill="#22252B">EXPOSURE</text>

    <line x1="600" y1="230" x2="642" y2="180" stroke="#33505E" stroke-width="1.8" marker-end="url(#arrowBlue2)"/>
    <line x1="600" y1="230" x2="642" y2="280" stroke="#AE3527" stroke-width="1.8" marker-end="url(#arrowRed2)"/>

    <circle cx="668" cy="170" r="26" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <text x="668" y="167" text-anchor="middle" font-size="10.3" fill="#22252B">CONTRAST</text>
    <text x="668" y="180" text-anchor="middle" font-size="9" fill="#5A5748">(main)</text>

    <circle cx="668" cy="290" r="26" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.6"/>
    <text x="668" y="287" text-anchor="middle" font-size="9.6" fill="#AE3527">SKIN QUAL.</text>
    <text x="668" y="299" text-anchor="middle" font-size="9" fill="#5A5748">(parallel)</text>

    <line x1="668" y1="196" x2="668" y2="264" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <text x="600" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#22252B" font-weight="600">A GRAPH, NOT A LINE</text>
  <text x="600" y="366" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">work can branch, run in parallel,</text>
  <text x="600" y="384" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">and feed back in on itself</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 1.3-A</text>
</svg>
