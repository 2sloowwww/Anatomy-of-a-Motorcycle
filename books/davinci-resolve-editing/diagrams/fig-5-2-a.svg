<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">J K L — ONE CONTINUOUS PLAYBACK DIAL</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <!-- J key -->
    <rect x="90" y="90" width="170" height="140" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="1.8"/>
    <text x="175" y="112" text-anchor="middle" font-size="11" fill="#22252B" font-weight="600">REVERSE</text>
    <text x="175" y="200" text-anchor="middle" font-size="60" font-weight="700" fill="#6B5A22">J</text>

    <!-- K key -->
    <rect x="315" y="90" width="170" height="140" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="1.8"/>
    <text x="400" y="112" text-anchor="middle" font-size="11" fill="#22252B" font-weight="600">PAUSE / STEP</text>
    <text x="400" y="200" text-anchor="middle" font-size="60" font-weight="700" fill="#6B5A22">K</text>

    <!-- L key -->
    <rect x="540" y="90" width="170" height="140" rx="10" fill="#E2D9C3" stroke="#22252B" stroke-width="1.8"/>
    <text x="625" y="112" text-anchor="middle" font-size="11" fill="#22252B" font-weight="600">FORWARD</text>
    <text x="625" y="200" text-anchor="middle" font-size="60" font-weight="700" fill="#6B5A22">L</text>

    <!-- J shuttle chevrons, below the key, pointing left, growing -->
    <path d="M195,247 l-9,9 l9,9" fill="none" stroke="#AE3527" stroke-width="2"/>
    <path d="M173,242 l-13,14 l13,14" fill="none" stroke="#AE3527" stroke-width="2.6"/>
    <text x="175" y="292" text-anchor="middle" font-size="9.5" fill="#5A5748">repeated taps —</text>
    <text x="175" y="307" text-anchor="middle" font-size="9.5" fill="#AE3527" font-weight="600">faster reverse shuttle</text>

    <!-- L shuttle chevrons, below the key, pointing right, growing -->
    <path d="M655,247 l9,9 l-9,9" fill="none" stroke="#AE3527" stroke-width="2"/>
    <path d="M677,242 l13,14 l-13,14" fill="none" stroke="#AE3527" stroke-width="2.6"/>
    <text x="625" y="292" text-anchor="middle" font-size="9.5" fill="#5A5748">repeated taps —</text>
    <text x="625" y="307" text-anchor="middle" font-size="9.5" fill="#AE3527" font-weight="600">faster forward shuttle</text>

    <!-- K pause bars, below the key -->
    <rect x="394" y="245" width="6" height="22" fill="#22252B"/>
    <rect x="406" y="245" width="6" height="22" fill="#22252B"/>
    <text x="400" y="292" text-anchor="middle" font-size="9.5" fill="#5A5748">hold K, tap J or L —</text>
    <text x="400" y="307" text-anchor="middle" font-size="9.5" fill="#33505E" font-weight="600">step exactly one frame</text>

    <!-- single-frame step filmstrip -->
    <rect x="331" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <rect x="349" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <rect x="367" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <rect x="385" y="330" width="16" height="16" fill="#33505E" stroke="#22252B" stroke-width="1.4"/>
    <rect x="403" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <rect x="421" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <rect x="439" y="330" width="16" height="16" fill="#E2D9C3" stroke="#22252B" stroke-width="1"/>
    <text x="393" y="362" text-anchor="middle" font-size="8.5" fill="#33505E">current frame, isolated</text>
  </g>

  <text x="400" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">NOT THREE COMMANDS — ONE CONTINUOUS, SPEED-VARIABLE CONTROL SURFACE</text>
  <text x="400" y="427" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">shuttle fast to cover ground, ease to normal speed, then hold K to land on the exact frame</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.2-A</text>
</svg>
