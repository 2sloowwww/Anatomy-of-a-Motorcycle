<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">THREE POINTS DEFINE AN EDIT — RESOLVE FINDS THE FOURTH</text>
  <line x1="120" y1="54" x2="680" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">SOURCE CLIP</text>
    <rect x="70" y="100" width="280" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <line x1="150" y1="100" x2="150" y2="146" stroke="#AE3527" stroke-width="2.2"/>
    <text x="150" y="94" text-anchor="middle" font-size="9.5" fill="#AE3527">IN (1)</text>
    <line x1="260" y1="100" x2="260" y2="146" stroke="#AE3527" stroke-width="2.2"/>
    <text x="260" y="94" text-anchor="middle" font-size="9.5" fill="#AE3527">OUT (2)</text>
    <rect x="150" y="100" width="110" height="46" fill="#AE3527" fill-opacity="0.14"/>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="450" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">TIMELINE</text>
    <rect x="450" y="100" width="280" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <line x1="520" y1="100" x2="520" y2="146" stroke="#33505E" stroke-width="2.2"/>
    <text x="520" y="94" text-anchor="middle" font-size="9.5" fill="#33505E">IN (3)</text>
    <text x="640" y="94" text-anchor="middle" font-size="9.5" fill="#8C876F">OUT (4) — calculated</text>
    <rect x="520" y="100" width="110" height="46" fill="#33505E" fill-opacity="0.12" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <text x="400" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">SOURCE IN + SOURCE OUT + TIMELINE IN → TIMELINE OUT FOLLOWS AUTOMATICALLY</text>
  <text x="400" y="207" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">(any three of the four points work — Resolve solves for whichever one you left unset)</text>

  <line x1="150" y1="250" x2="150" y2="300" stroke="#8C876F" stroke-width="1.2"/>
  <line x1="650" y1="250" x2="650" y2="300" stroke="#8C876F" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="400" y="325" text-anchor="middle" font-size="13" fill="#6B5A22" font-weight="700">WHEN DURATIONS DON'T MATCH — FOUR-POINT EDITING</text>

    <rect x="150" y="345" width="150" height="40" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.6"/>
    <text x="225" y="369" text-anchor="middle" font-size="10.5" fill="#AE3527">source: 4.0s marked</text>

    <rect x="500" y="345" width="90" height="40" fill="#E2D9C3" stroke="#33505E" stroke-width="1.6"/>
    <text x="545" y="369" text-anchor="middle" font-size="10.5" fill="#33505E">timeline: 2.5s marked</text>

    <text x="400" y="425" text-anchor="middle" font-size="11.5" fill="#5A5748">all four points are set at once, and duration conflicts —</text>
    <text x="400" y="443" text-anchor="middle" font-size="11.5" fill="#5A5748">Resolve trims the source or changes speed to reconcile them, your choice</text>
  </g>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.5-A</text>
</svg>
