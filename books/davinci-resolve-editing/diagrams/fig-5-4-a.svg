  <text x="150" y="210" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#6B5A22" font-weight="600">JUMPS STRAIGHT TO SOURCE</text>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="255" font-size="12.5" fill="#8C876F" letter-spacing="1">SOURCE CLIP — FULL ORIGINAL RANGE</text>

