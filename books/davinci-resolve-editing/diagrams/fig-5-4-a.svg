  <text x="400" y="410" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">THE JUMP LANDS ON THE EXACT FRAME — NOT JUST THE SAME CLIP</text>
