<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBrass2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#6B5A22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">BINS: ONE CLIP, MANY VIEWS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <!-- master bin tree -->
    <text x="70" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">MASTER BINS — WHERE THE CLIP LIVES</text>
    <rect x="70" y="104" width="190" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="80" y="126" font-size="12.5" fill="#22252B">01_Footage</text>
    <line x1="90" y1="138" x2="90" y2="152" stroke="#8C876F" stroke-width="1.2"/>
    <rect x="90" y="152" width="170" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="100" y="174" font-size="12" fill="#22252B">Day_03 / Cam_A</text>
    <circle cx="240" cy="169" r="9" fill="#AE3527"/>
    <text x="240" y="173" text-anchor="middle" font-size="9" fill="#EEE8DA" font-weight="700">C</text>
  </g>

  <!-- lines fanning from the clip to smart bins -->
  <line x1="260" y1="169" x2="450" y2="120" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowBrass2)"/>
  <line x1="260" y1="169" x2="450" y2="230" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowBrass2)"/>
  <line x1="260" y1="169" x2="450" y2="340" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowBrass2)"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="450" y="96" font-size="12.5" fill="#8C876F" letter-spacing="1">SMART BINS — SAVED SEARCHES</text>

    <rect x="450" y="105" width="220" height="40" fill="none" stroke="#33505E" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="460" y="123" font-size="12" fill="#33505E">"Flagged — Selects"</text>
    <text x="460" y="138" font-size="9.5" fill="#5A5748">keyword = select</text>

    <rect x="450" y="215" width="220" height="40" fill="none" stroke="#33505E" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="460" y="233" font-size="12" fill="#33505E">"Camera A — All Days"</text>
    <text x="460" y="248" font-size="9.5" fill="#5A5748">camera = A</text>

    <rect x="450" y="325" width="220" height="40" fill="none" stroke="#33505E" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="460" y="343" font-size="12" fill="#33505E">"Needs Sound Sync"</text>
    <text x="460" y="358" font-size="9.5" fill="#5A5748">flag = unsynced</text>
  </g>

  <text x="400" y="410" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">ONE CLIP, ONE MASTER LOCATION — SEEN THROUGH SEVERAL SEARCHES</text>
  <text x="400" y="432" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Smart bins don't move or duplicate the clip. They just filter for it.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 2.2-A</text>
</svg>
