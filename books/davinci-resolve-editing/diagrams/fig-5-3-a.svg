<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="560" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="540" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,534 V550 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,550 H10 V534" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">FOUR TRIMS, FOUR DIFFERENT EFFECTS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <line x1="400" y1="70" x2="400" y2="520" stroke="#33505E" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="60" y1="295" x2="740" y2="295" stroke="#33505E" stroke-width="1.2" stroke-dasharray="5 4"/>

  <g font-family="JetBrains Mono, monospace">
    <!-- RIPPLE -->
    <text x="200" y="90" text-anchor="middle" font-size="13" fill="#AE3527" font-weight="700">RIPPLE</text>
    <rect x="90" y="105" width="90" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="180" y="105" width="130" height="30" fill="#AE3527" fill-opacity="0.18" stroke="#AE3527" stroke-width="1.5"/>
    <rect x="80" y="145" width="90" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="170" y="145" width="60" height="30" fill="#AE3527" fill-opacity="0.18" stroke="#AE3527" stroke-width="1.5"/>
    <rect x="230" y="145" width="90" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="200" y="200" text-anchor="middle" font-size="9.5" fill="#5A5748">out point moves — everything after it shifts</text>
    <text x="200" y="216" text-anchor="middle" font-size="9.5" fill="#AE3527" font-weight="600">total duration changes</text>

    <!-- ROLL -->
    <text x="600" y="90" text-anchor="middle" font-size="13" fill="#33505E" font-weight="700">ROLL</text>
    <rect x="490" y="105" width="120" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="610" y="105" width="120" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="480" y="145" width="100" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="580" y="145" width="140" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <line x1="580" y1="140" x2="580" y2="180" stroke="#33505E" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="600" y="200" text-anchor="middle" font-size="9.5" fill="#5A5748">the shared edit point slides — both sides adjust</text>
    <text x="600" y="216" text-anchor="middle" font-size="9.5" fill="#33505E" font-weight="600">total duration unchanged</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <!-- SLIP -->
    <text x="200" y="315" text-anchor="middle" font-size="13" fill="#6B5A22" font-weight="700">SLIP</text>
    <rect x="140" y="330" width="120" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="200" y="350" text-anchor="middle" font-size="9" fill="#5A5748">frames 40–80 shown</text>
    <rect x="140" y="375" width="120" height="30" fill="none" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="150" y="381" width="100" height="18" fill="#6B5A22" fill-opacity="0.2"/>
    <text x="200" y="395" text-anchor="middle" font-size="9" fill="#6B5A22">frames 55–95 shown</text>
    <text x="200" y="425" text-anchor="middle" font-size="9.5" fill="#5A5748">same position, same duration —</text>
    <text x="200" y="441" text-anchor="middle" font-size="9.5" fill="#6B5A22" font-weight="600">only which source frames play changes</text>

    <!-- SLIDE -->
    <text x="600" y="315" text-anchor="middle" font-size="13" fill="#22252B" font-weight="700">SLIDE</text>
    <rect x="480" y="330" width="90" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="570" y="330" width="90" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="660" y="330" width="70" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>

    <rect x="480" y="375" width="60" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <rect x="540" y="375" width="90" height="30" fill="none" stroke="#22252B" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="630" y="375" width="100" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="600" y="425" text-anchor="middle" font-size="9.5" fill="#5A5748">the clip itself moves earlier or later —</text>
    <text x="600" y="441" text-anchor="middle" font-size="9.5" fill="#22252B" font-weight="600">its own in/out stay fixed, neighbors resize instead</text>
  </g>

  <text x="400" y="490" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">EACH ANSWERS A DIFFERENT QUESTION: WHAT SHOULD MOVE WHEN THIS CHANGES?</text>

  <text x="770" y="542" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.3-A</text>
</svg>
