<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">THE EDIT PAGE TOOLBAR</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#8C876F" letter-spacing="1">ONE MODE ACTIVE AT A TIME</text>

  <g font-family="JetBrains Mono, monospace">
    <rect x="100" y="85" width="600" height="55" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
    <line x1="200" y1="85" x2="200" y2="140" stroke="#22252B" stroke-width="1"/>
    <line x1="300" y1="85" x2="300" y2="140" stroke="#22252B" stroke-width="1"/>
    <line x1="400" y1="85" x2="400" y2="140" stroke="#22252B" stroke-width="1"/>
    <line x1="500" y1="85" x2="500" y2="140" stroke="#22252B" stroke-width="1"/>
    <line x1="600" y1="85" x2="600" y2="140" stroke="#22252B" stroke-width="1"/>

    <text x="108" y="98" font-size="9" fill="#8C876F">1</text>
    <text x="208" y="98" font-size="9" fill="#8C876F">2</text>
    <text x="308" y="98" font-size="9" fill="#8C876F">3</text>
    <text x="408" y="98" font-size="9" fill="#8C876F">4</text>
    <text x="508" y="98" font-size="9" fill="#8C876F">5</text>
    <text x="608" y="98" font-size="9" fill="#8C876F">6</text>

    <!-- 1 selection: pointer arrow -->
    <g transform="translate(150,112)">
      <path d="M-8,-12 L-8,10 L-2,5 L2,13 L6,11 L2,3 L9,3 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3" stroke-linejoin="round"/>
    </g>

    <!-- 2 trim: facing brackets with edit-point tick -->
    <g transform="translate(250,112)" fill="none" stroke="#22252B" stroke-width="1.6" stroke-linecap="round">
      <path d="M-10,-10 V10 M-10,-10 H-4 M-10,10 H-4"/>
      <path d="M10,-10 V10 M10,-10 H4 M10,10 H4"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#AE3527" stroke-width="1.6"/>
    </g>

    <!-- 3 blade: strip with diagonal cut -->
    <g transform="translate(350,112)">
      <rect x="-12" y="-7" width="24" height="14" fill="none" stroke="#22252B" stroke-width="1.2"/>
      <line x1="-12" y1="9" x2="12" y2="-9" stroke="#AE3527" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 4 dynamic trim: looping arrow -->
    <g transform="translate(450,112)" fill="none" stroke="#22252B" stroke-width="1.5" stroke-linecap="round">
      <path d="M6,-8 A9,9 0 1 1 -8,-4"/>
      <path d="M-8,-4 L-13,-6 M-8,-4 L-9,1"/>
    </g>

    <!-- 5 zoom: magnifier -->
    <g transform="translate(550,112)" fill="none" stroke="#22252B" stroke-width="1.5">
      <circle cx="-2" cy="-3" r="7"/>
      <line x1="3" y1="2" x2="10" y2="9" stroke-linecap="round" stroke-width="1.8"/>
      <line x1="-2" y1="-6" x2="-2" y2="0" stroke-width="1.1"/>
      <line x1="-5" y1="-3" x2="1" y2="-3" stroke-width="1.1"/>
    </g>

    <!-- 6 hand: pan -->
    <g transform="translate(650,112)" fill="none" stroke="#22252B" stroke-width="1.3" stroke-linecap="round">
      <path d="M-9,2 H9 V9 A4,4 0 0 1 5,13 H-5 A4,4 0 0 1 -9,9 Z"/>
      <line x1="-6" y1="-9" x2="-6" y2="2"/>
      <line x1="-2" y1="-11" x2="-2" y2="2"/>
      <line x1="2" y1="-11" x2="2" y2="2"/>
      <line x1="6" y1="-9" x2="6" y2="2"/>
    </g>

    <!-- legend -->
    <text x="100" y="180" font-size="13" font-weight="700" fill="#22252B">1 — SELECTION</text>
    <text x="118" y="196" font-size="10.5" fill="#5A5748">general-purpose: select, move, or roughly trim a clip</text>

    <text x="100" y="220" font-size="13" font-weight="700" fill="#22252B">2 — TRIM</text>
    <text x="118" y="236" font-size="10.5" fill="#5A5748">precise, deliberate adjustments to an edit point's boundary</text>

    <text x="100" y="260" font-size="13" font-weight="700" fill="#22252B">3 — BLADE</text>
    <text x="118" y="276" font-size="10.5" fill="#5A5748">splits one clip into two, exactly where you click</text>

    <text x="100" y="300" font-size="13" font-weight="700" fill="#22252B">4 — DYNAMIC TRIM</text>
    <text x="118" y="316" font-size="10.5" fill="#5A5748">live, playback-driven trimming instead of a static drag</text>

    <text x="100" y="340" font-size="13" font-weight="700" fill="#22252B">5 — ZOOM</text>
    <text x="118" y="356" font-size="10.5" fill="#5A5748">direct control over the timeline's zoom level</text>

    <text x="100" y="380" font-size="13" font-weight="700" fill="#22252B">6 — HAND</text>
    <text x="118" y="396" font-size="10.5" fill="#5A5748">pans across a long timeline without changing selection or zoom</text>
  </g>

  <text x="400" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">ONE CLICK, ONE MEANING — SET BY WHICHEVER TOOL IS ACTIVE</text>
  <text x="400" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Switching tools tells the timeline what a click and a drag should do right now.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 4.3-A</text>
</svg>
