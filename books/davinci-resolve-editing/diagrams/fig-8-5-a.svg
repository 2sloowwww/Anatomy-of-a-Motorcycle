<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">CLEANING DIALOGUE: THE SIGNAL CHAIN</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="120" y="130" text-anchor="middle" font-size="10" fill="#8C876F" letter-spacing="1">STAGE 1</text>
    <rect x="40" y="140" width="160" height="110" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="50" y="160" font-size="11" fill="#22252B" font-weight="600">RAW DIALOGUE</text>
    <polyline points="55,208 65,190 75,218 85,196 95,222 105,200 115,214 125,192 135,220 145,202 155,216 165,194 175,210 185,205" fill="none" stroke="#33505E" stroke-width="1.3"/>
    <line x1="60" y1="185" x2="60" y2="225" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="78" y1="188" x2="78" y2="222" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="96" y1="182" x2="96" y2="228" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="114" y1="187" x2="114" y2="223" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="132" y1="183" x2="132" y2="227" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="150" y1="188" x2="150" y2="222" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <line x1="168" y1="184" x2="168" y2="226" stroke="#AE3527" stroke-width="0.8" opacity="0.7"/>
    <text x="50" y="240" font-size="9" fill="#AE3527">+ hiss / hum artifacts</text>

    <text x="310" y="130" text-anchor="middle" font-size="10" fill="#8C876F" letter-spacing="1">STAGE 2</text>
    <rect x="230" y="140" width="160" height="110" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="240" y="162" font-size="11" fill="#22252B" font-weight="600">NOISE REDUCTION</text>
    <line x1="250" y1="210" x2="370" y2="210" stroke="#AE3527" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="250" y="204" font-size="8" fill="#AE3527">noise floor — before</text>
    <line x1="250" y1="230" x2="370" y2="230" stroke="#33505E" stroke-width="1.4"/>
    <text x="250" y="244" font-size="8" fill="#33505E">noise floor — after</text>
    <line x1="310" y1="212" x2="310" y2="226" stroke="#22252B" stroke-width="1.2"/>
    <path d="M305,221 L310,229 L315,221 Z" fill="#22252B"/>

    <text x="500" y="130" text-anchor="middle" font-size="10" fill="#8C876F" letter-spacing="1">STAGE 3</text>
    <rect x="420" y="140" width="160" height="110" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="430" y="160" font-size="11" fill="#22252B" font-weight="600">EQ: HIGH-PASS +</text>
    <text x="430" y="174" font-size="11" fill="#22252B" font-weight="600">NOTCH</text>
    <path d="M440,225 C460,225 470,200 490,200 L520,200 C525,215 535,215 540,200 L560,200" fill="none" stroke="#6B5A22" stroke-width="1.6"/>
    <text x="430" y="242" font-size="9" fill="#5A5748">Cuts rumble, tames hum</text>

    <text x="690" y="130" text-anchor="middle" font-size="10" fill="#8C876F" letter-spacing="1">STAGE 4</text>
    <rect x="610" y="140" width="160" height="110" fill="#E2D9C3" stroke="#33505E" stroke-width="1.5"/>
    <text x="620" y="160" font-size="11" fill="#33505E" font-weight="600">CLEANED DIALOGUE</text>
    <polyline points="625,208 635,198 645,212 655,200 665,210 675,196 685,214 695,202 705,208 715,197 725,211 735,203 745,207 755,205" fill="none" stroke="#33505E" stroke-width="1.3"/>
    <text x="620" y="240" font-size="9" fill="#5A5748">Noise floor reduced</text>
  </g>

  <line x1="200" y1="195" x2="225" y2="195" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M218,190 L228,195 L218,200 Z" fill="#6B5A22"/>
  <line x1="390" y1="195" x2="415" y2="195" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M408,190 L418,195 L408,200 Z" fill="#6B5A22"/>
  <line x1="580" y1="195" x2="605" y2="195" stroke="#6B5A22" stroke-width="1.6"/>
  <path d="M598,190 L608,195 L598,200 Z" fill="#6B5A22"/>

  <line x1="40" y1="280" x2="760" y2="280" stroke="#6B5A22" stroke-width="1.2"/>
  <path d="M753,275 L763,280 L753,285 Z" fill="#6B5A22"/>
  <text x="400" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">SIGNAL FLOW LEFT TO RIGHT — EACH STAGE FEEDS THE NEXT</text>

  <line x1="60" y1="330" x2="750" y2="330" stroke="#8C876F" stroke-width="1"/>
  <text x="400" y="354" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">ORDER MATTERS: REDUCE NOISE BEFORE SHAPING TONE, NOT THE OTHER WAY AROUND</text>
  <text x="400" y="378" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">Each stage removes one specific problem — never try to fix everything in a single pass.</text>

  <text x="770" y="478" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 8.5-A</text>
</svg>
