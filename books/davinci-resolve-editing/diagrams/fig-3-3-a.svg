<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">THE SYNC BIN — SAME MOMENT, EVERY ANGLE</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">SAME TIMECODE INSTANT, ACROSS SOURCES</text>

    <line x1="120" y1="105" x2="680" y2="105" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="690" y="109" font-size="10" fill="#AE3527">T</text>

    <rect x="120" y="120" width="200" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="130" y="140" font-size="11" fill="#22252B">CAM A — WIDE</text>
    <text x="130" y="156" font-size="9.5" fill="#5A5748">09:14:02:11</text>

    <rect x="120" y="176" width="200" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="130" y="196" font-size="11" fill="#22252B">CAM B — CLOSE</text>
    <text x="130" y="212" font-size="9.5" fill="#5A5748">09:14:02:11</text>

    <rect x="120" y="232" width="200" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="130" y="252" font-size="11" fill="#22252B">BOOM AUDIO</text>
    <text x="130" y="268" font-size="9.5" fill="#5A5748">09:14:02:11</text>

    <line x1="230" y1="120" x2="230" y2="278" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="450" y="90" font-size="12.5" fill="#8C876F" letter-spacing="1">SYNC BIN — ALIGNED VIEW</text>
    <rect x="450" y="120" width="230" height="158" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <rect x="460" y="132" width="210" height="40" fill="#E2D9C3" stroke="#33505E" stroke-width="1.3"/>
    <text x="470" y="156" font-size="10.5" fill="#33505E">Wide — synced</text>
    <rect x="460" y="180" width="210" height="40" fill="#E2D9C3" stroke="#33505E" stroke-width="1.3"/>
    <text x="470" y="204" font-size="10.5" fill="#33505E">Close — synced</text>
    <rect x="460" y="228" width="210" height="40" fill="#E2D9C3" stroke="#33505E" stroke-width="1.3"/>
    <text x="470" y="252" font-size="10.5" fill="#33505E">Boom — synced</text>
  </g>

  <line x1="320" y1="199" x2="450" y2="199" stroke="#6B5A22" stroke-width="1.8" stroke-dasharray="4 3"/>

  <text x="400" y="330" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">ALIGNED BY TIMECODE OR WAVEFORM — NOT GROUPED INTO ONE CLIP</text>
  <text x="400" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Scrub once, see every angle move together. Multicam grouping is a separate, heavier step.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 3.3-A</text>
</svg>
