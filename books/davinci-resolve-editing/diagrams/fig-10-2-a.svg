<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.5">THE MERGE NODE: WHERE LAYERS RE-ENTER</text>
  <line x1="140" y1="54" x2="660" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="86" font-size="11.5" fill="#8C876F" letter-spacing="1">TWO PARALLEL BRANCHES</text>

    <rect x="70" y="100" width="190" height="52" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="82" y="122" font-size="11" fill="#22252B">BACKGROUND</text>
    <text x="82" y="138" font-size="9" fill="#5A5748">MediaIn 1</text>

    <rect x="70" y="180" width="190" height="52" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="82" y="202" font-size="11" fill="#22252B">FOREGROUND</text>
    <text x="82" y="218" font-size="9" fill="#5A5748">MediaIn 2</text>

    <path d="M260 126 L 360 126 L 360 190" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <path d="M260 206 L 330 206 L 330 210" fill="none" stroke="#33505E" stroke-width="1.6"/>
    <line x1="330" y1="206" x2="360" y2="206" stroke="#33505E" stroke-width="1.6"/>

    <rect x="350" y="170" width="130" height="70" fill="#DCE6E6" stroke="#33505E" stroke-width="1.8"/>
    <text x="415" y="200" text-anchor="middle" font-size="12.5" fill="#33505E" font-weight="700">MERGE</text>
    <text x="415" y="218" text-anchor="middle" font-size="9" fill="#33505E">position · blend · size</text>

    <path d="M480 205 L 560 205" fill="none" stroke="#AE3527" stroke-width="1.6"/>

    <rect x="560" y="170" width="170" height="70" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="645" y="200" text-anchor="middle" font-size="12" fill="#22252B" font-weight="700">MEDIA OUT</text>
    <text x="645" y="218" text-anchor="middle" font-size="9" fill="#5A5748">combined result</text>
  </g>

  <line x1="70" y1="290" x2="730" y2="290" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="316" font-size="11.5" fill="#8C876F" letter-spacing="1">WHAT A LAYER STACK ASSUMES INSTEAD</text>
    <rect x="70" y="330" width="140" height="34" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="140" y="352" text-anchor="middle" font-size="9.5" fill="#5A5748">Foreground layer</text>
    <rect x="70" y="368" width="140" height="34" fill="#E2D9C3" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="140" y="390" text-anchor="middle" font-size="9.5" fill="#5A5748">Background layer</text>
    <text x="230" y="356" font-size="10.5" fill="#5A5748">stacking order</text>
    <text x="230" y="372" font-size="10.5" fill="#5A5748">implies the merge —</text>
    <text x="230" y="388" font-size="10.5" fill="#5A5748">no explicit node for it</text>
  </g>

  <text x="580" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">A Merge node makes that</text>
  <text x="580" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">combining step explicit —</text>
  <text x="580" y="385" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#22252B" font-weight="600">and adjustable on its own</text>

  <line x1="70" y1="420" x2="730" y2="420" stroke="#8C876F" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">The graph replaces the stack. The Merge node replaces "on top of."</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 10.2-A</text>
</svg>
