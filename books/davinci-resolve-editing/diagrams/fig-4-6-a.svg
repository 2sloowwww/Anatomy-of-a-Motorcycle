<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">LINKED CLIPS MOVE TOGETHER — COMPOUND CLIPS BECOME ONE</text>
  <line x1="120" y1="54" x2="680" y2="54" stroke="#8C876F" stroke-width="1"/>

  <line x1="400" y1="70" x2="400" y2="420" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="200" y="90" text-anchor="middle" font-size="13" fill="#33505E" font-weight="700">LINKED CLIP</text>

    <rect x="90" y="110" width="220" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="100" y="132" font-size="10.5" fill="#22252B">V1 — VIDEO</text>
    <text x="100" y="148" font-size="9" fill="#5A5748">Cam A</text>

    <path d="M85,156 V166 M315,156 V166" stroke="#33505E" stroke-width="1.6"/>
    <path d="M85,166 H315" stroke="#33505E" stroke-width="1.6"/>
    <text x="200" y="180" text-anchor="middle" font-size="9" fill="#33505E">linked</text>

    <rect x="90" y="190" width="220" height="34" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
    <text x="100" y="211" font-size="10.5" fill="#22252B">A1 — AUDIO</text>

    <path d="M120,250 h160" stroke="#22252B" stroke-width="1.4"/>
    <path d="M270,244 l12,6 l-12,6 Z" fill="#22252B"/>
    <text x="200" y="272" text-anchor="middle" font-size="9.5" fill="#5A5748">trim or move either half —</text>
    <text x="200" y="288" text-anchor="middle" font-size="9.5" fill="#33505E" font-weight="600">both shift identically</text>

    <text x="200" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">break the link deliberately</text>
    <text x="200" y="346" text-anchor="middle" font-size="9.5" fill="#5A5748">for an intentional split edit</text>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="600" y="90" text-anchor="middle" font-size="13" fill="#AE3527" font-weight="700">COMPOUND CLIP</text>

    <rect x="500" y="108" width="60" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="530" y="127" text-anchor="middle" font-size="8.5" fill="#22252B">clip 1</text>
    <rect x="570" y="108" width="60" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="600" y="127" text-anchor="middle" font-size="8.5" fill="#22252B">clip 2</text>
    <rect x="640" y="108" width="60" height="30" fill="#E2D9C3" stroke="#22252B" stroke-width="1.3"/>
    <text x="670" y="127" text-anchor="middle" font-size="8.5" fill="#22252B">clip 3</text>
    <rect x="495" y="102" width="210" height="42" fill="none" stroke="#AE3527" stroke-width="1.4" stroke-dasharray="4 3"/>

    <path d="M600,150 V172" stroke="#AE3527" stroke-width="1.6"/>
    <path d="M593,166 l7,10 l7,-10 Z" fill="#AE3527"/>

    <rect x="500" y="182" width="200" height="52" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.8"/>
    <line x1="533" y1="182" x2="533" y2="234" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <line x1="600" y1="182" x2="600" y2="234" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <line x1="666" y1="182" x2="666" y2="234" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <text x="600" y="252" text-anchor="middle" font-size="10" fill="#22252B" font-weight="600">one clip, one thumbnail</text>
    <text x="600" y="268" text-anchor="middle" font-size="9.5" fill="#5A5748">one block to select and move</text>

    <text x="600" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">internals stay editable —</text>
    <text x="600" y="346" text-anchor="middle" font-size="9.5" fill="#5A5748">open the compound clip to reach them</text>
  </g>

  <text x="400" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">LINKING IS AUTOMATIC AND REVERSIBLE — A COMPOUND CLIP IS A DELIBERATE, NEW OBJECT</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 4.6-A</text>
</svg>
