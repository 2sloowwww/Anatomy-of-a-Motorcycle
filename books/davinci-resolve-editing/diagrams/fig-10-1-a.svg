<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.5">COMPOSITING: ONE FRAME BUILT FROM SEVERAL</text>
  <line x1="130" y1="54" x2="670" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="82" font-size="11.5" fill="#8C876F" letter-spacing="1">THREE SEPARATE SOURCES</text>

    <rect x="70" y="94" width="260" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="82" y="118" font-size="11.5" fill="#22252B">BACKGROUND PLATE</text>
    <text x="82" y="134" font-size="9.5" fill="#5A5748">graded, from Part IX</text>

    <rect x="70" y="170" width="260" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="82" y="194" font-size="11.5" fill="#22252B">FOREGROUND — KEYED</text>
    <text x="82" y="210" font-size="9.5" fill="#5A5748">isolated via Ch. 10.3</text>

    <rect x="70" y="246" width="260" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="1.4"/>
    <text x="82" y="270" font-size="11.5" fill="#22252B">GRAPHIC / TITLE LAYER</text>
    <text x="82" y="286" font-size="9.5" fill="#5A5748">built via Ch. 10.5</text>

    <path d="M330 124 C 420 124, 420 250, 512 250" fill="none" stroke="#AE3527" stroke-width="1.6"/>
    <path d="M330 200 C 400 200, 400 250, 512 250" fill="none" stroke="#AE3527" stroke-width="1.6"/>
    <path d="M330 276 C 400 276, 400 250, 512 250" fill="none" stroke="#AE3527" stroke-width="1.6"/>

    <rect x="520" y="180" width="200" height="140" fill="#DCE6E6" stroke="#33505E" stroke-width="1.8"/>
    <text x="620" y="240" text-anchor="middle" font-size="13.5" fill="#33505E" font-weight="700">COMPOSITE</text>
    <text x="620" y="258" text-anchor="middle" font-size="13.5" fill="#33505E" font-weight="700">OUTPUT</text>
    <text x="620" y="284" text-anchor="middle" font-size="9.5" fill="#33505E">one rendered frame</text>
  </g>

  <line x1="70" y1="352" x2="730" y2="352" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">EDITING ARRANGES CLIPS IN TIME</text>
  <text x="400" y="404" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">COMPOSITING DECIDES WHAT'S INSIDE ONE FRAME</text>
  <text x="400" y="430" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">A cut page can only ever show one source at a time. This can show three, at once.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 10.1-A</text>
</svg>
