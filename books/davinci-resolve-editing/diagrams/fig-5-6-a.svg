<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">DYNAMIC TRIM — LIVE PREVIEW ON BOTH SIDES</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="200" y="88" text-anchor="middle" font-size="10.5" fill="#33505E" letter-spacing="1">OUTGOING — LAST FRAMES</text>
    <rect x="110" y="98" width="180" height="100" fill="#22252B" stroke="#33505E" stroke-width="1.8"/>
    <path d="M170,128 L170,168 L215,148 Z" fill="#E2D9C3"/>

    <text x="600" y="88" text-anchor="middle" font-size="10.5" fill="#6B5A22" letter-spacing="1">INCOMING — FIRST FRAMES</text>
    <rect x="510" y="98" width="180" height="100" fill="#22252B" stroke="#6B5A22" stroke-width="1.8"/>
    <path d="M630,128 L630,168 L585,148 Z" fill="#E2D9C3"/>

    <circle cx="400" cy="148" r="7" fill="#AE3527"/>
    <text x="400" y="128" text-anchor="middle" font-size="9.5" fill="#AE3527" font-weight="700">LIVE</text>

    <path d="M290,150 H370" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M510,150 H430" stroke="#6B5A22" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="240" font-size="12.5" fill="#8C876F" letter-spacing="1">TIMELINE — EDIT POINT MOVING DURING PLAYBACK</text>

    <rect x="100" y="250" width="250" height="60" fill="#E2D9C3" stroke="#33505E" stroke-width="1.6"/>
    <text x="225" y="284" text-anchor="middle" font-size="10.5" fill="#33505E">CLIP A — OUTGOING</text>

    <rect x="350" y="250" width="250" height="60" fill="#E2D9C3" stroke="#6B5A22" stroke-width="1.6"/>
    <text x="475" y="284" text-anchor="middle" font-size="10.5" fill="#6B5A22">CLIP B — INCOMING</text>

    <line x1="350" y1="240" x2="350" y2="320" stroke="#AE3527" stroke-width="2.4"/>
    <path d="M336,270 l-12,10 l12,10 Z" fill="#AE3527"/>
    <path d="M364,270 l12,10 l-12,10 Z" fill="#AE3527"/>
    <text x="350" y="335" text-anchor="middle" font-size="9.5" fill="#AE3527" font-weight="600">edit point slides live, in either direction</text>
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">THE PREVIEW SHOWS WHAT WILL ACTUALLY PLAY ON EACH SIDE, LIVE</text>
  <text x="400" y="422" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">static trimming checks the result after the fact — dynamic trim checks it while it happens</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 5.6-A</text>
</svg>
