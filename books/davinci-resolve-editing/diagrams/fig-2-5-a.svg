<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowRed3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowBlue3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9 L2.6,5 Z" fill="#33505E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">EDITING ON PROXIES, DELIVERING ON ORIGINALS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="92" font-size="12.5" fill="#8C876F" letter-spacing="1">ONE TIMELINE CLIP, TWO LINKED FILES</text>

    <rect x="120" y="110" width="220" height="70" fill="#E2D9C3" stroke="#AE3527" stroke-width="1.8"/>
    <text x="230" y="138" text-anchor="middle" font-size="13" fill="#AE3527" font-weight="700">CAMERA ORIGINAL</text>
    <text x="230" y="156" text-anchor="middle" font-size="10.5" fill="#5A5748">6K RAW · heavy to decode</text>
    <text x="230" y="171" text-anchor="middle" font-size="10.5" fill="#5A5748">used for grading + delivery</text>

    <rect x="460" y="110" width="220" height="70" fill="#E2D9C3" stroke="#33505E" stroke-width="1.8"/>
    <text x="570" y="138" text-anchor="middle" font-size="13" fill="#33505E" font-weight="700">PROXY FILE</text>
    <text x="570" y="156" text-anchor="middle" font-size="10.5" fill="#5A5748">lightweight, easy to scrub</text>
    <text x="570" y="171" text-anchor="middle" font-size="10.5" fill="#5A5748">used while editing</text>

    <line x1="340" y1="145" x2="460" y2="145" stroke="#6B5A22" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="400" y="138" text-anchor="middle" font-size="10" fill="#6B5A22">linked by</text>
    <text x="400" y="150" text-anchor="middle" font-size="10" fill="#6B5A22">same clip ID</text>
  </g>

  <line x1="570" y1="180" x2="230" y2="255" stroke="#33505E" stroke-width="2" marker-end="url(#arrowBlue3)"/>
  <text x="420" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#33505E">EDIT MODE — timeline plays the proxy</text>

  <rect x="120" y="265" width="560" height="60" fill="none" stroke="#22252B" stroke-width="1.6"/>
  <text x="400" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#22252B" font-weight="600">TIMELINE — SAME CLIPS, SAME CUTS</text>
  <text x="400" y="308" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5A5748">trims and edits apply identically to whichever file is active</text>

  <line x1="230" y1="325" x2="230" y2="180" stroke="#AE3527" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrowRed3)"/>
  <text x="130" y="360" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#AE3527">RENDER / GRADE MODE — switches back to the camera original</text>

  <text x="400" y="410" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">THE SWITCH IS A PROJECT SETTING, NOT A NEW EDIT</text>
  <text x="400" y="432" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Every trim you made on the proxy carries over exactly to the original.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 2.5-A</text>
</svg>
