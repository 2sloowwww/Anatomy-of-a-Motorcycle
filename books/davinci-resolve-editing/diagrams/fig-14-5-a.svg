  <line x1="70" y1="330" x2="730" y2="330" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="362" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">MARKERS FIRST, CUTS SECOND</text>
  <text x="400" y="384" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5748">Beat-marking the track turns rhythm into fixed points a picture edit can snap to, on or off the beat by choice.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 14.5-A</text>
