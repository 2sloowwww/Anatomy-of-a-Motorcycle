  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">BEAT MARKERS AND THE CUT</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="88" font-size="12.5" fill="#8C876F" letter-spacing="1">MUSIC TRACK — MARKED ON EACH BEAT</text>
    <rect x="70" y="100" width="660" height="80" fill="none" stroke="#22252B" stroke-width="1.4"/>
    <path d="M75 140 Q 95 108, 115 140 T 155 140 T 195 140 T 235 140 T 275 140 T 315 140 T 355 140 T 395 140 T 435 140 T 475 140 T 515 140 T 555 140 T 595 140 T 635 140 T 675 140 T 715 140 T 725 140" fill="none" stroke="#5A5748" stroke-width="1.3" opacity="0.8"/>

    <g stroke="#AE3527" stroke-width="1.6" stroke-dasharray="4 3">
      <line x1="115" y1="100" x2="115" y2="180"/>
      <line x1="235" y1="100" x2="235" y2="180"/>
      <line x1="355" y1="100" x2="355" y2="180"/>
      <line x1="475" y1="100" x2="475" y2="180"/>
