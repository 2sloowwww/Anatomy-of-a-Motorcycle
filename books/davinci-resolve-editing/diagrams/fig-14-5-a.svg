      <line x1="115" y1="222" x2="115" y2="292"/>
      <line x1="235" y1="222" x2="235" y2="292"/>
      <line x1="355" y1="222" x2="355" y2="292"/>
      <line x1="475" y1="222" x2="475" y2="292"/>
