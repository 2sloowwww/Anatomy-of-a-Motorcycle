  <g font-family="JetBrains Mono, monospace">
    <text x="70" y="210" font-size="12.5" fill="#8C876F" letter-spacing="1">TIMELINE — CUTS SNAPPED TO EACH MARKER</text>
    <rect x="70" y="222" width="660" height="70" fill="none" stroke="#33505E" stroke-width="1.4"/>

    <rect x="72" y="224" width="41" height="66" fill="#E2D9C3" stroke="#33505E" stroke-width="1.2"/>
    <rect x="117" y="224" width="116" height="66" fill="#E2D9C3" stroke="#33505E" stroke-width="1.2"/>
    <rect x="237" y="224" width="116" height="66" fill="#E2D9C3" stroke="#33505E" stroke-width="1.2"/>
