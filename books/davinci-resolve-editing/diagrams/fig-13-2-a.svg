<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M10,26 V10 H26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M774,10 H790 V26" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M790,474 V490 H774" fill="none" stroke="#22252B" stroke-width="1.4"/>
  <path d="M26,490 H10 V474" fill="none" stroke="#22252B" stroke-width="1.4"/>

  <text x="400" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="#6B5A22" letter-spacing="0.5">WHERE PLAYBACK ACTUALLY BOTTLENECKS</text>
  <line x1="150" y1="54" x2="650" y2="54" stroke="#8C876F" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <line x1="95" y1="120" x2="705" y2="120" stroke="#6B5A22" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="705" y="112" text-anchor="end" font-size="10" fill="#6B5A22">HARDWARE CEILING — SUSTAINED THROUGHPUT LIMIT</text>

    <rect x="95" y="115" width="130" height="165" fill="#E2D9C3" stroke="#AE3527" stroke-width="2"/>
    <text x="160" y="140" text-anchor="middle" font-size="10" fill="#AE3527" font-weight="700">OVER CEILING</text>

    <rect x="255" y="185" width="130" height="95" fill="#E2D9C3" stroke="#22252B" stroke-width="1.8"/>

    <rect x="415" y="105" width="130" height="175" fill="#E2D9C3" stroke="#AE3527" stroke-width="2"/>
    <text x="480" y="130" text-anchor="middle" font-size="10" fill="#AE3527" font-weight="700">OVER CEILING</text>

    <rect x="575" y="235" width="130" height="45" fill="#E2D9C3" stroke="#33505E" stroke-width="1.8"/>

    <line x1="70" y1="280" x2="730" y2="280" stroke="#22252B" stroke-width="1.6"/>

    <text x="160" y="300" text-anchor="middle" font-size="11.5" fill="#22252B" font-weight="600">STORAGE READ</text>
    <text x="160" y="316" text-anchor="middle" font-size="9.5" fill="#5A5748">spinning disk or</text>
    <text x="160" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">saturated network share</text>

    <text x="320" y="300" text-anchor="middle" font-size="11.5" fill="#22252B" font-weight="600">CPU DECODE</text>
    <text x="320" y="316" text-anchor="middle" font-size="9.5" fill="#5A5748">unwrapping long-GOP —</text>
    <text x="320" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">moderate, rarely critical</text>

    <text x="480" y="300" text-anchor="middle" font-size="11.5" fill="#22252B" font-weight="600">GPU PROCESS</text>
    <text x="480" y="316" text-anchor="middle" font-size="9.5" fill="#5A5748">debayer, color, effects —</text>
    <text x="480" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">the usual real limit</text>

    <text x="640" y="300" text-anchor="middle" font-size="11.5" fill="#22252B" font-weight="600">DISPLAY OUT</text>
    <text x="640" y="316" text-anchor="middle" font-size="9.5" fill="#5A5748">scaling to the monitor —</text>
    <text x="640" y="330" text-anchor="middle" font-size="9.5" fill="#5A5748">seldom the constraint</text>
  </g>

  <line x1="70" y1="356" x2="730" y2="356" stroke="#8C876F" stroke-width="1"/>

  <text x="400" y="388" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13.5" fill="#22252B" font-weight="600">STUTTER IS RARELY "RESOLVE IS SLOW" — IT'S A SPECIFIC STAGE OVER ITS CEILING</text>
  <text x="400" y="410" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">Storage and GPU are the two stages most likely to be the one that's actually out of headroom.</text>

  <text x="770" y="482" text-anchor="end" font-size="10" fill="#8C876F" letter-spacing="0.5">FIG. 13.2-A</text>
</svg>
