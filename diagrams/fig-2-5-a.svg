<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

<!-- Title -->
<text x="400" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">PISTON &#8594; CON-ROD &#8594; CRANKSHAFT</text>
<text x="400" y="61" text-anchor="middle" font-size="13" fill="#5A5748">ONE FULL STROKE &#8212; STRAIGHT-LINE PUSH BECOMES ROTATION</text>

<defs>
  <marker id="arrIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22252B"/>
  </marker>
  <marker id="arrBp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33505E"/>
  </marker>
  <marker id="arrSig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#AE3527"/>
  </marker>
</defs>

<!-- Cylinder walls -->
<line x1="235" y1="86" x2="235" y2="330" stroke="#22252B" stroke-width="2.5"/>
<line x1="375" y1="86" x2="375" y2="330" stroke="#22252B" stroke-width="2.5"/>

<!-- Ghost piston at TDC -->
<rect x="240" y="86" width="130" height="46" fill="none" stroke="#8C876F" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="215" y="103" text-anchor="end" font-size="12" fill="#8C876F">TDC</text>

<!-- Ghost piston at BDC -->
<rect x="240" y="278" width="130" height="46" fill="none" stroke="#8C876F" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="215" y="305" text-anchor="end" font-size="12" fill="#8C876F">BDC</text>

<!-- Solid piston mid-stroke -->
<rect x="240" y="172" width="130" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<text x="305" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22252B">PISTON</text>

<!-- Piston travel arrow (down centerline) -->
<line x1="305" y1="109" x2="305" y2="301" stroke="#AE3527" stroke-width="2.5" marker-end="url(#arrSig)"/>

<!-- Con-rod: piston pin to crank pin -->
<line x1="305" y1="218" x2="347" y2="393" stroke="#22252B" stroke-width="6" stroke-linecap="round"/>
<text x="358" y="300" font-size="12.5" font-weight="700" fill="#22252B" transform="rotate(76 358 300)">CON-ROD</text>

<!-- Crank pin circular path (dashed) -->
<circle cx="305" cy="428" r="58" fill="none" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- Main axis -->
<circle cx="305" cy="428" r="6" fill="#22252B"/>
<text x="305" y="452" text-anchor="middle" font-size="12" fill="#5A5748">MAIN AXIS</text>

<!-- Crank pin -->
<circle cx="347" cy="393" r="9" fill="#22252B"/>
<text x="393" y="382" font-size="12.5" font-weight="700" fill="#22252B">CRANK PIN</text>

<!-- Throw dimension -->
<line x1="305" y1="428" x2="347" y2="393" stroke="#33505E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrBp)"/>
<text x="303" y="415" text-anchor="end" font-size="12" font-weight="600" fill="#6B5A22">THROW (r)</text>

<!-- rotation direction arrow around crank circle -->
<path d="M 305 370 A 58 58 0 0 1 359 412" fill="none" stroke="#22252B" stroke-width="2" marker-end="url(#arrIn)"/>

<!-- Stroke dimension line -->
<line x1="185" y1="109" x2="185" y2="301" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="176" y1="109" x2="194" y2="109" stroke="#33505E" stroke-width="1.5"/>
<line x1="176" y1="301" x2="194" y2="301" stroke="#33505E" stroke-width="1.5"/>
<polygon points="180,118 190,118 185,105" fill="#33505E"/>
<polygon points="180,292 190,292 185,305" fill="#33505E"/>
<text x="165" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5A22" transform="rotate(-90 165 210)">STROKE</text>

<!-- Equation callout -->
<rect x="480" y="120" width="270" height="70" fill="#E2D9C3" stroke="#6B5A22" stroke-width="1.5"/>
<text x="615" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#6B5A22">STROKE = 2 &#215; THROW</text>
<text x="615" y="172" text-anchor="middle" font-size="12" fill="#5A5748">crank pin offset sets piston travel</text>

<!-- Bottom note -->
<text x="400" y="475" text-anchor="middle" font-size="13" fill="#5A5748">Crank pin is fixed to a circular path &#8212; forcing the piston's straight push to become rotation</text>
</svg>
