<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowBrass44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B5A22"/>
    </marker>
    <marker id="arrowSignal44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowInk44" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22252B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

  <text x="400" y="34" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.5">TRAIL — WHY THE FRONT WHEEL WANTS TO GO STRAIGHT</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">The contact patch trails behind where the steering axis meets the ground</text>

  <!-- direction of travel -->
  <line x1="300" y1="95" x2="380" y2="95" stroke="#8C876F" stroke-width="1.6" marker-end="url(#arrowInk44)"/>
  <text x="238" y="99" font-size="12" fill="#8C876F">TRAVEL</text>

  <!-- ground -->
  <line x1="220" y1="420" x2="600" y2="420" stroke="#22252B" stroke-width="2"/>

  <!-- steering axis extended (dashed, imaginary) -->
  <line x1="300" y1="100" x2="515" y2="420" stroke="#33505E" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="150" y="150" font-size="14" font-weight="700" fill="#33505E">STEERING AXIS</text>
  <text x="150" y="166" font-size="14" font-weight="700" fill="#33505E">EXTENDED TO GROUND</text>
  <line x1="255" y1="158" x2="345" y2="200" stroke="#33505E" stroke-width="1.3"/>

  <!-- front wheel / tyre -->
  <circle cx="450" cy="340" r="75" fill="none" stroke="#22252B" stroke-width="2.8"/>
  <circle cx="450" cy="340" r="5" fill="#22252B"/>

  <!-- axis ground point A -->
  <circle cx="515" cy="420" r="6" fill="#33505E"/>
  <!-- contact patch -->
  <rect x="432" y="415" width="36" height="10" rx="3" fill="#AE3527"/>
  <text x="450" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#AE3527">CONTACT PATCH</text>
  <text x="450" y="486" text-anchor="middle" font-size="12" fill="#5A5748">(actual tyre footprint)</text>

  <!-- trail dimension -->
  <line x1="450" y1="447" x2="515" y2="447" stroke="#6B5A22" stroke-width="1.8" marker-start="url(#arrowBrass44)" marker-end="url(#arrowBrass44)"/>
  <line x1="450" y1="425" x2="450" y2="452" stroke="#6B5A22" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="515" y1="425" x2="515" y2="452" stroke="#6B5A22" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="560" y="443" font-size="15" font-weight="700" fill="#6B5A22">TRAIL</text>

  <!-- inset: plan view showing self-correcting torque -->
  <rect x="600" y="95" width="185" height="290" fill="#E2D9C3" stroke="#22252B" stroke-width="1.6"/>
  <text x="692" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">VIEWED FROM ABOVE</text>
  <line x1="620" y1="126" x2="765" y2="126" stroke="#8C876F" stroke-width="1"/>

  <line x1="692" y1="145" x2="692" y2="360" stroke="#8C876F" stroke-width="1.4" marker-end="url(#arrowInk44)"/>
  <text x="692" y="140" text-anchor="middle" font-size="10.5" fill="#8C876F">travel</text>

  <!-- axis point A in plan view -->
  <circle cx="692" cy="175" r="6" fill="#33505E"/>
  <text x="702" y="172" font-size="11.5" fill="#33505E">axis point</text>
  <!-- neutral contact patch behind axis -->
  <line x1="692" y1="175" x2="692" y2="250" stroke="#33505E" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="692" cy="250" r="7" fill="#AE3527" opacity="0.35"/>
  <!-- disturbed contact patch, pushed sideways -->
  <circle cx="730" cy="250" r="7" fill="#AE3527"/>
  <line x1="700" y1="250" x2="723" y2="250" stroke="#AE3527" stroke-width="2.2" marker-end="url(#arrowSignal44)"/>
  <text x="700" y="238" font-size="11.5" font-weight="700" fill="#AE3527">SIDEWAYS PUSH</text>

  <!-- corrective torque arrow, curving contact patch back in line behind axis -->
  <path d="M730,257 A60,60 0 0 1 700,282" fill="none" stroke="#22252B" stroke-width="2.4" marker-end="url(#arrowInk44)"/>
  <text x="622" y="305" font-size="12.5" font-weight="700" fill="#22252B">SELF-CORRECTING</text>
  <text x="622" y="320" font-size="12.5" font-weight="700" fill="#22252B">TORQUE</text>
  <text x="622" y="338" font-size="10.5" fill="#5A5748">steers wheel back</text>
  <text x="622" y="352" font-size="10.5" fill="#5A5748">toward straight line</text>

  <text x="400" y="494" text-anchor="middle" font-size="12" fill="#8C876F" letter-spacing="0.5">FIG. 4.4-A — ANATOMY OF A MOTORCYCLE</text>
</svg>
