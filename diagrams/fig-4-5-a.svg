<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowSignal45" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AE3527"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

  <text x="400" y="32" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.5">COUNTERSTEERING — STEER RIGHT TO GO LEFT</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">Viewed from above — forward is up the page</text>

  <line x1="270" y1="66" x2="270" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="530" y1="66" x2="530" y2="450" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ PANEL 1: PUSH RIGHT BAR ============ -->
  <g>
    <text x="140" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22252B">1 · PUSH RIGHT BAR</text>
    <line x1="140" y1="104" x2="140" y2="392" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>
    <circle cx="140" cy="370" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
    <line x1="140" y1="358" x2="140" y2="222" stroke="#22252B" stroke-width="3"/>
    <line x1="140" y1="222" x2="151" y2="194" stroke="#22252B" stroke-width="3"/>
    <circle cx="151" cy="192" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
    <line x1="151" y1="192" x2="180" y2="172" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowSignal45)"/>
    <text x="184" y="168" font-size="13" font-weight="700" fill="#AE3527">PUSH</text>
    <text x="140" y="420" text-anchor="middle" font-size="11.5" fill="#5A5748">front wheel steers</text>
    <text x="140" y="435" text-anchor="middle" font-size="11.5" fill="#5A5748">briefly to the right</text>
  </g>

  <!-- ============ PANEL 2: PATCH MOVES RIGHT ============ -->
  <g>
    <text x="400" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22252B">2 · PATCH MOVES, MASS DOESN'T</text>
    <line x1="400" y1="104" x2="400" y2="392" stroke="#33505E" stroke-width="1.6" stroke-dasharray="6 4"/>
    <circle cx="400" cy="370" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
    <line x1="400" y1="358" x2="400" y2="292" stroke="#22252B" stroke-width="3"/>
    <circle cx="400" cy="278" r="7" fill="#AE3527"/>
    <line x1="400" y1="271" x2="430" y2="204" stroke="#22252B" stroke-width="3"/>
    <circle cx="432" cy="192" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
    <line x1="400" y1="192" x2="432" y2="192" stroke="#AE3527" stroke-width="1.6" stroke-dasharray="3 3"/>
    <text x="285" y="240" font-size="12.5" font-weight="700" fill="#AE3527">MASS CONTINUES</text>
    <text x="285" y="255" font-size="12.5" font-weight="700" fill="#AE3527">STRAIGHT</text>
    <line x1="330" y1="250" x2="398" y2="278" stroke="#AE3527" stroke-width="1.2"/>
    <text x="450" y="185" font-size="12.5" font-weight="700" fill="#6B5A22">CONTACT PATCH</text>
    <text x="450" y="200" font-size="12.5" font-weight="700" fill="#6B5A22">DISPLACED RIGHT</text>
    <text x="400" y="420" text-anchor="middle" font-size="11.5" fill="#5A5748">base of support shifts</text>
    <text x="400" y="435" text-anchor="middle" font-size="11.5" fill="#5A5748">out from under the bike</text>
  </g>

  <!-- ============ PANEL 3: LEANS LEFT, TURNS LEFT ============ -->
  <g>
    <text x="665" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22252B">3 · LEANS LEFT, TURNS LEFT</text>
    <path d="M665,392 L665,300 Q662,205 605,118" fill="none" stroke="#AE3527" stroke-width="2.6" marker-end="url(#arrowSignal45)"/>
    <circle cx="665" cy="370" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>
    <line x1="663" y1="358" x2="642" y2="235" stroke="#22252B" stroke-width="3"/>
    <circle cx="640" cy="222" r="12" fill="#E2D9C3" stroke="#22252B" stroke-width="2.2"/>

    <circle cx="720" cy="330" r="27" fill="none" stroke="#33505E" stroke-width="1.4" stroke-dasharray="3 3"/>
    <line x1="720" y1="330" x2="705" y2="304" stroke="#22252B" stroke-width="2.4"/>
    <text x="720" y="365" text-anchor="middle" font-size="10.5" fill="#33505E">LEAN</text>

    <text x="600" y="160" text-anchor="end" font-size="13" font-weight="700" fill="#AE3527">TURNS LEFT</text>
    <text x="665" y="420" text-anchor="middle" font-size="11.5" fill="#5A5748">same direction as lean —</text>
    <text x="665" y="435" text-anchor="middle" font-size="11.5" fill="#5A5748">opposite the initial push</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#8C876F" letter-spacing="0.5">FIG. 4.5-A — ANATOMY OF A MOTORCYCLE</text>
</svg>
