<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

<!-- Title -->
<text x="400" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">TORQUE &amp; POWER VS. RPM</text>
<text x="400" y="64" text-anchor="middle" font-size="13" fill="#5A5748">PEAK POWER ALWAYS ARRIVES AFTER PEAK TORQUE</text>

<!-- Axes -->
<line x1="95" y1="400" x2="740" y2="400" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="730,394 730,406 742,400" fill="#33505E"/>
<text x="700" y="424" text-anchor="middle" font-size="14" fill="#33505E">RPM →</text>

<line x1="95" y1="400" x2="95" y2="90" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="89,100 101,100 95,88" fill="#33505E"/>
<text x="95" y="82" text-anchor="middle" font-size="12" fill="#33505E">OUTPUT (RELATIVE)</text>

<!-- Torque curve -->
<path d="M 95 372 C 220 300, 320 130, 400 128 C 480 126, 560 220, 700 300"
      fill="none" stroke="#22252B" stroke-width="2.5"/>

<!-- Power curve -->
<path d="M 95 392 C 250 340, 420 150, 560 118 C 620 108, 680 130, 700 150"
      fill="none" stroke="#AE3527" stroke-width="2.5"/>

<!-- Torque peak marker -->
<circle cx="400" cy="128" r="5" fill="#22252B"/>
<line x1="400" y1="128" x2="400" y2="400" stroke="#33505E" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="400" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">TORQUE PEAK</text>

<!-- Power peak marker -->
<circle cx="560" cy="118" r="5" fill="#AE3527"/>
<line x1="560" y1="118" x2="560" y2="400" stroke="#33505E" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="560" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">POWER PEAK</text>

<!-- Gap annotation -->
<line x1="400" y1="440" x2="560" y2="440" stroke="#AE3527" stroke-width="1.6"/>
<polygon points="408,435 408,445 398,440" fill="#AE3527"/>
<polygon points="552,435 552,445 562,440" fill="#AE3527"/>
<text x="480" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#AE3527">POWER PEAKS LATER, ALWAYS</text>

<!-- Curve labels -->
<text x="245" y="255" font-size="14" font-weight="700" fill="#22252B">TORQUE</text>
<text x="620" y="205" font-size="14" font-weight="700" fill="#AE3527">POWER</text>

<!-- Formula plate -->
<rect x="130" y="94" width="260" height="46" fill="#E2D9C3" stroke="#22252B" stroke-width="1.5"/>
<text x="260" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5A22">POWER = TORQUE × RPM</text>
<text x="260" y="132" text-anchor="middle" font-size="12" fill="#6B5A22">(÷ 5,252 FOR HP; ÷ 9,550 FOR kW)</text>
</svg>
