<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<defs>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22252B"/>
  </marker>
  <marker id="arrowFaint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8C876F"/>
  </marker>
</defs>

<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B" letter-spacing="0.5">STAYING IN THE PRODUCTIVE BAND</text>
<text x="400" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5748">Same RPM axis, two views: the torque curve, and each gear's road-speed range</text>

<!-- shared productive RPM band across both panels -->
<rect x="55" y="150" width="705" height="160" fill="#6B5A22" fill-opacity="0.13"/>
<line x1="55" y1="150" x2="760" y2="150" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="55" y1="310" x2="760" y2="310" stroke="#33505E" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="145" font-size="10.5" fill="#33505E" text-anchor="start">TOP OF BAND</text>
<text x="60" y="325" font-size="10.5" fill="#33505E" text-anchor="start">BOTTOM OF BAND</text>

<!-- redline reference -->
<line x1="55" y1="94" x2="760" y2="94" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="88" font-size="10" fill="#8C876F">REDLINE</text>

<!-- ================= LEFT PANEL: TORQUE CURVE ================= -->
<text x="140" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22252B">ENGINE TORQUE CURVE</text>

<!-- RPM axis (vertical, shared) -->
<line x1="230" y1="90" x2="230" y2="400" stroke="#22252B" stroke-width="2.5"/>
<text x="238" y="90" font-size="11" fill="#5A5748">MAX RPM</text>
<text x="238" y="404" font-size="11" fill="#5A5748">IDLE</text>

<!-- shaded productive portion of curve -->
<path d="M230,310 C185,300 90,260 90,232 C90,204 190,164 230,150 Z" fill="#AE3527" fill-opacity="0.14"/>

<!-- torque curve -->
<path d="M230,398 C160,384 90,300 90,232 C90,162 178,112 205,92" fill="none" stroke="#22252B" stroke-width="2.5"/>

<!-- torque axis label -->
<line x1="225" y1="415" x2="70" y2="415" stroke="#33505E" stroke-width="1.5" marker-end="url(#arrowFaint)"/>
<text x="145" y="432" text-anchor="middle" font-size="11.5" fill="#33505E">TORQUE &#8594;</text>

<text x="140" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#AE3527">STRONG, USABLE HERE</text>

<!-- divider between panels -->
<line x1="262" y1="90" x2="262" y2="420" stroke="#8C876F" stroke-width="1" stroke-dasharray="2 3"/>

<!-- ================= RIGHT PANEL: GEAR RATIOS vs ROAD SPEED ================= -->
<text x="510" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22252B">GEAR RATIOS ACROSS ROAD SPEED</text>

<!-- road speed axis -->
<line x1="280" y1="400" x2="760" y2="400" stroke="#22252B" stroke-width="2.5"/>
<line x1="760" y1="400" x2="782" y2="400" stroke="#22252B" stroke-width="2.5" marker-end="url(#arrowInk)"/>
<text x="752" y="418" text-anchor="end" font-size="12" fill="#5A5748">ROAD SPEED &#8594;</text>
<text x="284" y="416" font-size="11" fill="#5A5748">0</text>

<!-- gear lines: solid within band, faint dashed leading in/out -->
<!-- gear 1 -->
<line x1="280" y1="400" x2="400" y2="150" stroke="#22252B" stroke-width="2.6"/>
<text x="322" y="270" font-size="15" font-weight="700" fill="#6B5A22">1</text>

<!-- shift 1->2 -->
<line x1="400" y1="150" x2="400" y2="310" stroke="#8C876F" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrowFaint)"/>

<!-- gear 2 -->
<line x1="400" y1="310" x2="520" y2="150" stroke="#22252B" stroke-width="2.6"/>
<text x="448" y="255" font-size="15" font-weight="700" fill="#6B5A22">2</text>

<!-- shift 2->3 -->
<line x1="520" y1="150" x2="520" y2="310" stroke="#8C876F" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrowFaint)"/>

<!-- gear 3 -->
<line x1="520" y1="310" x2="640" y2="150" stroke="#22252B" stroke-width="2.6"/>
<text x="568" y="255" font-size="15" font-weight="700" fill="#6B5A22">3</text>

<!-- shift 3->4 -->
<line x1="640" y1="150" x2="640" y2="310" stroke="#8C876F" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrowFaint)"/>

<!-- gear 4 (top gear, widest speed range, doesn't need full band) -->
<line x1="640" y1="310" x2="760" y2="205" stroke="#AE3527" stroke-width="2.8"/>
<text x="705" y="240" font-size="15" font-weight="700" fill="#AE3527">4</text>

<text x="510" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#6B5A22">EACH GEAR RE-ENTERS THE SAME BAND, OVER A WIDER SPEED RANGE</text>

<text x="400" y="480" text-anchor="middle" font-size="13" font-weight="600" fill="#22252B">ONE TORQUE CURVE &#8212; A LADDER OF RATIOS KEEPS THE ENGINE INSIDE IT</text>
</svg>
