<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<defs>
  <marker id="arrBp18" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33505E"/>
  </marker>
  <marker id="arrInk18" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22252B"/>
  </marker>
  <marker id="arrSig18" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#AE3527"/>
  </marker>
</defs>
<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

<!-- Title -->
<text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B">TWO-STROKE PORTING NEAR BDC</text>
<text x="400" y="59" text-anchor="middle" font-size="13" fill="#5A5748">INTAKE, TRANSFER, AND EXHAUST ALL OPEN TOGETHER</text>

<!-- Cylinder head (closed top) -->
<line x1="300" y1="80" x2="500" y2="80" stroke="#22252B" stroke-width="3"/>
<polygon points="392,80 408,80 400,68" fill="#22252B"/>
<line x1="408" y1="72" x2="530" y2="72" stroke="#8C876F" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="536" y="76" font-size="11" fill="#5A5748">SPARK PLUG</text>

<!-- Cylinder walls (upper) -->
<line x1="300" y1="80" x2="300" y2="230" stroke="#22252B" stroke-width="2.5"/>
<line x1="500" y1="80" x2="500" y2="200" stroke="#22252B" stroke-width="2.5"/>
<!-- exhaust port gap in right wall -->
<line x1="500" y1="240" x2="500" y2="310" stroke="#22252B" stroke-width="2.5"/>
<!-- transfer port gap in left wall -->
<line x1="300" y1="270" x2="300" y2="310" stroke="#22252B" stroke-width="2.5"/>

<!-- gas cloud inside chamber: fresh charge (left, blueprint) vs exhaust gas (right, faint) -->
<circle cx="345" cy="150" r="10" fill="#33505E" fill-opacity="0.35"/>
<circle cx="365" cy="120" r="7" fill="#33505E" fill-opacity="0.35"/>
<circle cx="330" cy="185" r="8" fill="#33505E" fill-opacity="0.35"/>
<circle cx="455" cy="150" r="10" fill="#8C876F" fill-opacity="0.5"/>
<circle cx="440" cy="115" r="7" fill="#8C876F" fill-opacity="0.5"/>
<circle cx="465" cy="185" r="8" fill="#8C876F" fill-opacity="0.5"/>

<text x="330" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#33505E">FRESH CHARGE</text>
<text x="465" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A5748">EXHAUST GAS</text>

<!-- short-circuit warning arrow (signal) -->
<path d="M 320 250 C 340 170, 430 150, 493 232" fill="none" stroke="#AE3527" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#arrSig18)"/>
<text x="400" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#AE3527">SOME FRESH CHARGE CAN SHORT-CIRCUIT STRAIGHT TO EXHAUST</text>

<!-- exhaust port + pipe -->
<rect x="500" y="240" width="90" height="70" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<text x="545" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22252B">EXHAUST</text>
<text x="545" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22252B">PORT</text>
<line x1="545" y1="235" x2="545" y2="200" stroke="#5A5748" stroke-width="2" marker-end="url(#arrInk18)"/>

<!-- transfer port + passage -->
<rect x="210" y="270" width="90" height="40" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<text x="255" y="295" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22252B">TRANSFER</text>
<line x1="255" y1="270" x2="255" y2="200" stroke="#33505E" stroke-width="2" marker-end="url(#arrBp18)"/>

<!-- piston near BDC, deflector crown -->
<path d="M 300 320 L 320 305 L 480 305 L 500 320 L 500 400 L 300 400 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<text x="400" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#22252B">PISTON</text>
<text x="400" y="382" text-anchor="middle" font-size="11" fill="#5A5748">(near BDC)</text>

<!-- crankcase pumping chamber -->
<rect x="255" y="400" width="290" height="70" fill="#EEE8DA" stroke="#22252B" stroke-width="2.5"/>
<text x="400" y="430" text-anchor="middle" font-size="11.5" fill="#5A5748">CRANKCASE (PUMPING CHAMBER)</text>

<!-- intake port -->
<rect x="150" y="415" width="70" height="35" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<text x="185" y="437" text-anchor="middle" font-size="10.5" font-weight="700" fill="#22252B">INTAKE</text>
<line x1="255" y1="432" x2="222" y2="432" stroke="#33505E" stroke-width="2" marker-end="url(#arrBp18)"/>
</svg>
