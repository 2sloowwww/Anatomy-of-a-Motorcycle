<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowBrass48" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B5A22"/>
    </marker>
    <marker id="arrowSignal48" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowFaint48" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8C876F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

  <text x="400" y="34" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.5">WHEELBASE — TWO COMPONENTS, ONE MEASUREMENT</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">Swingarm length is one of the two dimensions that together set the total span</text>

  <!-- ground -->
  <line x1="70" y1="400" x2="730" y2="400" stroke="#22252B" stroke-width="2"/>

  <!-- wheels -->
  <circle cx="250" cy="400" r="48" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="250" cy="400" r="5" fill="#22252B"/>
  <circle cx="590" cy="400" r="48" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="590" cy="400" r="5" fill="#22252B"/>

  <!-- swingarm highlighted -->
  <line x1="350" y1="335" x2="250" y2="400" stroke="#AE3527" stroke-width="6" opacity="0.85"/>
  <!-- front-end frame (other component) -->
  <line x1="496" y1="207" x2="350" y2="335" stroke="#22252B" stroke-width="4"/>
  <!-- fork -->
  <line x1="496" y1="207" x2="590" y2="400" stroke="#22252B" stroke-width="4.5"/>

  <circle cx="350" cy="335" r="8" fill="#AE3527"/>
  <circle cx="350" cy="335" r="8" fill="none" stroke="#22252B" stroke-width="1.6"/>

  <!-- engine block -->
  <rect x="360" y="285" width="95" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- fuel tank -->
  <path d="M428,203 Q468,183 503,203 L503,224 Q465,214 428,224 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- seat -->
  <path d="M328,300 L408,289 L408,304 L328,315 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- handlebar -->
  <line x1="496" y1="207" x2="470" y2="179" stroke="#22252B" stroke-width="3.5"/>

  <!-- swingarm pivot label -->
  <text x="290" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527">SWINGARM</text>
  <text x="290" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527">PIVOT</text>
  <line x1="310" y1="298" x2="345" y2="330" stroke="#AE3527" stroke-width="1.2"/>

  <!-- swingarm length dimension (nested, close to bike) -->
  <line x1="250" y1="422" x2="350" y2="422" stroke="#AE3527" stroke-width="1.8" marker-start="url(#arrowSignal48)" marker-end="url(#arrowSignal48)"/>
  <line x1="250" y1="402" x2="250" y2="428" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="350" y1="337" x2="350" y2="428" stroke="#AE3527" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#AE3527">SWINGARM LENGTH</text>

  <!-- front-end geometry span (other component), faint -->
  <line x1="350" y1="422" x2="590" y2="422" stroke="#8C876F" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arrowFaint48)" marker-end="url(#arrowFaint48)"/>
  <line x1="590" y1="402" x2="590" y2="428" stroke="#8C876F" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="470" y="440" text-anchor="middle" font-size="11.5" fill="#8C876F">FRONT-END GEOMETRY</text>

  <!-- total wheelbase dimension -->
  <line x1="250" y1="470" x2="590" y2="470" stroke="#6B5A22" stroke-width="2" marker-start="url(#arrowBrass48)" marker-end="url(#arrowBrass48)"/>
  <text x="420" y="489" text-anchor="middle" font-size="16" font-weight="700" fill="#6B5A22">WHEELBASE</text>

  <text x="400" y="497" text-anchor="middle" font-size="12" fill="#8C876F" letter-spacing="0.5">FIG. 4.8-A — ANATOMY OF A MOTORCYCLE</text>
</svg>
