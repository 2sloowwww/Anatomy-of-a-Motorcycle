<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
<defs>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22252B"/>
  </marker>
  <marker id="arrowSignal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#AE3527"/>
  </marker>
</defs>

<rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#22252B" letter-spacing="0.5">THREE PATHS TO THE REAR WHEEL</text>
<text x="400" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#5A5748">Same job, gearbox output to rear wheel &#8212; three different mechanical routes</text>

<line x1="270" y1="75" x2="270" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="535" y1="75" x2="535" y2="440" stroke="#8C876F" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ================= PANEL 1: CHAIN ================= -->
<text x="135" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#22252B">CHAIN</text>

<path d="M124,145 L249,303 A52,52 0 0 1 161,357 L76,175 A28,28 0 0 1 124,145 Z"
      fill="none" stroke="#22252B" stroke-width="2.5"/>
<!-- link tick marks along the two straight runs -->
<g stroke="#22252B" stroke-width="1.6">
  <line x1="138.8" y1="171.8" x2="146.7" y2="165.6"/>
  <line x1="157.6" y1="195.5" x2="165.4" y2="189.3"/>
  <line x1="176.3" y1="219.2" x2="184.2" y2="213.0"/>
  <line x1="195.1" y1="242.9" x2="202.9" y2="236.7"/>
  <line x1="213.8" y1="266.6" x2="221.7" y2="260.4"/>
  <line x1="84.2" y1="204.4" x2="93.3" y2="200.2"/>
  <line x1="97.0" y1="231.7" x2="106.0" y2="227.5"/>
  <line x1="109.7" y1="259.0" x2="118.8" y2="254.8"/>
  <line x1="122.5" y1="286.3" x2="131.5" y2="282.1"/>
  <line x1="135.2" y1="313.6" x2="144.3" y2="309.4"/>
</g>

<circle cx="100" cy="160" r="28" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<circle cx="100" cy="160" r="7" fill="#22252B"/>
<circle cx="205" cy="330" r="52" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<circle cx="205" cy="330" r="9" fill="#22252B"/>

<path d="M78,140 A28,28 0 0 1 122,140" fill="none" stroke="#22252B" stroke-width="2.2" marker-end="url(#arrowInk)"/>
<path d="M165,300 A52,52 0 0 1 245,300" fill="none" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowSignal)"/>

<text x="100" y="118" text-anchor="middle" font-size="10" fill="#5A5748">GEARBOX OUT</text>
<text x="205" y="410" text-anchor="middle" font-size="10" fill="#5A5748">REAR WHEEL</text>
<text x="135" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#6B5A22">LIGHT, EFFICIENT, EXPOSED</text>

<!-- ================= PANEL 2: BELT ================= -->
<text x="405" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#22252B">BELT</text>

<path d="M404,145 L529,303 A52,52 0 0 1 441,357 L356,175 A28,28 0 0 1 404,145 Z"
      fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<!-- toothed inner edge notches -->
<g stroke="#8C876F" stroke-width="1.3">
  <line x1="392" y1="168" x2="399" y2="176"/>
  <line x1="405" y1="188" x2="412" y2="196"/>
  <line x1="418" y1="208" x2="425" y2="216"/>
  <line x1="431" y1="228" x2="438" y2="236"/>
  <line x1="444" y1="248" x2="451" y2="256"/>
  <line x1="457" y1="268" x2="464" y2="276"/>
  <line x1="470" y1="288" x2="477" y2="296"/>
</g>

<circle cx="380" cy="160" r="28" fill="#EEE8DA" stroke="#22252B" stroke-width="2.5"/>
<circle cx="380" cy="160" r="7" fill="#22252B"/>
<circle cx="485" cy="330" r="52" fill="#EEE8DA" stroke="#22252B" stroke-width="2.5"/>
<circle cx="485" cy="330" r="9" fill="#22252B"/>

<path d="M358,140 A28,28 0 0 1 402,140" fill="none" stroke="#22252B" stroke-width="2.2" marker-end="url(#arrowInk)"/>
<path d="M445,300 A52,52 0 0 1 525,300" fill="none" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowSignal)"/>

<text x="380" y="118" text-anchor="middle" font-size="10" fill="#5A5748">GEARBOX OUT</text>
<text x="485" y="410" text-anchor="middle" font-size="10" fill="#5A5748">REAR WHEEL</text>
<text x="405" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#6B5A22">QUIET, NEARLY MAINTENANCE-FREE</text>

<!-- ================= PANEL 3: SHAFT ================= -->
<text x="665" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#22252B">SHAFT</text>

<circle cx="605" cy="165" r="26" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<circle cx="605" cy="165" r="7" fill="#22252B"/>
<text x="605" y="123" text-anchor="middle" font-size="10" fill="#5A5748">GEARBOX OUT</text>

<!-- enclosed tube housing -->
<line x1="620" y1="180" x2="695" y2="290" stroke="#22252B" stroke-width="24" stroke-linecap="round"/>
<line x1="620" y1="180" x2="695" y2="290" stroke="#33505E" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M615,150 A26,26 0 0 1 640,185" fill="none" stroke="#22252B" stroke-width="2.2" marker-end="url(#arrowInk)"/>

<!-- bevel gear housing at wheel -->
<rect x="660" y="285" width="90" height="70" fill="#E2D9C3" stroke="#22252B" stroke-width="2.5"/>
<circle cx="695" cy="305" r="18" fill="none" stroke="#22252B" stroke-width="2.5"/>
<circle cx="725" cy="335" r="24" fill="none" stroke="#22252B" stroke-width="2.5"/>
<g stroke="#AE3527" stroke-width="2">
  <line x1="705" y1="313" x2="712" y2="320"/>
  <line x1="700" y1="322" x2="717" y2="315"/>
</g>
<text x="705" y="373" text-anchor="middle" font-size="10" fill="#5A5748">BEVEL GEARS</text>

<path d="M745,318 A24,24 0 0 1 720,357" fill="none" stroke="#AE3527" stroke-width="2.4" marker-end="url(#arrowSignal)"/>

<!-- wheel suggestion -->
<circle cx="735" cy="340" r="55" fill="none" stroke="#8C876F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="725" y="412" text-anchor="middle" font-size="10" fill="#5A5748">REAR WHEEL</text>

<text x="695" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#6B5A22">ENCLOSED, DURABLE, HEAVIEST</text>

<text x="400" y="465" text-anchor="middle" font-size="14" font-weight="600" fill="#22252B">NO TYPE IS OBJECTIVELY BEST &#8212; EACH TRADES WEIGHT AGAINST UPKEEP</text>
</svg>
