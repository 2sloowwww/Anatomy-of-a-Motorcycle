<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22252B"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AE3527"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

  <text x="400" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19" fill="#6B5A22" letter-spacing="0.3">COUPLING MAP — A NETWORK, NOT A PARTS LIST</text>
  <line x1="130" y1="48" x2="670" y2="48" stroke="#8C876F" stroke-width="1"/>

  <!-- legend -->
  <line x1="60" y1="466" x2="95" y2="466" stroke="#22252B" stroke-width="2.2" marker-end="url(#aInk)"/>
  <text x="102" y="470" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">MECHANICAL COUPLING</text>
  <line x1="290" y1="466" x2="325" y2="466" stroke="#AE3527" stroke-width="2.2" marker-end="url(#aRed)"/>
  <text x="332" y="470" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#5A5748">RIDER COUPLING</text>

  <!-- ================= RIDER-TO-NODE LINES (drawn first, under boxes) ================= -->
  <g stroke="#AE3527" stroke-width="1.6" marker-end="url(#aRed)" opacity="0.85">
    <line x1="655" y1="185" x2="216" y2="130"/>
    <line x1="655" y1="195" x2="416" y2="130"/>
    <line x1="655" y1="230" x2="216" y2="285"/>
    <line x1="655" y1="245" x2="416" y2="285"/>
    <line x1="655" y1="255" x2="606" y2="285"/>
  </g>

  <!-- ================= MECHANICAL COUPLING ARROWS ================= -->
  <g stroke="#22252B" stroke-width="2.2" marker-end="url(#aInk)">
    <line x1="210" y1="130" x2="285" y2="130"/>
    <line x1="410" y1="130" x2="485" y2="130"/>
  </g>
  <g stroke="#22252B" stroke-width="2.2" marker-end="url(#aInk)" marker-start="url(#aInk)">
    <line x1="210" y1="285" x2="285" y2="285"/>
    <line x1="410" y1="285" x2="485" y2="285"/>
  </g>
  <line x1="550" y1="155" x2="550" y2="260" stroke="#22252B" stroke-width="2.2" marker-end="url(#aInk)"/>
  <text x="558" y="212" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#5A5748">drives</text>

  <!-- ================= NODES ================= -->
  <!-- Engine -->
  <rect x="80" y="105" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="150" y="135" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#22252B">ENGINE</text>

  <!-- Transmission -->
  <rect x="280" y="105" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="350" y="129" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">TRANSMIS-</text>
  <text x="350" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">SION</text>

  <!-- Final Drive -->
  <rect x="480" y="105" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="550" y="129" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">FINAL</text>
  <text x="550" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">DRIVE</text>

  <!-- Chassis Geometry -->
  <rect x="80" y="260" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="150" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">CHASSIS</text>
  <text x="150" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#22252B">GEOMETRY</text>

  <!-- Suspension -->
  <rect x="280" y="260" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="350" y="291" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#22252B">SUSPENSION</text>

  <!-- Tyres -->
  <rect x="480" y="260" width="140" height="50" rx="7" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <text x="550" y="291" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#22252B">TYRES</text>

  <!-- Rider (special node) -->
  <circle cx="700" cy="220" r="62" fill="#E2D9C3" stroke="#AE3527" stroke-width="2.6"/>
  <text x="700" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#AE3527">RIDER</text>
  <text x="700" y="233" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#5A5748">(a node, not</text>
  <text x="700" y="246" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#5A5748">an operator)</text>

  <text x="400" y="472" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#8C876F" letter-spacing="0.5">FIG. 1.3-A — ANATOMY OF A MOTORCYCLE</text>
</svg>
