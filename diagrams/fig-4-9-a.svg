<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowSignal49" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AE3527"/>
    </marker>
    <marker id="arrowBlue49" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#33505E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#EEE8DA"/>

  <text x="400" y="34" text-anchor="middle" font-weight="700" font-size="20" fill="#22252B" letter-spacing="0.5">RIGIDITY HAS DIRECTIONS</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5A5748">High torsional stiffness where load precision matters; controlled flex elsewhere helps grip</text>

  <!-- ground with a small road irregularity -->
  <path d="M70,400 L130,400 Q170,382 210,400 L730,400" fill="none" stroke="#22252B" stroke-width="2"/>
  <text x="170" y="425" text-anchor="middle" font-size="11.5" fill="#5A5748">road irregularity</text>

  <!-- wheels -->
  <circle cx="250" cy="400" r="48" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="250" cy="400" r="5" fill="#22252B"/>
  <circle cx="590" cy="400" r="48" fill="none" stroke="#22252B" stroke-width="2.5"/>
  <circle cx="590" cy="400" r="5" fill="#22252B"/>

  <!-- frame -->
  <line x1="496" y1="207" x2="350" y2="335" stroke="#22252B" stroke-width="4"/>
  <line x1="350" y1="335" x2="250" y2="400" stroke="#22252B" stroke-width="4"/>
  <line x1="496" y1="207" x2="590" y2="400" stroke="#22252B" stroke-width="4.5"/>
  <circle cx="350" cy="335" r="6" fill="#22252B"/>

  <!-- engine block -->
  <rect x="360" y="285" width="95" height="60" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- fuel tank -->
  <path d="M428,203 Q468,183 503,203 L503,224 Q465,214 428,224 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <!-- handlebar -->
  <line x1="496" y1="207" x2="470" y2="179" stroke="#22252B" stroke-width="3.5"/>

  <!-- seat / rear subframe, with dashed flex ghost -->
  <path d="M328,300 L408,289 L408,304 L328,315 Z" fill="#E2D9C3" stroke="#22252B" stroke-width="2"/>
  <path d="M328,306 L408,295 L408,310 L328,321 Z" fill="none" stroke="#33505E" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.85"/>
  <line x1="368" y1="292" x2="368" y2="318" stroke="#33505E" stroke-width="1.6" marker-start="url(#arrowBlue49)" marker-end="url(#arrowBlue49)"/>

  <!-- torsional rigidity torque icon on main backbone -->
  <g transform="translate(423,271)">
    <path d="M-22,-10 A24,24 0 0 1 10,-24" fill="none" stroke="#AE3527" stroke-width="3" marker-end="url(#arrowSignal49)"/>
    <path d="M22,10 A24,24 0 0 1 -10,24" fill="none" stroke="#AE3527" stroke-width="3" marker-end="url(#arrowSignal49)"/>
  </g>

  <text x="180" y="150" font-size="14" font-weight="700" fill="#AE3527">TORSIONAL RIGIDITY —</text>
  <text x="180" y="166" font-size="14" font-weight="700" fill="#AE3527">HIGH-STIFFNESS AXIS</text>
  <line x1="240" y1="172" x2="400" y2="255" stroke="#AE3527" stroke-width="1.3"/>

  <text x="560" y="270" font-size="14" font-weight="700" fill="#33505E">LATERAL FLEX ZONE</text>
  <text x="560" y="286" font-size="12.5" fill="#5A5748">absorbs a small bump</text>
  <text x="560" y="301" font-size="12.5" fill="#5A5748">before it reaches the</text>
  <text x="560" y="316" font-size="12.5" fill="#5A5748">rear suspension</text>
  <line x1="558" y1="278" x2="410" y2="303" stroke="#33505E" stroke-width="1.3"/>

  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#8C876F" letter-spacing="0.5">FIG. 4.9-A — ANATOMY OF A MOTORCYCLE</text>
</svg>
